  let agcEnv = 0.2, inputGain = 1.0;
  // auto-exposure: a slow envelope of overall loudness. Transients spike bright
  // first (adapt hasn't caught up), then brightness settles as it rises.
  let expoAdapt=0;
  function exposure(energy){
    const rate = energy > expoAdapt ? 0.035 : 0.012;   // rise ~0.5s, fall slower
    expoAdapt += (energy - expoAdapt) * rate;
    return Math.max(0.42, 1.0 / (1.0 + expoAdapt*1.7)); // sustained-loud settles darker
  }
  // calm mode: dampens flashing/strobe/punch (feeds u_safe). Default honors the OS setting.
  let safe = false;
  function safeVal(){ return safe ? 0.2 : 1.0; }

  // ---- deeper listening: onsets, tempo, key ----------------------------------
  // The bass-only detector could REACT but never ANTICIPATE, and it went nearly deaf
  // on tracks without a kick. Spectral flux gives broadband onsets; autocorrelating
  // the onset envelope over ~6s gives a tempo and a phase, so the visuals can sit on
  // the grid instead of chasing it. Chroma gives the key, which drifts the palette.
  const FLUX_N = 384;                       // ~6.4s of onset envelope at 60Hz
  const fluxHist = new Float32Array(FLUX_N);
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  let prevSpec = null, fluxHead = 0, fluxPeak = 0, fluxT = 0;
  let fluxMean = 0, fluxVar = 0, onset = 0, lastOnsetT = 0;
  let bpm = 0, bpmConf = 0, beatPeriod = 0, beatPhase = 0, beatCount = 0, barPhase = 0, tempoT = 0;
  const chroma = new Float32Array(12), chromaAcc = new Float32Array(12);
  let chromaBins = null, keyIdx = -1, keyConf = 0, harmHue = 0, hueX = 1, hueY = 0;

  function buildChromaBins(){
    const sr = (audioCtx && audioCtx.sampleRate) || 44100;
    const n = analyser ? analyser.fftSize : 2048;
    chromaBins = new Int8Array(freqData.length).fill(-1);
    for (let i=1;i<freqData.length;i++){
      const f = i*sr/n;
      if (f < 65 || f > 2100) continue;          // fundamental range; above it is mostly noise
      const midi = 69 + 12*Math.log2(f/440);
      chromaBins[i] = ((Math.round(midi) % 12) + 12) % 12;
    }
  }
  // sum of positive bin-to-bin change = energy ARRIVING, which is what an onset is.
  function spectralFlux(){
    if (!prevSpec) prevSpec = new Float32Array(freqData.length);
    let f = 0;
    for (let i=2;i<400 && i<freqData.length;i++){
      const v = freqData[i]/255, d = v - prevSpec[i];
      if (d > 0) f += d;
      prevSpec[i] = v;
    }
    return Math.min(1.5, f/45);
  }
  // autocorrelate the onset envelope; the strongest lag in the 69-180 BPM band wins
  function estimateTempo(){
    let mean = 0;
    for (let i=0;i<FLUX_N;i++) mean += fluxHist[i];
    mean /= FLUX_N;
    let best = 0, bestLag = 0, sum = 0, cnt = 0;
    for (let lag=20; lag<=52; lag++){
      let s = 0;
      const n = FLUX_N - lag;
      for (let i=0;i<n;i++){
        s += (fluxHist[(fluxHead+i)%FLUX_N] - mean) * (fluxHist[(fluxHead+i+lag)%FLUX_N] - mean);
      }
      s /= n;
      sum += s; cnt++;
      if (s > best){ best = s; bestLag = lag; }
    }
    const avg = sum/Math.max(1,cnt);
    bpmConf = avg > 1e-9 ? Math.min(1, (best/avg - 1)/2.5) : 0;
    if (bestLag && bpmConf > 0.25){
      const nb = 3600/bestLag;                      // lag is in 60Hz frames
      // octave stability: don't let it flip between half- and double-time every pass
      const alt = bpm > 0 && (Math.abs(nb - bpm*2) < 6 || Math.abs(nb - bpm/2) < 6);
      const tgt = (alt && bpmConf < 0.6) ? bpm : nb;
      bpm = bpm > 0 ? bpm + (tgt - bpm)*0.35 : tgt;
      beatPeriod = 60/bpm;
    }
  }
  function listen(now, dt){
    if (!chromaBins) buildChromaBins();
    if (!fluxT) fluxT = now;              // anchor the 60Hz grid to the first frame, or
                                          // every frame would flush a backlog of samples
    const flux = spectralFlux();
    // adaptive threshold from the running mean/deviation of the flux itself
    fluxMean = fluxMean*0.98 + flux*0.02;
    fluxVar  = fluxVar*0.98 + Math.abs(flux-fluxMean)*0.02;
    onset = 0;
    if (flux > fluxMean + fluxVar*2.2 + 0.02 && now - lastOnsetT > 110){
      onset = Math.min(1, (flux - fluxMean) / (fluxVar*3 + 0.05));
      lastOnsetT = now;
    }
    // resample the envelope onto a fixed 60Hz grid so tempo math is frame-rate independent
    fluxPeak = Math.max(fluxPeak, flux);
    if (now - fluxT >= 16.667){
      const steps = Math.min(6, Math.floor((now - fluxT)/16.667));
      for (let s=0;s<steps;s++){ fluxHist[fluxHead] = fluxPeak; fluxHead = (fluxHead+1)%FLUX_N; fluxPeak *= 0.4; }
      fluxT += steps*16.667;
      fluxPeak = 0;
    }
    if (now - tempoT > 700){ tempoT = now; estimateTempo(); }
    // run the beat grid forward, phase-locking to onsets that land near it
    if (beatPeriod > 0){
      beatPhase += dt/beatPeriod;
      while (beatPhase >= 1){ beatPhase -= 1; beatCount = (beatCount+1) % 4; }
      if (onset > 0.3){
        const err = beatPhase > 0.5 ? beatPhase - 1 : beatPhase;   // signed, ±0.5
        beatPhase -= err * 0.18 * bpmConf;
        if (beatPhase < 0){ beatPhase += 1; beatCount = (beatCount+3) % 4; }
      }
      barPhase = (beatCount + beatPhase)/4;
    }
    // chroma -> key -> a bounded hue drift, so the palette follows the harmony
    chromaAcc.fill(0);
    for (let i=1;i<freqData.length;i++){
      const pc = chromaBins[i];
      if (pc >= 0) chromaAcc[pc] += freqData[i]/255;
    }
    let cmax = 0, cidx = -1, csum = 0;
    for (let p=0;p<12;p++){
      chroma[p] = chroma[p]*0.94 + chromaAcc[p]*0.06;
      csum += chroma[p];
      if (chroma[p] > cmax){ cmax = chroma[p]; cidx = p; }
    }
    keyConf = csum > 1e-4 ? Math.min(1, (cmax/(csum/12) - 1)/1.6) : 0;
    if (cidx >= 0 && keyConf > 0.15){
      keyIdx = cidx;
      const a = cidx*Math.PI/6;                      // circular EMA: no wrap-around jumps
      hueX = hueX*0.985 + Math.cos(a)*0.015;
      hueY = hueY*0.985 + Math.sin(a)*0.015;
    }
    harmHue = Math.atan2(hueY, hueX) * 0.28 * Math.min(1, keyConf*1.5);
    return onset;
  }

  function analyze(now, dt){
    // reactive gain (AGC): normalize the input so quiet & loud tracks read the same,
    // with no user control. Replaces the old manual "Sync" slider (which over-drove
    // the scene into an unreadable white-out).
    const rawB = band(1,18), rawM = band(40,180), rawT = band(300,700);
    const rawE = rawB*0.6 + rawM*0.3 + rawT*0.1;
    agcEnv = agcEnv*0.985 + rawE*0.015;                 // slow loudness estimate (~1.5s)
    inputGain = Math.max(0.7, Math.min(1.8, 0.33/(agcEnv+0.06)));
    const g = inputGain;
    const bass = Math.min(rawB*g, 1.4);
    const mid  = Math.min(rawM*g, 1.4);
    const treb = Math.min(rawT*g, 1.4);
    const on = listen(now, dt);
    bassSmooth = bassSmooth*0.92 + bass*0.08;
    if (bass > bassSmooth*1.28 && bass > 0.30 && now-lastBeat>150) {
      // the beat carries its STRENGTH: a profound kick punches far above the running
      // baseline -> a big beat -> dramatic movement; a soft tick stays small.
      const strength = Math.min(1.0, (bass - bassSmooth) / (bassSmooth*0.9 + 0.12));
      beat = Math.max(beat, 0.4 + strength*0.85);   // ~0.4 (soft) .. ~1.25 (profound)
      lastBeat = now;
    }
    // broadband onsets (snares, claps, stabs) count as hits too -- a track with no
    // kick drum used to leave the whole scene nearly still.
    if (on > 0.35 && now-lastBeat > 110){ beat = Math.max(beat, 0.35 + on*0.55); lastBeat = now; }
    beat *= 0.88;
    const energy = (bass*0.6+mid*0.3+treb*0.1);
    // ---- breathing (in / out) ----
    energyFast = energyFast*0.80 + energy*0.20;      // the moment
    energyMed  = energyMed *0.90 + energy*0.10;      // slope reference
    energyLag  = energyLag *0.92 + energy*0.08;      // jump reference
    const slope = energyFast - energyMed;            // > 0 while the track is building
    coil = Math.min(1, coil*0.985 + Math.max(0, slope)*2.0);   // tension accumulates on the rise
    const jump = energyFast - energyLag;             // spikes at a drop
    if (releaseLock > 0) releaseLock--;
    if (coil > 0.30 && jump > 0.08 && releaseLock <= 0){        // the release
      burst = Math.min(1.5, burst + coil*1.3); coil *= 0.25; releaseLock = 24;
    }
    burst *= 0.90;                                    // the exhale decays (~0.4s)
    syncSmooth = syncSmooth*0.90 + energy*0.10;
    // brownian wander (bounded) gives the gauge a live, drifting feel
    syncWander = Math.max(-1, Math.min(1, syncWander*0.97 + (Math.random()-0.5)*0.06));
    const target = 0.55 + 0.42*Math.min(1, Math.pow(syncSmooth*1.5, 0.8)) + syncWander*0.04;
    syncRatio += (target - syncRatio) * 0.07;
    syncRatio = Math.max(0.35, Math.min(0.999, syncRatio));
    return { bass, mid, treb, energy };
  }

  // ---------------- Neural web (geometry fed to the GPU each frame) ----------------
  // The web is a real FORCE-DIRECTED GRAPH now: nodes carry velocity and are pushed
  // apart by their neighbours, pulled together along their edges, and held inside the
  // frame by a soft elliptical shell. Nothing has a fixed home any more, so the layout
  // keeps reorganising itself over the course of a song.
  const MAXN = 512, MAXE = MAXN*3, MAXF = 24;
  // interleaved instance streams uploaded straight to the GPU (see mkInstanced)
  const nodeBuf = new Float32Array(MAXN*4);   // x, y, energy, seed
  const edgeBuf = new Float32Array(MAXE*6);   // ax, ay, bx, by, energy, seed
  let liveN = 0, liveE = 0;                   // instances actually written this frame
  const figBuf  = new Float32Array(MAXF*2);   // silhouette outline points (uv space)
  let figN = 0;                               // active outline points this frame
  const figA = new Float32Array(3), figB = new Float32Array(3);  // body / rim color
  let currentN = 0;                            // active node count (scalable)
  let netNodes = [], netEdges = [], netOn = true;
  let relaxT = 0;                              // countdown to the next edge rebuild
  // pointer/drag influence on the neural web (uv-space cursor position)
  const mouse = { x: 0, y: 0, down: false, over: false };

  // Hundreds of nodes only pay off if the machine can carry them. Phones get a much
  // lower ceiling -- the cost is fill rate (every node is a translucent quad), which is
  // exactly what mobile GPUs are worst at.
  // uv half-extents the web lives in. W/H are still 0 at module-eval time (resize()
  // runs during boot), so fall back to the default 9:16 rather than seeding NaNs.
  function webExtent(){
    const a = (W && H) ? W/H : 9/16;
    return [0.5*a*1.1, 0.55];
  }

  function webNodeCap(){
    let coarse = false;
    try { coarse = matchMedia('(pointer:coarse)').matches; } catch(e){}
    const cores = navigator.hardwareConcurrency || 4;
    return Math.min(MAXN, coarse ? 140 : (cores >= 8 ? 400 : 240));
  }

  function initNet(N){
    N = Math.max(3, Math.min(webNodeCap(), N|0));
    currentN = N;
    netNodes = [];
    for (let i=0;i<N;i++){
      const ang = Math.random()*Math.PI*2;
      // sqrt() spreads the seed positions evenly over the disc; a plain uniform radius
      // piles them into the middle and the solver then has to spend seconds pushing
      // them back out (the 2D form of the nebula's cube-root lesson).
      const rad = Math.sqrt(Math.random());
      netNodes.push({
        x: Math.cos(ang)*rad, y: Math.sin(ang)*rad,      // uv space, filled in by scaleSeed
        vx: 0, vy: 0, ax: 0, ay: 0,
        // each node seeks its OWN shell radius, so the graph fills the frame instead of
        // collapsing to a point or bunching on one ring
        rT: 0.12 + Math.random()*0.78,
        seed: Math.random(),
        band: 2 + Math.floor(Math.pow(i/N,1.6)*200),
        e: 0,
        ring: rad > 0.78,                                 // outer nodes are the stable skeleton
        vis:1, vtar:1, flash:0,                           // quantum-vacuum life (inner nodes)
        tflip: 0.5 + Math.random()*3                      // countdown to next pop
      });
    }
    const [hw, hh] = webExtent();
    for (const n of netNodes){ n.x *= hw; n.y *= hh; }
    relaxT = 0;                                           // wire it up on the next frame
    rebuildEdges();
  }

  // Rewire each node to its nearest neighbours. Called periodically, NOT every frame:
  // the graph is always drifting, so re-running this is what makes the web visibly
  // reorganise -- but doing it every frame makes the edges strobe.
  function rebuildEdges(){
    const N = netNodes.length;
    if (N < 2){ netEdges = []; return; }
    // Spatial hash: at 400 nodes an all-pairs scan is 160k distance tests per rebuild.
    // Bucketing by a cell the size of the interaction radius makes it near-linear.
    const cell = neighborRadius(N);
    const grid = new Map();
    const key = (cx,cy) => cx*73856093 ^ cy*19349663;
    for (let i=0;i<N;i++){
      const n = netNodes[i];
      const k = key(Math.floor(n.x/cell), Math.floor(n.y/cell));
      let b = grid.get(k); if (!b){ b = []; grid.set(k, b); }
      b.push(i);
    }
    const seen = new Set(); const out = [];
    const K = N > 220 ? 2 : 3;                   // degree: keep the picture readable
    const cand = [];
    for (let i=0;i<N && out.length<MAXE;i++){
      const n = netNodes[i];
      const cx = Math.floor(n.x/cell), cy = Math.floor(n.y/cell);
      cand.length = 0;
      for (let ox=-1; ox<=1; ox++) for (let oy=-1; oy<=1; oy++){
        const b = grid.get(key(cx+ox, cy+oy));
        if (!b) continue;
        for (const j of b) if (j !== i){
          const dx = n.x-netNodes[j].x, dy = n.y-netNodes[j].y;
          cand.push([dx*dx+dy*dy, j]);
        }
      }
      cand.sort((a,b)=>a[0]-b[0]);
      for (let k=0;k<Math.min(K, cand.length) && out.length<MAXE;k++){
        const j = cand[k][1], kk = i<j ? i*MAXN+j : j*MAXN+i;
        if (!seen.has(kk)){ seen.add(kk); out.push([i,j]); }
      }
    }
    netEdges = out;
  }

  // Characteristic spacing: the radius at which nodes start pushing each other away,
  // and the yardstick for spring rest length, feature size and edge bucketing. It has
  // to fall as the count rises or a dense graph is one solid mat of light.
  function neighborRadius(N){
    const [hw, hh] = webExtent();
    return Math.max(0.02, 1.45 * Math.sqrt(hw*hh*Math.PI / Math.max(4,N)));
  }

  // seed from the slider's own default so the graph and the control agree on load
  initNet(sliderToNodes(+nodeSlider.value));
  // Slider 0..1 -> node count with a gentle ("tepid") logarithmic curve:
  // fine control over small counts, quicker growth toward the top.
  function sliderToNodes(s){
    // Heavy curvature: the top of the slider now reaches hundreds of nodes, so the
    // useful 20-150 range has to occupy most of the travel instead of the last 10%.
    const minN = 6, maxN = webNodeCap(), k = 500;
    return Math.round(minN + (maxN-minN) * (Math.pow(k, s)-1) / (k-1));
  }
  function setNodeCount(N){ if (N !== currentN) initNet(N); }

  // ---- Evangelion coalescence ----------------------------------------------
  // Each shape is a CLOSED, non-self-intersecting outline in logical [-1,1] space,
  // rendered as a glowing energy construct by the shader's polygon SDF (see figure()).
  // Pure abstract geometry -- each with its own color and audio-scaled spin.
  const SHAPES = [
    { name:'OCTA', spin:0.9, a:[0.12,0.30,0.98], b:[0.55,0.92,1.0], pts:[     // octahedron / diamond
      [0,1],[0.5,0.5],[0.92,0.08],[0.92,-0.08],[0.5,-0.5],
      [0,-1],[-0.5,-0.5],[-0.92,-0.08],[-0.92,0.08],[-0.5,0.5] ] },
    { name:'HEX', spin:1.1, a:[1.0,0.5,0.08], b:[1.0,0.82,0.35], pts:[        // hexagon
      [0,1],[0.87,0.5],[0.87,-0.5],[0,-1],[-0.87,-0.5],[-0.87,0.5] ] },
    { name:'CROSS', spin:0.5, a:[1.0,0.82,0.45], b:[1.0,1.0,0.92], pts:[      // cruciform
      [-0.16,1],[0.16,1],[0.16,0.16],[0.9,0.16],[0.9,-0.16],[0.16,-0.16],
      [0.16,-1],[-0.16,-1],[-0.16,-0.16],[-0.9,-0.16],[-0.9,0.16],[-0.16,0.16] ] },
    { name:'STAR', spin:0.7, a:[0.70,0.15,0.90], b:[1.0,0.5,0.95], pts:[      // 6-point star burst
      [0,1],[0.21,0.364],[0.866,0.5],[0.42,0],[0.866,-0.5],[0.21,-0.364],
      [0,-1],[-0.21,-0.364],[-0.866,-0.5],[-0.42,0],[-0.866,0.5],[-0.21,0.364] ] },
    { name:'TRI', spin:0.8, a:[0.10,0.85,0.55], b:[0.6,1.0,0.85], pts:[       // triangle
      [0,1],[0.87,-0.5],[-0.87,-0.5] ] },
  ];
  let coh = 0, shapeIdx = 0, shapeDwell = 0;
  let shapeSpin = 0, netTime = 0;   // accumulating figure rotation + local clock
  let testCoh = null, testShape = null;   // harness overrides so silhouettes can be screenshotted

  function updateNet(dt, gain){
    const [hw, hh] = webExtent();           // uv half-extents (web spreads across the frame)
    // syncRatio gently swells/settles the whole web's energy on its own -- the
    // automatic version of nudging the "Sync" slider. Manual gain still stacks on top.
    const syncGain = 0.65 + syncRatio*0.7;
    const cf = safe ? 0.4 : 1.0;               // calm mode dampens the vacuum flicker
    // coalescence: emerges only when the track drives (sync high); beats snap it
    // tighter and, past a dwell, morph to the next character.
    const shp = SHAPES[shapeIdx];
    const cohTar = Math.max(0, Math.min(1, (syncRatio - 0.72) / 0.2));
    coh += (cohTar - coh) * (cohTar > coh ? 0.06 : 0.03);    // ease in faster than out
    if (beat > 0.6) coh = Math.min(1, coh + 0.12);
    shapeDwell += dt;
    // evolve the form: morph on a strong beat after a short dwell, AND force-advance on
    // a timer so it never sits on one shape for a whole song (the old rule needed a rare
    // high-coalescence beat, so quiet samples stayed frozen).
    if ((beat > 0.55 && shapeDwell > 1.6) || shapeDwell > 5.0){
      shapeIdx = (shapeIdx + 1) % SHAPES.length; shapeDwell = 0;
    }
    // the harness relaxes the solver for a couple of seconds before screenshotting,
    // which is long enough to trip the morph -- pin the shape so ?shape= stays honest
    if (testShape != null) shapeIdx = testShape;
    if (testCoh != null) coh = testCoh;
    // figure rotation: geometric Angels tumble (rate rises with bass + beat);
    // humanoid forms (spin 0) rock gently so they never flip upside-down.
    netTime += dt;
    shapeSpin += dt * (shp.spin||0) * (0.35 + bassSmooth*1.4 + beat*0.8);
    const figAng = (shp.spin||0) ? shapeSpin : Math.sin(netTime*1.2)*0.16*coh;
    const fcs = Math.cos(figAng), fsn = Math.sin(figAng);
    // ---- force-directed relaxation --------------------------------------------
    // Every node carries velocity. Three standing forces (neighbour repulsion, edge
    // springs, a soft elliptical shell) settle the graph; the music perturbs it. There
    // are no home positions, so the layout genuinely reorganises as the song moves.
    const N = netNodes.length;
    const Rn = neighborRadius(N);
    const step = Math.min(dt, 1/30);                  // a stalled tab must not explode the sim
    const damp = Math.pow(0.87, step*60);             // frame-rate independent damping
    // the graph OPENS on a release and draws TIGHT as tension winds up
    const spread = (1 + bassSmooth*0.16 + burst*0.35) * (1 - coil*0.22) * (1 - coh*0.28);
    const L0   = Rn * 0.62 * spread;                  // spring rest length
    const KSPR = 30 * (1 + coil*1.2);                 // tension makes the lattice taut
    const KREP = 60, KSHELL = 20;

    for (let i=0;i<N;i++){
      const n = netNodes[i];
      n.e = freqData ? Math.min((freqData[n.band]/255)*gain*syncGain, 1.3) : 0;
      n.ax = 0; n.ay = 0;
    }

    // Repulsion, bucketed by a cell the size of the interaction radius. All-pairs would
    // be 160k tests per frame at 400 nodes; this only ever looks at the 3x3 neighbourhood.
    const cell = Rn, grid = new Map();
    const gkey = (cx,cy) => cx*73856093 ^ cy*19349663;
    for (let i=0;i<N;i++){
      const n = netNodes[i];
      const k = gkey(Math.floor(n.x/cell), Math.floor(n.y/cell));
      let b = grid.get(k); if (!b){ b = []; grid.set(k, b); }
      b.push(i);
    }
    for (let i=0;i<N;i++){
      const a = netNodes[i];
      const cx = Math.floor(a.x/cell), cy = Math.floor(a.y/cell);
      for (let ox=-1; ox<=1; ox++) for (let oy=-1; oy<=1; oy++){
        const b = grid.get(gkey(cx+ox, cy+oy));
        if (!b) continue;
        for (const j of b){
          if (j <= i) continue;                        // each pair once, applied both ways
          const o = netNodes[j];
          let dx = a.x-o.x, dy = a.y-o.y;
          const d2 = dx*dx + dy*dy;
          if (d2 > Rn*Rn || d2 < 1e-12) continue;
          const d = Math.sqrt(d2), w = 1 - d/Rn;
          const f = KREP * w * w / d;
          dx *= f; dy *= f;
          a.ax += dx; a.ay += dy; o.ax -= dx; o.ay -= dy;
        }
      }
    }
    // Edge springs
    for (let k=0;k<netEdges.length;k++){
      const [i,j] = netEdges[k];
      const a = netNodes[i], o = netNodes[j];
      let dx = o.x-a.x, dy = o.y-a.y;
      const d = Math.hypot(dx,dy) || 1e-5;
      const f = KSPR * (d - L0) / d;
      dx *= f; dy *= f;
      a.ax += dx; a.ay += dy; o.ax -= dx; o.ay -= dy;
    }
    // Shell containment + music + cursor, then integrate
    const vmax = 2.2;
    for (let i=0;i<N;i++){
      const n = netNodes[i];
      // measured in normalised ellipse coords so a 9:16 frame gets an elliptical
      // shell, not a circle with dead bands down both sides
      const ex = n.x/hw, ey = n.y/hh;
      const r  = Math.hypot(ex, ey) || 1e-5;
      const dirx = ex/r, diry = ey/r;
      const rT = n.rT * spread;
      const pull = -KSHELL * (r - rT);
      n.ax += dirx * hw * pull;
      n.ay += diry * hh * pull;
      // beats shove nodes outward (movement, never brightness); the release does it harder
      const kick = (beat*beat*0.22 + burst*0.30) * cf;
      n.ax += dirx * kick * 2.4;
      n.ay += diry * kick * 2.4;
      // a little wander so a settled graph still breathes instead of freezing solid
      const ph = n.seed*6.2831;
      n.ax += Math.cos(netTime*(0.7 + n.seed*1.3) + ph) * (0.5 + n.e*1.6);
      n.ay += Math.sin(netTime*(0.6 + n.seed*1.1) + ph*1.7) * (0.5 + n.e*1.6);
      if (coil > 0.05){                                // wound-up tension trembles in place
        const tr = coil*6.0;
        n.ax += Math.sin(netTime*40 + ph*7)*tr;
        n.ay += Math.cos(netTime*37 + ph*5)*tr;
      }
      // cursor: DRAG pulls nodes in, a bare HOVER pushes them away
      if (mouse.down){
        const dx = mouse.x-n.x, dy = mouse.y-n.y, d = Math.hypot(dx,dy), R = 0.55;
        if (d < R){ const w = 1-d/R; n.ax += dx*w*26; n.ay += dy*w*26; n.e = Math.min(1.3, n.e + w*0.6); }
      } else if (mouse.over){
        const dx = n.x-mouse.x, dy = n.y-mouse.y, d = Math.hypot(dx,dy) || 1e-4, R = 0.4;
        if (d < R){ const w = 1-d/R; n.ax += (dx/d)*w*14; n.ay += (dy/d)*w*14; n.e = Math.min(1.3, n.e + w*0.25); }
      }
      n.vx = (n.vx + n.ax*step) * damp;
      n.vy = (n.vy + n.ay*step) * damp;
      const sp = Math.hypot(n.vx, n.vy);
      if (sp > vmax){ n.vx = n.vx/sp*vmax; n.vy = n.vy/sp*vmax; }
      n.x += n.vx*step;
      n.y += n.vy*step;
      // life: inner nodes keep the quantum-vacuum flicker (a spark on each wink),
      // popping faster on their band; ring nodes stay lit.
      if (!n.ring){
        n.tflip -= dt * (0.5 + n.e*2.2 + beat*2.5) * cf;
        if (n.tflip <= 0){
          n.vtar = n.vtar > 0.5 ? 0 : 1;                // toggle presence
          n.flash = 1;                                  // spark on transition
          n.tflip = 0.4 + Math.random()*2.6;
        }
        n.vis += (n.vtar - n.vis) * Math.min(1, dt*16);  // fast fade in/out
        n.flash *= 0.85;
      }
    }
    // Rewire periodically (and on a hard hit). This is the visible payoff of the solver:
    // as nodes migrate, who they are connected to actually changes.
    relaxT -= dt;
    if (relaxT <= 0 || (beat > 0.7 && relaxT < 0.5)){
      rebuildEdges();
      relaxT = 0.9 + Math.random()*0.8;
    }

    // ---- pack the instance streams (skip anything winked out; no sentinel padding) ----
    liveN = 0;
    for (let i=0;i<N;i++){
      const n = netNodes[i];
      if (n.vis < 0.02) continue;
      const o = liveN*4;
      nodeBuf[o]   = n.x; nodeBuf[o+1] = n.y;
      nodeBuf[o+2] = n.e*n.vis + n.flash*0.9*cf;       // energy folds in the vacuum spark
      nodeBuf[o+3] = n.seed;
      liveN++;
    }
    liveE = 0;
    // an edge vanishes with its node so vacuum pops read cleanly (ring nodes stay lit)
    for (let k=0;k<netEdges.length && liveE<MAXE;k++){
      const a = netNodes[netEdges[k][0]], b = netNodes[netEdges[k][1]];
      if (a.vis < 0.3 || b.vis < 0.3) continue;
      const o = liveE*6;
      edgeBuf[o]   = a.x; edgeBuf[o+1] = a.y;
      edgeBuf[o+2] = b.x; edgeBuf[o+3] = b.y;
      edgeBuf[o+4] = (a.e + b.e)*0.5;
      edgeBuf[o+5] = (k*0.618034 + 0.31) % 1;          // stable per-edge packet phase
      liveE++;
    }
    // build the figure outline: spin each point, scale to uv, upload as u_fig.
    // 0.62 keeps the construct floating in frame instead of filling it.
    const pts = shp.pts, fn = Math.min(pts.length, MAXF);
    const fhw = hw*0.62, fhh = hh*0.62;
    for (let i=0;i<fn;i++){
      const px = pts[i][0]*fhw, py = pts[i][1]*fhh;
      figBuf[i*2]   = px*fcs - py*fsn;
      figBuf[i*2+1] = px*fsn + py*fcs;
    }
    figN = (netOn && coh > 0.01) ? fn : 0;
    figA[0]=shp.a[0]; figA[1]=shp.a[1]; figA[2]=shp.a[2];
    figB[0]=shp.b[0]; figB[1]=shp.b[1]; figB[2]=shp.b[2];
  }
  // ---------------- Spectral waterfall (CPU side) ----------------
  // A rolling FFT history. Rather than a ring buffer with index maths in the shader,
  // the whole thing is memmoved down one row per push -- 21 KB at 50 Hz is nothing, and
  // it keeps row 0 = oldest = farthest, which is exactly the order the draw needs.
  // more rows = finer depth resolution in the foreground, where the perspective
  // stretches adjacent rows furthest apart
  const WCOLS = 192, WROWS = 160;
  let histTex = null, rowTex = null, waterVAO = null;
  const histData = new Uint8Array(WCOLS*WROWS);
  // Per-row musical state, scrolled in lockstep: (beat strength, hue step, energy,
  // bar position). 448 bytes, so it is far cheaper to keep as its own 1 x ROWS texture
  // than to widen histData and memmove four times as much every push.
  const rowData = new Uint8Array(WROWS*4);
  const wRaw = new Float32Array(WCOLS), wPrev = new Float32Array(WCOLS);
  let wHue = 0.5, wLastBeat = 0;
  let wBinLo = null, wBinHi = null;      // per-column FFT bin span (log-spaced)
  let wAcc = 0, waterAmp = 0.96;      // matches the slider's 0.8 default via setRelief
  let fluidGain = 1.35;               // "Billow": how much dye the emitters push

  // Columns are spaced by a power curve, not linearly: a linear frequency axis spends
  // most of the frame on 10-20 kHz, where music has almost nothing, and crushes the
  // bass and low mids -- where all the visible structure actually is -- into a sliver.
  function buildWaterBins(bins){
    wBinLo = new Int32Array(WCOLS); wBinHi = new Int32Array(WCOLS);
    const top = Math.min(bins, 560);
    for (let c=0;c<WCOLS;c++){
      const a = Math.pow(c/WCOLS, 2.1), b = Math.pow((c+1)/WCOLS, 2.1);
      const lo = 1 + Math.floor(a*(top-2));
      wBinLo[c] = lo;
      wBinHi[c] = Math.min(top, Math.max(lo+1, 1 + Math.floor(b*(top-2))));
    }
  }
  function waterPushRow(gain, st){
    if (!wBinLo || !freqData) return;
    histData.copyWithin(0, WCOLS);                 // scroll: the oldest row falls off
    rowData.copyWithin(0, 4);
    const off = (WROWS-1)*WCOLS;
    let sum = 0;
    // A pure max over each bin span is spiky -- it latches onto single loud bins and the
    // surface comes out jagged. Blending in the mean keeps the peak but rounds the shape.
    for (let c=0;c<WCOLS;c++){
      let mx = 0, acc = 0, n = 0;
      for (let i=wBinLo[c]; i<wBinHi[c]; i++){ const f = freqData[i]; if (f > mx) mx = f; acc += f; n++; }
      wRaw[c] = (mx*0.45 + (acc/Math.max(1,n))*0.55) * gain;
    }
    for (let c=0;c<WCOLS;c++){
      const l = wRaw[Math.max(0,c-1)], r = wRaw[Math.min(WCOLS-1,c+1)];
      // 3-tap across the spectrum, then a light temporal blend against the previous row
      // so the surface flows instead of chattering row to row
      const sm = (l + wRaw[c]*2 + r) * 0.25;
      wPrev[c] = wPrev[c]*0.30 + sm*0.70;
      const v = Math.min(255, wPrev[c]);
      histData[off+c] = v;
      sum += v;
    }
    // Hue STEPS on each beat rather than drifting continuously -- a sequencer, not a
    // fade. Successive beats land on visibly different colours (golden-ratio walk), and
    // the whole walk is re-centred on the song's key so it stays in one palette family
    // instead of cycling the rainbow.
    const b = st.beat;
    if (b > 0.30 && st.t - wLastBeat > 0.10){
      wLastBeat = st.t;
      wHue = (wHue + 0.382*(0.45 + b*0.85)) % 1;
    }
    const key = 0.5 + st.harmHue*0.55;             // bounded pull toward the key's hue
    const hue = 0.5 + ((wHue - 0.5)*0.65 + (key - 0.5)*0.5);
    const o = (WROWS-1)*4;
    rowData[o]   = Math.min(255, b*255);
    rowData[o+1] = Math.max(0, Math.min(255, hue*255));
    rowData[o+2] = Math.min(255, (sum/WCOLS)*1.6);
    rowData[o+3] = Math.min(255, st.bar*255);
  }
  // the history is built over time, so a static screenshot needs it pre-filled
  function waterWarm(n){
    if (!freqData) return;
    const base = freqData.slice();
    for (let r=0;r<n;r++){
      const ph = r*0.12;
      for (let i=0;i<freqData.length;i++){
        const w = 0.55 + 0.45*Math.sin(ph*1.7 + i*0.045)*Math.cos(ph*0.6 + i*0.011);
        freqData[i] = Math.max(0, Math.min(255, base[i]*w));
      }
      // synthesize plausible musical state too, or every row stores the same colour
      // and the whole point of the per-row metadata is invisible in a render
      const onBeat = (r % 25) < 2;
      waterPushRow(1.0, { beat: onBeat ? 0.55 + 0.45*Math.sin(r*0.7) : 0.0,
                          t: r*0.02, harmHue: Math.sin(r*0.045)*0.5,
                          bar: ((r/25|0) % 4)/4 });
    }
    freqData.set(base);
  }
  function setRelief(v){ waterAmp = 0.20 + v*0.95; }

  // ---------------- Fluid / smoke (CPU driver) ----------------
  let fVel=[null,null], fDye=[null,null], fPrs=[null,null], fDiv=null, fCurl=null;
  let fV=0, fD=0, fP=0, fW=0, fH=0, fluidOK=false, fluidT=0, fEmit=0;
  // Hue walks a GOLDEN ANGLE on every beat, so consecutive hits inject maximally
  // distinct colours and the frame ends up holding several plumes at once that swirl
  // into each other. A single theme tint is what made this read as a grey-scale
  // smoke test rather than something reacting to music.
  let fHue = 0, fLastBeat = -9;
  // The walk is BOUNDED (sin of the counter), not free. A full-wheel golden-angle walk
  // makes consecutive plumes maximally distinct -- which is exactly wrong here, because
  // the dye field is ADDITIVE: maximally distinct hues sum toward white and the smoke
  // desaturates. Confined to about +/-50 degrees around the theme, overlapping plumes
  // stay in one family and sum to a brighter version of it instead.
  function fInk(base, spin, mul){
    const c = shiftHue(base, Math.sin(fHue*spin)*0.88 + harmHue*1.4);
    return [c[0]*mul, c[1]*mul, c[2]*mul];
  }
  const FSIM = 256;                          // sim height; width follows the aspect
  function allocFluid(){
    const asp = (W && H) ? W/H : 9/16;
    const h = FSIM, w = Math.max(64, Math.round(FSIM * asp));
    if (fW === w && fH === h && fVel[0]) return true;
    for (const rt of [...fVel, ...fDye, ...fPrs, fDiv, fCurl]){
      if (rt){ gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fb); }
    }
    fW = w; fH = h;
    fVel = [makeRT(w,h), makeRT(w,h)];
    fDye = [makeRT(w,h), makeRT(w,h)];
    fPrs = [makeRT(w,h), makeRT(w,h)];
    fDiv = makeRT(w,h); fCurl = makeRT(w,h);
    const all = [...fVel, ...fDye, ...fPrs, fDiv, fCurl];
    if (all.some(rt => !rt)){ fluidOK = false; return false; }
    for (const rt of all){
      gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb);
      gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return true;
  }
  function fBind(rt){
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb);
    gl.viewport(0, 0, fW, fH);
  }
  function fTex(unit, rt, prog, name){
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, rt.tex);
    gl.uniform1i(U(prog, name), unit);
  }
  // add a gaussian blob of `value` into a ping-ponged field at uv `px,py`
  function fSplat(pair, idx, px, py, vx, vy, vz, radius){
    const src = pair[idx], dst = pair[1-idx];
    fBind(dst);
    gl.useProgram(progFSplat);
    gl.uniform2f(U(progFSplat,'u_texel'), 1/fW, 1/fH);
    fTex(4, src, progFSplat, 'u_src');
    gl.uniform2f(U(progFSplat,'u_point'), px, py);
    gl.uniform3f(U(progFSplat,'u_value'), vx, vy, vz);
    gl.uniform1f(U(progFSplat,'u_radius'), radius);
    gl.uniform1f(U(progFSplat,'u_aspect'), fW/fH);
    drawQuad();
    return 1-idx;
  }

  function simFluid(S, dt){
    // SECONDS, not frames. Advection backtraces by v*dt*texel, so with dt in frames
    // (~1.0) a velocity of a few hundred would sweep the field several screen widths
    // per step and the smoke would just vanish.
    const d = Math.min(dt, 1/30);
    const tx = 1/fW, ty = 1/fH;
    gl.disable(gl.BLEND);

    // ---- inject ----
    fluidT += dt;
    if (S.beat > 0.30 && fluidT - fLastBeat > 0.10){
      fLastBeat = fluidT;
      fHue += 2.399963 * (0.45 + S.beat*0.9);     // golden angle in radians
    }
    // A standing emitter at the base keeps the frame alive during quiet passages;
    // its strength and colour ride the music.
    fEmit += dt;
    if (fEmit > 0.05){
      fEmit = 0;
      const sway = Math.sin(fluidT*0.63)*0.22 + Math.sin(fluidT*0.27)*0.12;
      const p = 0.5 + sway*0.5;
      // base is deliberately high relative to the slope: the loud end already reads
      // well, it was the QUIET end that rendered as a near-black frame
      const amp = (0.60 + S.bass*1.15) * fluidGain;
      fV = fSplat(fVel, fV, p, 0.06, (Math.sin(fluidT*0.9))*90, 260*amp, 0, 0.0009);
      // the standing column drifts slowly through the walk; hits jump it
      const ink = fInk(S.c1, 0.35, amp*0.55);
      fD = fSplat(fDye, fD, p, 0.06, ink[0], ink[1], ink[2], 0.0011);
    }
    // beats fire off-axis bursts; the drop detonates the middle
    if (S.beat > 0.35){
      const n = S.beat > 0.8 ? 3 : 2;
      for (let i=0;i<n;i++){
        const a = (fluidT*2.1 + i*2.4) % (Math.PI*2);
        const px = 0.5 + Math.cos(a)*0.30, py = 0.42 + Math.sin(a)*0.26;
        const k = S.beat*S.beat*260*S.safe;
        fV = fSplat(fVel, fV, px, py, Math.cos(a)*k, Math.sin(a)*k, 0, 0.0016);
        const bi = fInk(S.c2, 1.0, 0.55 + S.beat*0.25);
        fD = fSplat(fDye, fD, px, py, bi[0], bi[1], bi[2], 0.0018);
      }
    }
    if (S.burst > 0.05){
      const k = S.burst*520*S.safe;
      for (let i=0;i<6;i++){
        const a = i/6*Math.PI*2 + fluidT;
        fV = fSplat(fVel, fV, 0.5, 0.45, Math.cos(a)*k, Math.sin(a)*k, 0, 0.004);
      }
      const ui = fInk(S.c1, 1.0, S.burst*0.7);
      fD = fSplat(fDye, fD, 0.5, 0.45, ui[0], ui[1], ui[2], 0.006);
    }
    if (mouse.over){
      // cursor drags the smoke around; uv space, y flipped to match the field
      const [hw, hh] = webExtent();
      const px = mouse.x/(hw*2) + 0.5, py = mouse.y/(hh*2) + 0.5;
      const k = mouse.down ? 420 : 120;
      fV = fSplat(fVel, fV, px, py, (px-fmx)*k*8, (py-fmy)*k*8, 0, 0.0018);
      if (mouse.down) fD = fSplat(fDye, fD, px, py, S.c1[0]*0.5, S.c1[1]*0.5, S.c1[2]*0.5, 0.0016);
      fmx = px; fmy = py;
    }

    // ---- curl + vorticity confinement ----
    fBind(fCurl);
    gl.useProgram(progFCurl);
    gl.uniform2f(U(progFCurl,'u_texel'), tx, ty);
    fTex(4, fVel[fV], progFCurl, 'u_vel');
    drawQuad();

    fBind(fVel[1-fV]);
    gl.useProgram(progFVort);
    gl.uniform2f(U(progFVort,'u_texel'), tx, ty);
    fTex(4, fVel[fV], progFVort, 'u_vel');
    fTex(5, fCurl,    progFVort, 'u_curl');
    gl.uniform1f(U(progFVort,'u_dt'), d);
    gl.uniform1f(U(progFVort,'u_vort'), 26.0 + S.coil*14.0);
    drawQuad();
    fV = 1-fV;

    // ---- projection: divergence -> Jacobi -> subtract gradient ----
    fBind(fDiv);
    gl.useProgram(progFDiv);
    gl.uniform2f(U(progFDiv,'u_texel'), tx, ty);
    fTex(4, fVel[fV], progFDiv, 'u_vel');
    drawQuad();

    // decay the previous pressure instead of clearing: it is a good initial guess, so
    // far fewer Jacobi iterations are needed to converge than from zero
    gl.useProgram(progFPress);
    gl.uniform2f(U(progFPress,'u_texel'), tx, ty);
    for (let i=0;i<22;i++){
      fBind(fPrs[1-fP]);
      fTex(4, fPrs[fP], progFPress, 'u_prs');
      fTex(5, fDiv,     progFPress, 'u_div');
      drawQuad();
      fP = 1-fP;
    }

    fBind(fVel[1-fV]);
    gl.useProgram(progFGrad);
    gl.uniform2f(U(progFGrad,'u_texel'), tx, ty);
    fTex(4, fVel[fV], progFGrad, 'u_vel');
    fTex(5, fPrs[fP], progFGrad, 'u_prs');
    drawQuad();
    fV = 1-fV;

    // ---- advect velocity, then dye ----
    gl.useProgram(progFAdv);
    gl.uniform2f(U(progFAdv,'u_texel'), tx, ty);
    gl.uniform1f(U(progFAdv,'u_dt'), d);
    fBind(fVel[1-fV]);
    fTex(4, fVel[fV], progFAdv, 'u_src');
    fTex(5, fVel[fV], progFAdv, 'u_vel');
    gl.uniform1f(U(progFAdv,'u_diss'), 0.998);
    drawQuad();
    fV = 1-fV;

    fBind(fDye[1-fD]);
    fTex(4, fDye[fD], progFAdv, 'u_src');
    fTex(5, fVel[fV], progFAdv, 'u_vel');
    // dye has to fade or the frame saturates to a flat wall of colour within seconds
    // quiet passages hold their smoke (little turbulence to break it up); loud ones
    // clear faster so hits stay legible instead of piling into a wall of colour
    gl.uniform1f(U(progFAdv,'u_diss'), 0.988 - S.bass*0.004 - S.beat*0.006);
    drawQuad();
    fD = 1-fD;
  }
  let fmx = 0.5, fmy = 0.5;

  // ---------------- GPU particle nebula ----------------
  // Positions/velocities live entirely on the GPU and are advanced by transform
  // feedback: the sim vertex shader reads buffer set A and writes buffer set B, then
  // the sets swap. Nothing about the particles ever crosses back to JS.
  const PMAX = 240000;
  let pbuf = [null,null], pVAO = [null,null], tfo = null, pcur = 0;
  let PCOUNT = 0, pActive = 0, pDensity = 0.8;
  // expanding beat ring: reset to the centre on a hit, then sweeps outward and fades
  let shockR = 9, shockA = 0;
  function shockTick(S, dt){
    if (S.beat > 0.45 && shockA < S.beat*0.6){ shockR = 0.02; shockA = S.beat*0.9*S.safe; }
    // 2.6/s crossed the old 3.3-radius cloud in ~1.3s. The cloud's outer edge is ~1.5
    // now, so keep the crossing time rather than the speed, or the one synchronised
    // event the whole cloud takes part in is over before the eye catches it.
    shockR += dt * 1.15;
    shockA *= Math.pow(0.35, dt);
  }
  function particleTarget(){
    let coarse = false;
    try { coarse = matchMedia('(pointer:coarse)').matches; } catch(e){}
    const cores = navigator.hardwareConcurrency || 4;
    return Math.min(PMAX, coarse ? 45000 : (cores >= 8 ? 160000 : 90000));
  }
  function makeAttrBuf(data){
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_COPY);
    return b;
  }
  function initParticles(n){
    PCOUNT = Math.max(1000, Math.min(PMAX, n|0));
    pActive = Math.round(PCOUNT * (0.25 + pDensity*0.75));
    const pos = new Float32Array(PCOUNT*3), vel = new Float32Array(PCOUNT*3), dat = new Float32Array(PCOUNT*3);
    for (let i=0;i<PCOUNT;i++){
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      // Match rTarget's distribution AND its scale, or frame one is a fat ball at the
      // old radius that visibly collapses over the first second of every load.
      // sqrt() = even areal fill for a DISC (see rTarget); 0.52 ~ u_shell*1.35.
      const rad = Math.pow(Math.random(), 1.1)*0.54;
      pos[i*3]   = Math.sin(ph)*Math.cos(th)*rad;
      pos[i*3+1] = Math.cos(ph)*rad*0.18;          // squashed -> seeded as a disc, not a ball
      pos[i*3+2] = Math.sin(ph)*Math.sin(th)*rad;
      vel[i*3]   = (Math.random()-0.5)*0.2;
      vel[i*3+1] = (Math.random()-0.5)*0.1;
      vel[i*3+2] = (Math.random()-0.5)*0.2;
      dat[i*3]   = Math.random();                  // life, staggered so respawns spread out
      dat[i*3+1] = Math.random();                  // seed
      // fft coordinate, bass-weighted: most of the cloud rides the low end, a thin
      // upper population sparkles on hats/air (matches how the web picks its bands)
      dat[i*3+2] = 0.002 + Math.pow(Math.random(), 1.8)*0.22;
    }
    for (let s=0;s<2;s++){
      if (pbuf[s]) for (const b of Object.values(pbuf[s])) gl.deleteBuffer(b);
      if (pVAO[s]) gl.deleteVertexArray(pVAO[s]);
      pbuf[s] = { pos: makeAttrBuf(pos), vel: makeAttrBuf(vel), dat: makeAttrBuf(dat) };
      pVAO[s] = gl.createVertexArray();
      gl.bindVertexArray(pVAO[s]);
      const attrs = [pbuf[s].pos, pbuf[s].vel, pbuf[s].dat];
      for (let a=0;a<3;a++){
        gl.bindBuffer(gl.ARRAY_BUFFER, attrs[a]);
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, 3, gl.FLOAT, false, 0, 0);
      }
      gl.bindVertexArray(null);
    }
    if (!tfo) tfo = gl.createTransformFeedback();
    pcur = 0;
  }
  function setDensity(d){
    pDensity = Math.max(0, Math.min(1, d));
    pActive = Math.round(PCOUNT * (0.25 + pDensity*0.75));
  }
  function simParticles(S, dt){
    const src = pcur, dst = 1-pcur;
    gl.useProgram(progSim);
    gl.uniform1f(U(progSim,'u_dt'), dt);
    gl.uniform1f(U(progSim,'u_time'), S.t);
    gl.uniform1f(U(progSim,'u_bass'), S.bass);
    gl.uniform1f(U(progSim,'u_mid'), S.mid);
    gl.uniform1f(U(progSim,'u_treble'), S.treb);
    gl.uniform1f(U(progSim,'u_beat'), S.beat);
    gl.uniform1f(U(progSim,'u_coil'), S.coil);
    gl.uniform1f(U(progSim,'u_burst'), S.burst);
    gl.uniform1f(U(progSim,'u_safe'), S.safe);
    // the cloud's target radius: swells with bass, is reeled IN as tension winds up,
    // and is thrown wide open by the release -- the breathing the web already does.
    // Radius is ~2.7x smaller than it was. VERT_PTS multiplies x by u_res.y/u_res.x
    // (1.78 at 9:16), so the HORIZONTAL cut is the binding one and particles are only
    // on canvas out to rp ~ 1.28. The old constants settled at rp_mean 2.32, which put
    // just 33% of the cloud in frame -- the near half flew off the sides entirely and
    // the far half foreshortened into a gritty band along the bottom edge. That, not
    // the flow field, is why it read as scatter instead of an object. Now ~88%, the
    // same bar the force-directed web is held to. Verified in scratchpad/sim_neb.py.
    gl.uniform1f(U(progSim,'u_shell'), 0.32 + S.bass*0.15 + S.burst*0.12 - S.coil*0.095);
    // Higher spatial frequency than before *because* the world shrank: u_flow scales
    // pos into the curl field, so keeping the old value would have sampled one smooth
    // lobe across the whole cloud. Measured coherence is better here too (3.6 vs 2.8).
    gl.uniform1f(U(progSim,'u_flow'),  3.60 + S.treb*1.70 + S.coil*1.40);
    // rotation now leads: it was 1.50 against a curl field several times stronger.
    // Rescaled for the solid-body rotation curve above, whose peak sits lower than
    // the old 1/sqrt(r) did -- same apparent spin, without evacuating the middle.
    gl.uniform1f(U(progSim,'u_swirl'), 9.90 + S.treb*3.4 + S.coil*5.2 + S.beat*2.5);
    // disc thickness: flares open on bass and on the release, never fully flat
    // a LENS, not a wafer: enough to give it an axis and a silhouette, not so much
    // that it collapses to a transparent sheet.
    // CLAMPED, and the clamp is load-bearing: the old expression went NEGATIVE on a
    // drop (1.7 - 0.9*0.7 - 1.2*1.1 = -0.25), which flips `acc -= axis*dot(pos,axis)*
    // u_disc` into an anti-restoring force AND turns the axial velocity damping below
    // into axial velocity GAIN. The cloud detonated along its own axis on every drop --
    // that is the vertical streak in the BURST frame.
    gl.uniform1f(U(progSim,'u_disc'), Math.max(0.30, 0.40 - S.bass*0.16 - S.burst*0.26));
    // put the cursor into world space on the camera plane (undo the render yaw), so the
    // particles it grabs are the ones actually under the pointer
    const yaw = S.t*0.075 + S.bass*0.22, mx = mouse.x*2.4;
    gl.uniform4f(U(progSim,'u_mouse'), mx*Math.cos(yaw), mouse.y*2.4, mx*Math.sin(yaw),
                 mouse.down ? 1 : (mouse.over ? 2 : 0));

    gl.bindVertexArray(pVAO[src]);
    // WebGL2 forbids one buffer being bound to a transform-feedback binding point AND a
    // non-TF point at the same time. initParticles() leaves pbuf[1].dat on the generic
    // ARRAY_BUFFER binding, so every step with dst===1 was rejected with INVALID_OPERATION
    // and wrote NOTHING -- pbuf[1] kept its JS seed data forever and the cloud was frozen
    // at "seed + one 16ms step" no matter how many warm-up steps ran. Months of sim
    // tuning did nothing because the sim was not running.
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfo);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, pbuf[dst].pos);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, pbuf[dst].vel);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 2, pbuf[dst].dat);
    gl.enable(gl.RASTERIZER_DISCARD);
    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, pActive);
    gl.endTransformFeedback();
    gl.disable(gl.RASTERIZER_DISCARD);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    gl.bindVertexArray(null);
    pcur = dst;
  }

  // ---------------- modes (the hero visual) ----------------
  // A mode owns one thing: drawing into sceneRT. Everything downstream -- bloom,
  // tonemap, HUD, recording, fingerprint -- is shared, so a new mode is just a
  // draw function plus its shaders.
  let modeId = 'web';
  function drawWeb(S){
    bindRT(sceneRT);
    gl.disable(gl.BLEND);
    gl.useProgram(progWeb);
    gl.uniform2f(U(progWeb,'u_res'), RW, RH);
    gl.uniform1f(U(progWeb,'u_time'), S.t);
    gl.uniform1f(U(progWeb,'u_bass'), S.bass);
    gl.uniform1f(U(progWeb,'u_mid'), S.mid);
    gl.uniform1f(U(progWeb,'u_treble'), S.treb);
    gl.uniform1f(U(progWeb,'u_beat'), S.beat);
    gl.uniform1f(U(progWeb,'u_exposure'), S.expo);
    gl.uniform1f(U(progWeb,'u_safe'), S.safe);
    gl.uniform3fv(U(progWeb,'u_c1'), S.c1);
    gl.uniform3fv(U(progWeb,'u_c2'), S.c2);
    gl.uniform1f(U(progWeb,'u_coh'), netOn ? coh : 0);
    gl.uniform1f(U(progWeb,'u_coil'), S.coil);
    gl.uniform1f(U(progWeb,'u_burst'), S.burst);
    gl.uniform2fv(U(progWeb,'u_fig'), figBuf);
    gl.uniform1i(U(progWeb,'u_figN'), figN);
    gl.uniform3fv(U(progWeb,'u_figA'), figA);
    gl.uniform3fv(U(progWeb,'u_figB'), figB);
    drawQuad();
    if (netOn) drawNet(S);
  }

  // The web itself: two instanced passes drawn additively on top of the background.
  function drawNet(S){
    // Feature size and per-node brightness both fall as the count rises. Without that,
    // 400 nodes at the 32-node scale is a single saturated mat -- the additive pile-up
    // failure mode, the same one that bit the nebula.
    const N = Math.max(8, currentN);
    const scale = Math.min(1, Math.sqrt(32/N));
    const ngain = Math.max(0.30, Math.pow(32/N, 0.40));
    // exposure dims the web far less than the background, and it RECEDES as the figure
    // coalesces so the silhouette reads; tension glows, release flashes (restrained).
    const gain = (S.expo + (1 - S.expo)*0.5) * (1 - coh*0.30) * (1 + S.coil*0.18 + S.burst*0.30);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);                   // additive: this is emissive light
    const xf = (p) => {
      gl.uniform2f(U(p,'u_res'), RW, RH);
      gl.uniform1f(U(p,'u_time'), S.t);
      gl.uniform1f(U(p,'u_beat'), S.beat);
      gl.uniform1f(U(p,'u_burst'), S.burst);
      gl.uniform1f(U(p,'u_coil'), S.coil);
      gl.uniform1f(U(p,'u_safe'), S.safe);
      gl.uniform1f(U(p,'u_gain'), gain);
      gl.uniform1f(U(p,'u_scale'), scale);
    };
    if (liveE){
      gl.useProgram(progEdge);
      xf(progEdge);
      gl.uniform3fv(U(progEdge,'u_c1'), S.c1);
      // the quad has to be wide enough to contain the widest thing drawn in it --
      // the data packets (0.013) -- or they get sliced off at the quad edge
      gl.uniform1f(U(progEdge,'u_wide'), 0.020*scale);
      gl.bindVertexArray(edgeVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, edgeInstBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, edgeBuf, 0, liveE*6);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, liveE);
    }
    if (liveN){
      gl.useProgram(progNode);
      xf(progNode);
      gl.uniform3fv(U(progNode,'u_c1'), S.c1);
      gl.uniform3fv(U(progNode,'u_c2'), S.c2);
      gl.uniform1f(U(progNode,'u_ngain'), ngain);
      gl.uniform1f(U(progNode,'u_rad'), 0.17*scale);   // must cover halo + gas + haze
      gl.bindVertexArray(nodeVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, nodeInstBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, nodeBuf, 0, liveN*4);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, liveN);
    }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }
  function drawNebula(S, dt){
    bindRT(sceneRT);
    gl.disable(gl.BLEND);
    gl.useProgram(progGas);
    gl.uniform2f(U(progGas,'u_res'), RW, RH);
    gl.uniform1f(U(progGas,'u_time'), S.t);
    gl.uniform1f(U(progGas,'u_bass'), S.bass);
    gl.uniform1f(U(progGas,'u_mid'), S.mid);
    gl.uniform1f(U(progGas,'u_treble'), S.treb);
    gl.uniform1f(U(progGas,'u_beat'), S.beat);
    gl.uniform1f(U(progGas,'u_coil'), S.coil);
    gl.uniform1f(U(progGas,'u_burst'), S.burst);
    gl.uniform1f(U(progGas,'u_safe'), S.safe);
    gl.uniform1f(U(progGas,'u_exposure'), S.expo);
    gl.uniform3fv(U(progGas,'u_c1'), S.c1);
    gl.uniform3fv(U(progGas,'u_c2'), S.c2);
    drawQuad();

    simParticles(S, dt);
    shockTick(S, dt);

    bindRT(sceneRT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);            // additive; sprites are premultiplied
    gl.useProgram(progPts);
    gl.uniform2f(U(progPts,'u_res'), RW, RH);
    gl.uniform1f(U(progPts,'u_time'), S.t);
    gl.uniform1f(U(progPts,'u_bass'), S.bass);
    gl.uniform1f(U(progPts,'u_beat'), S.beat);
    gl.uniform1f(U(progPts,'u_burst'), S.burst);
    gl.uniform1f(U(progPts,'u_coil'), S.coil);
    gl.uniform1f(U(progPts,'u_safe'), S.safe);
    gl.uniform1f(U(progPts,'u_hue'), S.hue);
    gl.uniform1f(U(progPts,'u_exposure'), S.expo);
    gl.uniform1f(U(progPts,'u_cam'), 2.85 - S.beat*0.20*S.safe - S.burst*0.30);
    gl.uniform1f(U(progPts,'u_focal'), 1.25);
    gl.uniform1f(U(progPts,'u_psize'), 12.0 * (RH/1080));
    gl.uniform1f(U(progPts,'u_armTwist'), 1.9 + S.coil*1.1);
    gl.uniform1f(U(progPts,'u_shockR'), shockR);
    gl.uniform1f(U(progPts,'u_shockA'), shockA);
    gl.uniform3fv(U(progPts,'u_c1'), S.c1);
    gl.uniform3fv(U(progPts,'u_c2'), S.c2);
    gl.bindVertexArray(pVAO[pcur]);
    gl.drawArrays(gl.POINTS, 0, pActive);
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }
  function drawWaterfall(S, dt){
    // sky first: the same dim drifting gas the nebula hangs in, used here as the
    // atmosphere above the horizon (everything below gets painted over by the terrain)
    bindRT(sceneRT);
    gl.disable(gl.BLEND);
    gl.useProgram(progGas);
    gl.uniform2f(U(progGas,'u_res'), RW, RH);
    gl.uniform1f(U(progGas,'u_time'), S.t);
    gl.uniform1f(U(progGas,'u_bass'), S.bass);
    gl.uniform1f(U(progGas,'u_mid'), S.mid);
    gl.uniform1f(U(progGas,'u_treble'), S.treb);
    gl.uniform1f(U(progGas,'u_beat'), S.beat);
    gl.uniform1f(U(progGas,'u_coil'), S.coil);
    gl.uniform1f(U(progGas,'u_burst'), S.burst);
    gl.uniform1f(U(progGas,'u_safe'), S.safe);
    gl.uniform1f(U(progGas,'u_exposure'), S.expo*0.7);
    gl.uniform3fv(U(progGas,'u_c1'), S.c1);
    gl.uniform3fv(U(progGas,'u_c2'), S.c2);
    drawQuad();

    // Scroll at a FIXED rate rather than one row per frame, or the terrain's speed
    // becomes a readout of the machine's frame rate. Capped so a stalled tab does not
    // come back and flush the entire history in one go.
    wAcc = Math.min(wAcc + dt, 0.25);
    const period = 1/50;
    const st = { beat: S.beat, t: S.t, harmHue: harmHue, bar: (beatCount + beatPhase)/4 };
    while (wAcc >= period){ waterPushRow(1.0, st); wAcc -= period; }

    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, histTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, WCOLS, WROWS, gl.RED, gl.UNSIGNED_BYTE, histData);
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, rowTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 1, WROWS, gl.RGBA, gl.UNSIGNED_BYTE, rowData);

    // No blending and no depth test: each ribbon's opaque skirt IS the occluder, and
    // instance 0 (the horizon) is drawn first so nearer rows paint over it.
    gl.useProgram(progWater);
    gl.uniform1i(U(progWater,'u_hist'), 3);
    gl.uniform1i(U(progWater,'u_row'), 5);
    gl.uniform1f(U(progWater,'u_rows'), WROWS);
    // The synth wave rides the beat grid, so the surface undulates IN TIME rather than
    // on its own clock. With no tempo lock yet (bpmConf low) it falls back to a free run
    // off u_time, which is what the shader's -u_time term already provides.
    gl.uniform1f(U(progWater,'u_waveAmp'), (0.045 + S.bass*0.075 + S.burst*0.06) * waterAmp);
    gl.uniform1f(U(progWater,'u_waveK'), 7.0 + S.treb*22.0);
    gl.uniform1f(U(progWater,'u_wavePh'), bpmConf > 0.25 ? beatPhase : 0.0);
    gl.uniform1f(U(progWater,'u_amp'), waterAmp);
    gl.uniform1f(U(progWater,'u_time'), S.t);
    gl.uniform1f(U(progWater,'u_bass'), S.bass);
    gl.uniform1f(U(progWater,'u_treble'), S.treb);
    gl.uniform1f(U(progWater,'u_beat'), S.beat);
    gl.uniform1f(U(progWater,'u_burst'), S.burst);
    gl.uniform1f(U(progWater,'u_safe'), S.safe);
    gl.uniform1f(U(progWater,'u_sway'), S.safe);
    gl.uniform1f(U(progWater,'u_exposure'), S.expo);
    gl.uniform3fv(U(progWater,'u_c1'), S.c1);
    gl.uniform3fv(U(progWater,'u_c2'), S.c2);
    gl.bindVertexArray(waterVAO);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, WCOLS*2, WROWS);
    gl.bindVertexArray(null);
    gl.activeTexture(gl.TEXTURE0);
  }
  function drawFluid(S, dt){
    if (!allocFluid()) { drawWeb(S); return; }   // aspect changed / alloc failed
    simFluid(S, dt);
    bindRT(sceneRT);
    gl.disable(gl.BLEND);
    gl.useProgram(progFDraw);
    gl.uniform2f(U(progFDraw,'u_texel'), 1/fW, 1/fH);
    gl.uniform2f(U(progFDraw,'u_res'), RW, RH);
    fTex(4, fDye[fD], progFDraw, 'u_dye');
    gl.uniform1f(U(progFDraw,'u_time'), S.t);
    gl.uniform1f(U(progFDraw,'u_beat'), S.beat);
    gl.uniform1f(U(progFDraw,'u_burst'), S.burst);
    gl.uniform1f(U(progFDraw,'u_safe'), S.safe);
    gl.uniform1f(U(progFDraw,'u_exposure'), S.expo);
    gl.uniform3fv(U(progFDraw,'u_c1'), S.c1);
    drawQuad();
    gl.activeTexture(gl.TEXTURE0);
  }
  // one frame: upload the spectrum, let the mode draw the scene, then post to canvas
  function renderFrame(S, dt){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fftTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, freqData.length, 1, gl.RED, gl.UNSIGNED_BYTE, freqData);
    if (modeId === 'nebula' && nebulaOK) drawNebula(S, dt);
    else if (modeId === 'water') drawWaterfall(S, dt);
    else if (modeId === 'fluid' && fluidOK) drawFluid(S, dt);
    else drawWeb(S);
    postProcess(S, trailsOn ? applyTrails(S) : sceneRT);
  }
  // the per-frame state every mode and the post chain reads
  function frameState(t, a){
    const th = THEMES[+themeSel.value];
    return {
      t, bass:a.bass, mid:a.mid, treb:a.treb, beat,
      coil, burst, expo: exposure(a.energy), safe: safeVal(),
      // the harmonic drift is baked into c1/c2 here, so u_hue only carries the
      // PER-PARTICLE spread (speed/seed) -- adding harmHue again would double-shift
      c1: shiftHue(th.c1, harmHue), c2: shiftHue(th.c2, harmHue), hue: 0
    };
  }
  // CPU-side twin of the shader's hueShift -- lets the harmonic drift be baked into
  // the theme colors once per frame instead of per pixel.
  function shiftHue(c, a){
    const k = 0.5773502692, cs = Math.cos(a), sn = Math.sin(a);
    const dot = k*(c[0]+c[1]+c[2]);
    return new Float32Array([
      c[0]*cs + (k*c[2] - k*c[1])*sn + k*dot*(1-cs),
      c[1]*cs + (k*c[0] - k*c[2])*sn + k*dot*(1-cs),
      c[2]*cs + (k*c[1] - k*c[0])*sn + k*dot*(1-cs),
    ]);
  }

  // ---------------- NERV HUD (2D overlay) ----------------
  const glyphCols = 40;
  let scrollY = 0;
  // named readout: the MAGI "reads" the track in real time from the envelope signals.
  // Priority events (drop/build) interrupt instantly; steady states hold ~0.5s so the
  // label doesn't strobe. Returns a short status string for the HUD.
  let hudLabel = 'SYSTEM NOMINAL', hudLabelP = 0, hudLabelT = 0;
  function musicReadout(a, now){
    const tot = a.bass + a.mid + a.treb + 1e-3;
    let label, pri;
    if (burst > 0.4)              { label='RELEASE // DROP';  pri=5; }
    else if (coil > 0.5)          { label='TENSION RISING';   pri=4; }
    else if (coil > 0.25)         { label='CHARGING';         pri=3; }
    else if (energyFast < 0.12)   { label='SIGNAL LOW';       pri=3; }
    else if (a.treb/tot > 0.42)   { label='HARMONIC BLOOM';   pri=1; }
    else if (a.bass/tot > 0.55)   { label='SUB-BASS SURGE';   pri=1; }
    else                          { label='PATTERN LOCKED';   pri=1; }
    if (label !== hudLabel){
      if (pri > hudLabelP || now - hudLabelT > 550){ hudLabel = label; hudLabelP = pri; hudLabelT = now; }
    } else { hudLabelP = pri; hudLabelT = now; }
    return hudLabel;
  }
  // The NERV chrome is the app's identity, but it is not the USER's -- nobody posts
  // their own single branded as somebody else's world. So it is one layer among three:
  // optional chrome, the user's own title, and the (never-recorded) safe-area guides.
  let hudOn = true;
  function drawHUD(a, now){
    if (hudOn) drawNervHUD(a, now);
    drawTitleCard();
    drawSafeArea(H/1080);
  }
  // The user's own credit, placed INSIDE the Reels safe area so Instagram's caption
  // cannot bury it. Drawn on the view canvas, so it is part of the recording.
  function drawTitleCard(){
    const t = (titleIn.value || '').trim(), ar = (artistIn.value || '').trim();
    if (!t && !ar) return;
    const s = H/1080;
    const x = W*SAFE.side + 16*s;
    let y = H - H*SAFE.bottom - 26*s;
    vctx.save();
    vctx.textAlign = 'left'; vctx.textBaseline = 'alphabetic';
    vctx.shadowColor = 'rgba(0,0,0,0.9)'; vctx.shadowBlur = 14*s;
    if (ar){
      vctx.fillStyle = 'rgba(255,255,255,0.74)';
      vctx.font = `500 ${Math.round(27*s)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      vctx.fillText(ar.toUpperCase(), x, y);
      y -= 36*s;
    }
    if (t){
      vctx.fillStyle = '#fff';
      vctx.font = `700 ${Math.round(44*s)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      vctx.fillText(t.toUpperCase(), x, y);
    }
    vctx.restore();
  }
  function drawNervHUD(a, now){
    const th = THEMES[+themeSel.value];
    const amber = th.hud;
    const s = H/1080;               // scale factor
    vctx.save();
    vctx.font = `${Math.round(15*s)}px "Courier New", monospace`;
    vctx.textBaseline = 'top';
    vctx.shadowColor = amber; vctx.shadowBlur = 6*s;

    // corner brackets
    vctx.strokeStyle = amber; vctx.lineWidth = 2*s;
    const m = 26*s, L = 46*s;
    bracket(m,m,1,1,L); bracket(W-m,m,-1,1,L); bracket(m,H-m,1,-1,L); bracket(W-m,H-m,-1,-1,L);

    // thin frame
    vctx.globalAlpha = 0.5; vctx.lineWidth = 1*s;
    vctx.strokeRect(m,m,W-2*m,H-2*m);
    vctx.globalAlpha = 1;

    vctx.fillStyle = amber;
    // top-left block
    vctx.font = `bold ${Math.round(22*s)}px "Courier New", monospace`;
    vctx.fillText('NERV', m+14*s, m+12*s);
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    vctx.fillStyle = 'rgba(255,206,158,0.7)';
    vctx.fillText('MAGI SYSTEM // CASPER-3', m+14*s, m+40*s);
    // live named readout: the MAGI reads the track. Hot color on drop/release.
    const readout = musicReadout(a, now);
    const hot = (burst > 0.4 || coil > 0.5);
    vctx.fillStyle = hot ? '#ffd24a' : 'rgba(255,206,158,0.7)';
    vctx.fillText('READ : ' + readout, m+14*s, m+56*s);
    vctx.fillStyle = 'rgba(255,206,158,0.7)';

    // top-right SYNC ratio (living gauge; +tiny readout jitter so it looks live)
    const sync = Math.min(0.999, syncRatio + (Math.random()-0.5)*0.0015);
    vctx.textAlign = 'right';
    vctx.fillStyle = amber;
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    vctx.fillText('SYNC RATIO', W-m-14*s, m+12*s);
    vctx.font = `bold ${Math.round(30*s)}px "Courier New", monospace`;
    vctx.fillText(sync.toFixed(3), W-m-14*s, m+26*s);
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    vctx.fillStyle = 'rgba(255,206,158,0.7)';
    // pattern lock readout when the web coalesces into a silhouette
    vctx.fillText(coh > 0.45 ? 'PATTERN: '+SHAPES[shapeIdx].name : 'HARMONICS NOMINAL',
                  W-m-14*s, m+62*s);
    vctx.textAlign = 'left';

    // left vertical spectrum bars
    const bars = 24, bx = m+16*s, bw = 8*s, bh = 5*s, gap = 3*s;
    const startY = H/2 - (bars*(bh+gap))/2;
    for (let i=0;i<bars;i++){
      const idx = Math.floor(Math.pow(i/bars,1.5)*220)+2;
      const v = Math.min((freqData[idx]/255)*inputGain, 1);
      const lit = Math.round(v*14);
      for (let j=0;j<14;j++){
        vctx.globalAlpha = j<lit ? 1 : 0.12;
        vctx.fillStyle = j>10 ? '#e2231a' : amber;
        vctx.fillRect(bx + j*(bw+2*s), startY + i*(bh+gap), bw, bh);
      }
    }
    vctx.globalAlpha = 1;

    // right scrolling hex telemetry
    vctx.fillStyle = 'rgba(255,206,158,0.35)';
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    scrollY = (scrollY + 0.6) % (14*s);
    const colX = W-m-150*s;
    for (let r=0;r<18;r++){
      let str='';
      for (let c=0;c<10;c++) str += Math.floor(Math.random()*16).toString(16).toUpperCase();
      vctx.globalAlpha = 0.25 + 0.2*Math.sin(r*0.5+now/400);
      vctx.fillText(str, colX, H/2 - 120*s + r*14*s + scrollY);
    }
    vctx.globalAlpha = 1;

    // bottom-left mission clock
    vctx.fillStyle = amber;
    vctx.font = `${Math.round(13*s)}px "Courier New", monospace`;
    const tc = mediaEl && mediaEl.currentTime ? mediaEl.currentTime : (now/1000);
    const mm = String(Math.floor(tc/60)).padStart(2,'0');
    const ss = String(Math.floor(tc%60)).padStart(2,'0');
    const ff = String(Math.floor((tc%1)*30)).padStart(2,'0');
    vctx.fillText(`T-${mm}:${ss}:${ff}`, m+14*s, H-m-30*s);
    vctx.fillStyle='rgba(255,206,158,0.6)';
    vctx.fillText('BLOOD TYPE: BLUE', m+120*s, H-m-30*s);

    // tempo + key: the MAGI's read on the song's STRUCTURE, not just its loudness
    const locked = bpm > 0 && bpmConf > 0.3;
    vctx.fillStyle = amber;
    vctx.fillText(`BPM ${locked ? Math.round(bpm) : '---'}   KEY ${keyIdx>=0 && keyConf>0.2 ? NOTE_NAMES[keyIdx] : '--'}`,
                  m+14*s, H-m-52*s);
    if (locked){                       // four pips: watch the bar turn over
      const px = m+185*s, py = H-m-46*s;
      for (let i=0;i<4;i++){
        vctx.globalAlpha = (i === beatCount) ? 1 - beatPhase*0.55 : 0.2;
        vctx.beginPath(); vctx.arc(px + i*15*s, py, 4*s, 0, 6.2832); vctx.fill();
      }
      vctx.globalAlpha = 1;
    }

    // warning flash on strong beats
    if (beat > 0.55) {
      vctx.globalAlpha = Math.min(1, beat);
      vctx.fillStyle = '#e2231a';
      vctx.shadowColor = '#e2231a'; vctx.shadowBlur = 16*s;
      vctx.textAlign = 'center';
      vctx.font = `bold ${Math.round(34*s)}px "Courier New", monospace`;
      vctx.fillText('警告  PATTERN BLUE', W/2, H-m-52*s);
      vctx.font = `${Math.round(13*s)}px "Courier New", monospace`;
      vctx.fillText('AT-FIELD DETECTED', W/2, H-m-14*s);
      vctx.textAlign = 'left';
    }
    vctx.restore();
  }

  // Instagram covers the bottom of a Reel with the caption, audio ticker and action
  // buttons, and the top with its own chrome. Anything composed there is buried, and
  // you only find out after posting. Meta's published safe area for 1080x1920 is 250px
  // from the top and 420px from the bottom; sides are a further ~60px.
  //
  // Guides are drawn on the VIEW canvas but gated on `!recording`, so they are visible
  // while composing and can never end up burned into a take.
  const SAFE = { top: 250/1920, bottom: 420/1920, side: 60/1080 };
  function drawSafeArea(s){
    if (!safeArea || recording) return;
    const x0 = W*SAFE.side, x1 = W - W*SAFE.side;
    const y0 = H*SAFE.top,  y1 = H - H*SAFE.bottom;
    vctx.save();
    // dim what IG will cover, so the readable area is obvious at a glance
    vctx.fillStyle = 'rgba(0,0,0,0.42)';
    vctx.fillRect(0, 0, W, y0);
    vctx.fillRect(0, y1, W, H-y1);
    vctx.fillRect(0, y0, x0, y1-y0);
    vctx.fillRect(x1, y0, W-x1, y1-y0);
    vctx.strokeStyle = 'rgba(90,220,255,0.85)';
    vctx.lineWidth = Math.max(1, 2*s);
    vctx.setLineDash([10*s, 8*s]);
    vctx.strokeRect(x0, y0, x1-x0, y1-y0);
    vctx.setLineDash([]);
    vctx.fillStyle = 'rgba(90,220,255,0.95)';
    vctx.font = `${Math.round(13*s)}px "Courier New", monospace`;
    vctx.fillText('REELS SAFE AREA', x0 + 8*s, y0 + 6*s);
    vctx.textAlign = 'center';
    vctx.fillText('CAPTION / AUDIO / BUTTONS', W/2, y1 + 16*s);
    vctx.textAlign = 'left';
    vctx.restore();
  }
  function bracket(x,y,sx,sy,L){
    vctx.beginPath();
    vctx.moveTo(x, y+sy*L); vctx.lineTo(x, y); vctx.lineTo(x+sx*L, y);
    vctx.stroke();
  }

  // ---------------- Main loop ----------------
  let running=false, startT=performance.now(), lastFrameT=performance.now();
  function loop(now){
    if (!running) return;
    requestAnimationFrame(loop);
    const dtMs = Math.min(Math.max(now - lastFrameT, 1), 100);
    lastFrameT = now;
    const dt = dtMs/1000;

    analyser.getByteTimeDomainData(timeData);

    renderFrame(S, dt);

  // ---------------- Song fingerprint (persistent per-track portrait) ----------------
  // A polar spectrogram accreted over the whole track: angle advances with song time
  // (~one turn per TURN_SECS), radius maps the spectrum (bass inner -> treble outer),
  // beats leave outer ticks, drops leave bright radial flares. The finished ring is a
  // unique, screenshot-able portrait of that specific song.
  const FP_SIZE = 1024, TURN_SECS = 175;
  const fpCanvas = document.createElement('canvas'); fpCanvas.width = fpCanvas.height = FP_SIZE;
  const fpctx = fpCanvas.getContext('2d');
  let fpMode = false, fpName = '', fpLastAngle = -Math.PI/2, fpBeatPk = 0, fpBurstPk = 0;
  let safeArea = false;
  function rgbOf(c, s){ return `rgb(${Math.min(255,c[0]*s*255)|0},${Math.min(255,c[1]*s*255)|0},${Math.min(255,c[2]*s*255)|0})`; }
  function fpReset(name){
    fpctx.clearRect(0,0,FP_SIZE,FP_SIZE);

  }
  function fpTick(songT){
    fpBeatPk = Math.max(fpBeatPk, beat); fpBurstPk = Math.max(fpBurstPk, burst);
    const angle = -Math.PI/2 + (songT/TURN_SECS)*Math.PI*2;
    if (angle - fpLastAngle < 0.006) return;          // tile slices, avoid over-accumulation
    fpLastAngle = angle;
    const th = THEMES[+themeSel.value];
    const cx = FP_SIZE/2, cy = FP_SIZE/2, R0 = FP_SIZE*0.14, R1 = FP_SIZE*0.46, B = 60, slice = (R1-R0)/B;
    fpctx.save();
    fpctx.translate(cx, cy); fpctx.rotate(angle);
    fpctx.globalCompositeOperation = 'lighter';

      const amp = freqData[idx]/255;
      if (amp < 0.05) continue;

  function drawFingerprint(){
    vctx.save();

    vctx.fillStyle = '#ffb45a';

    vctx.fillText('MAGI // ACOUSTIC FINGERPRINT', m, m);
    vctx.fillStyle = 'rgba(255,180,90,0.75)';

  function fpSave(){

    const c = document.createElement('canvas');

    x.fillStyle = '#ffb45a';
    x.font = `600 ${Math.round(m*0.60)}px ui-monospace, Menlo, monospace`;
    x.fillText('MAGI // ACOUSTIC FINGERPRINT', W/2, top + m*0.2);

    x.font = `500 ${Math.round(m*0.46)}px ui-monospace, monospace`;

    hint.innerHTML = `<div class="big">${msg}</div>`;

  }

  // ---- clip length: beat-locked loops and platform limits ----
  // A Reel that loops seamlessly racks up replays, and replays are what the ranking
  // actually rewards -- but only if the clip is a whole number of BARS and starts on a
  // downbeat. listen() already tracks tempo and bar position, so this is just wiring.
  // NOTE this makes the AUDIO loop cleanly; the visuals do not return to a previous
  // state (the force-directed web and the fluid never do), so the seam is continuity,
  // not a true cycle.
  let recArmed = false, recStopAt = 0;
  function clipBars(){
    const v = clipSel.value;
    return v === 'bars4' ? 4 : v === 'bars8' ? 8 : v === 'bars16' ? 16 : 0;
  }
  function clipLimit(){
    const v = clipSel.value;

  }
  // Called every frame while armed: begin exactly on the next downbeat.

  function startRec(){
    const bars = clipBars();

    // confidence the grid is guesswork and the "loop" would not loop -- say so and
    // record free rather than silently producing a clip that seams badly.
    if (bars && bpmConf > 0.30 && beatPeriod > 0){
      recArmed = true;
      recBtn.textContent = '◴ Cue';

  function beginRec(){

    recording = true;
    if (renderScale !== 1){ renderScale = 1; allocRTs(W, H); }
    // 30fps at 1080x1920: a full-size vertical frame is 3x the pixels the old 608x1080
    // one was, and a phone that cannot hold 60 drops frames into the take (which looks
    // far worse than 30 ever does). Instagram delivers Reels at 30 regardless.
    const stream = view.captureStream(W*H >= 1080*1920 ? 30 : 60);
    const tracks = [...stream.getVideoTracks()];
    if (destNode && destNode.stream.getAudioTracks().length) tracks.push(...destNode.stream.getAudioTracks());

      if (P.has('hud'))    hudOn = tp('hud',1) > 0.5;
      if (P.has('title'))  titleIn.value  = P.get('title');

      if (P.has('coh'))   testCoh = tp('coh',1);

      if (P.has('coil'))  coil  = tp('coil',0);   // breathing overrides for headless verify

      if (modeId === 'fluid' && fluidOK && allocFluid()){
        const warm = P.has('warm') ? (tp('warm',120)|0) : 120;
        for (let i=0;i<warm;i++) simFluid({...S, t: tf - (warm-i)*0.016}, 0.016);
      }
      if (modeId === 'nebula' && nebulaOK){
        // settle the cloud: the sim is iterative, so a single step would only ever
        // screenshot the seed distribution. Warm it up with fixed steps first.
        const warm = P.has('warm') ? (tp('warm',180)|0) : 180;
        for (let i=0;i<warm;i++) simParticles({...S, t: tf - (warm-i)*0.016}, 0.016);
      }
      // ?anim=N advances time over N frames instead of repeating one instant. Anything
      // built up over time -- feedback trails, the particle sim -- is invisible in a
      // static render, so it needs real frames to accumulate before the screenshot.
      const animN = P.has('anim') ? Math.max(1, tp('anim',45)|0) : 0;
      const frames = animN || 6;
      let _tframes = 0;
      (function testLoop(){
        if (animN){ S.t = tf + _tframes/60; updateNet(1/60, 1.0); }
        renderFrame(S, 1/60);
        vctx.drawImage(glCanvas, 0, 0, W, H);
        drawHUD({bass,mid,treb,energy}, (tf + _tframes/60)*1000);
        // render a few frames then STOP so headless virtual-time can idle
        // (the frame is deterministic, so this settles immediately) and screenshot.
        if (++_tframes < frames) requestAnimationFrame(testLoop);
      })();
      return; // skip the normal idle preview
    }

    // idle preview so it isn't blank before audio loads
    let idleT = performance.now();
    (function idle(now){
      if (!running) {
        now = now || performance.now();
        const dt = Math.min(Math.max(now - idleT, 1), 100)/1000;
        idleT = now;
        const a = { bass: 0.12+0.05*Math.sin(now/700), mid: 0.1, treb: 0.1, energy: 0.12 };
        const S = frameState(now/1000, a);
        S.beat = 0; S.expo = 1.0;
        if (modeId === 'web') updateNet(dt, 1.0);
        renderFrame(S, dt);
        vctx.drawImage(glCanvas, 0, 0, W, H);
        drawHUD({bass:0,mid:0,treb:0,energy:0}, now);
        requestAnimationFrame(idle);
      }
    })();
  } catch(err) {
    document.getElementById('hint').innerHTML =
      '<div class="big" style="color:#e2231a">WEBGL2 ERROR</div><div class="small">'+err.message+'</div>';
  }
})();
</script>
<script>
  if ('serviceWorker' in navigator)
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
