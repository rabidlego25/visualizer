<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0a0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>MAGI — EVA Sound Visualizer</title>
<style>
  :root {
    --bg: #050506;
    --panel: rgba(12, 10, 8, 0.82);
    --border: rgba(255, 140, 26, 0.25);
    --amber: #ff8c1a;
    --amber-dim: #a85c10;
    --text: #ffce9e;
    --muted: #8a6a44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0; padding: 16px;
  }
  /* The GL canvas renders offscreen-ish; the 2D canvas is what you see + record */
  #gl { display: none; }
  #view {
    background: #000;
    border-radius: 6px;
    cursor: grab;
    touch-action: none;   /* let us handle drag on touch without scrolling */
    box-shadow: 0 0 0 1px rgba(255,140,26,0.2), 0 24px 70px rgba(0,0,0,0.7),
                0 0 60px rgba(255,80,20,0.08);
    max-width: 100%; max-height: 100%;
  }

  #hint {
    position: absolute; inset: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    pointer-events: none; text-align: center; color: var(--muted);
    transition: opacity 0.4s; letter-spacing: 2px;
  }
  #hint .big { font-size: 20px; font-weight: 700; color: var(--amber); text-transform: uppercase; }
  #hint .small { font-size: 12px; }
  #hint.hidden { opacity: 0; }

  #controls, #seekbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--panel);
    backdrop-filter: blur(16px); border-top: 1px solid var(--border);
    flex-wrap: wrap; justify-content: center;
  }
  #seekbar { padding: 7px 20px; gap: 12px; }
  #seekbar.disabled { opacity: 0.4; }
  .group { display: flex; align-items: center; gap: 8px; }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  button, .filebtn {
    background: rgba(255,140,26,0.08); color: var(--text);
    border: 1px solid var(--border); padding: 8px 13px; border-radius: 4px;
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; user-select: none;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover, .filebtn:hover { background: rgba(255,140,26,0.2); }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--amber); border-color: transparent; color: #1a0d00; }
  button.rec { background: #e2231a; border-color: transparent; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }

  label.field { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; letter-spacing: 1px; text-transform: uppercase; }
  select {
    background: rgba(255,140,26,0.06); color: var(--text);
    border: 1px solid var(--border); padding: 7px 9px; border-radius: 4px;
    font-family: inherit; font-size: 12px; cursor: pointer;
  }
  input[type=range] { accent-color: var(--amber); cursor: pointer; }
  #seek { flex: 1; height: 5px; }
  input[type=file] { display: none; }
  .tlabel { font-size: 12px; color: var(--muted); min-width: 44px; }
  .tlabel:last-child { text-align: right; }
  #recDot { display: none; width: 9px; height: 9px; border-radius: 50%; background: #e2231a; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #timer { font-size: 12px; color: var(--muted); min-width: 42px; }
  .brand { font-weight: 700; letter-spacing: 3px; font-size: 14px; color: var(--amber); margin-right: 4px; }

  @media (max-width: 760px) { .brand, .sep { display: none; } #controls { padding: 9px; gap: 6px; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="view"></canvas>
    <div id="hint">
      <div class="big">// SOUND ONLY</div>
      <div class="small">DROP AUDIO FILE · OR USE CONTROLS BELOW · OR MICROPHONE</div>
    </div>
  </div>

  <div id="seekbar" class="disabled">
    <span id="curTime" class="tlabel">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
    <span id="durTime" class="tlabel">0:00</span>
  </div>

  <div id="controls">
    <a class="brand" href="index.html" title="← All visualizers" style="text-decoration:none;color:inherit">NERV</a>
    <div class="group">
      <label class="filebtn" for="fileInput">▷ Load</label>
      <input type="file" id="fileInput" accept="audio/*">
      <button id="micBtn">◉ Mic</button>
      <button id="playBtn" class="primary" disabled>▶ Play</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <label class="field">Engine
        <select id="modeSel">
          <option value="web">🧠 Neural Web</option>
          <option value="nebula">✦ Particle Nebula</option>
        </select>
      </label>
      <label class="field">Unit
        <select id="themeSel">
          <option value="0">01 · NERV Amber</option>
          <option value="1">02 · Unit-01</option>
          <option value="2">03 · Pattern Blue</option>
          <option value="3">04 · Blood</option>
          <option value="4">05 · Testify ✦</option>
        </select>
      </label>
      <label class="field">Format
        <select id="ratioSel">
          <option value="9:16" selected>Vert 9:16</option>
          <option value="1:1">Square 1:1</option>
          <option value="16:9">Wide 16:9</option>
        </select>
      </label>
      <button id="netBtn" class="primary">🧠 Neural</button>
      <label class="field"><span id="nodeLbl">Nodes</span> <input type="range" id="nodeSlider" min="0" max="1" step="0.01" value="0.8"></label>
      <button id="safeBtn" title="Reduce flashing & motion">🕊 Calm</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="fpBtn" title="Song fingerprint — a unique portrait of this track">◎ Print</button>
      <button id="fpSaveBtn" title="Download the fingerprint as a PNG">⤓ Save</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="recBtn" class="rec" disabled>● Rec</button>
      <span id="recDot"></span>
      <span id="timer">0:00</span>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ============================================================
  //  MAGI / EVA sound visualizer
  //  - GPU fragment shader (WebGL2) renders the reactive scene.
  //  - A 2D canvas blits the GPU frame + draws the NERV telemetry
  //    HUD on top, and is the single surface we record.
  //  NOTE: to move this to WebGPU later, only createRenderer() and
  //  the shader source need to change; everything else is portable.
  // ============================================================

  const glCanvas  = document.getElementById('gl');
  const view      = document.getElementById('view');
  const vctx      = view.getContext('2d');
  const hint      = document.getElementById('hint');
  const fileInput = document.getElementById('fileInput');
  const micBtn    = document.getElementById('micBtn');
  const playBtn   = document.getElementById('playBtn');
  const themeSel  = document.getElementById('themeSel');
  const modeSel   = document.getElementById('modeSel');
  const nodeLbl   = document.getElementById('nodeLbl');
  const ratioSel  = document.getElementById('ratioSel');
  const recBtn    = document.getElementById('recBtn');
  const recDot    = document.getElementById('recDot');
  const timerEl   = document.getElementById('timer');
  const netBtn    = document.getElementById('netBtn');
  const safeBtn   = document.getElementById('safeBtn');
  const nodeSlider= document.getElementById('nodeSlider');
  const fpBtn     = document.getElementById('fpBtn');
  const fpSaveBtn = document.getElementById('fpSaveBtn');
  const seekbar   = document.getElementById('seekbar');
  const seek      = document.getElementById('seek');
  const curTime   = document.getElementById('curTime');
  const durTime   = document.getElementById('durTime');

  // Themes: [hot edge color, base edge color, HUD css color]
  const THEMES = [
    { c1:[1.0,0.55,0.12], c2:[0.95,0.10,0.05], hud:'#ff8c1a' }, // NERV amber
    { c1:[0.55,1.0,0.18], c2:[0.55,0.12,0.95], hud:'#8cff3c' }, // Unit-01 green/purple
    { c1:[0.35,0.75,1.0], c2:[0.10,0.25,0.95], hud:'#4cc9ff' }, // Pattern Blue
    { c1:[1.0,0.25,0.15], c2:[0.55,0.02,0.02], hud:'#ff4530' }, // Blood
    { c1:[1.0,0.82,0.20], c2:[1.0,0.12,0.70], hud:'#ffcf3a' }, // Testify (gold + magenta, hyper-vivid)
  ];

  // ---------------- Audio ----------------
  let audioCtx=null, analyser=null, sourceNode=null, mediaEl=null, mediaElSrc=null, micStream=null;
  let freqData=null, timeData=null, destNode=null, currentURL=null;

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.80;
    freqData = new Uint8Array(analyser.frequencyBinCount); // 1024
    timeData = new Uint8Array(analyser.fftSize);
    destNode = audioCtx.createMediaStreamDestination();
  }
  function disconnectSource() {
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode=null; }
    if (micStream) { micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    if (mediaEl) mediaEl.pause();
  }
  function connect(node, toSpeakers) {
    node.connect(analyser);
    analyser.connect(destNode);
    if (toSpeakers) analyser.connect(audioCtx.destination);
  }
  function loadFile(file) {
    ensureAudio(); disconnectSource();
    if (currentURL) URL.revokeObjectURL(currentURL);
    currentURL = URL.createObjectURL(file);
    if (!mediaEl) {
      mediaEl = new Audio(); mediaEl.crossOrigin='anonymous';
      mediaEl.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmt(mediaEl.duration);
        seek.disabled=false; seekbar.classList.remove('disabled');
      });
      mediaEl.addEventListener('timeupdate', () => {
        if (seeking || !mediaEl.duration) return;
        seek.value = (mediaEl.currentTime/mediaEl.duration)*1000;
        curTime.textContent = fmt(mediaEl.currentTime);
      });
      // an <audio> element may only ever have ONE MediaElementSource -- create it
      // once and reuse it, or a second load throws InvalidStateError (drop #2 fails).
      mediaElSrc = audioCtx.createMediaElementSource(mediaEl);
    }
    mediaEl.src = currentURL; mediaEl.loop=false;
    mediaEl.onended = () => { playBtn.textContent='▶ Play'; };
    sourceNode = mediaElSrc;
    connect(sourceNode, true);
    playBtn.disabled=false; recBtn.disabled=false;
    fpReset(file.name);
    hint.classList.add('hidden'); startLoop(); play();
  }
  async function useMic() {
    ensureAudio();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      disconnectSource(); micStream=stream;
      sourceNode = audioCtx.createMediaStreamSource(stream);
      connect(sourceNode, false);
      playBtn.disabled=true; recBtn.disabled=false;
      seek.disabled=true; seekbar.classList.add('disabled');
      curTime.textContent=durTime.textContent='0:00';
      fpReset('LIVE INPUT');
      hint.classList.add('hidden'); startLoop();
    } catch(e) { alert('Microphone access failed: '+e.message); }
  }
  function play() {
    if (!mediaEl) return;
    if (audioCtx.state==='suspended') audioCtx.resume();
    if (mediaEl.paused) { mediaEl.play(); playBtn.textContent='❚❚ Pause'; }
    else { mediaEl.pause(); playBtn.textContent='▶ Play'; }
  }
  function fmt(s){ if(!isFinite(s))return '0:00'; s=Math.floor(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

  // ---------------- Sizing ----------------
  let W=0, H=0;
  function resize() {
    const [rw,rh] = ratioSel.value.split(':').map(Number);
    const stage = document.getElementById('stage');
    const aw = stage.clientWidth-32, ah = stage.clientHeight-32;
    let cw=aw, ch=cw*rh/rw;
    if (ch>ah) { ch=ah; cw=ch*rw/rh; }
    view.style.width=cw+'px'; view.style.height=ch+'px';
    H = 1080; W = Math.round(1080*rw/rh);          // GPU handles full 1080p
    glCanvas.width=W; glCanvas.height=H;
    view.width=W; view.height=H;
    if (gl) allocRTs(Math.round(W*renderScale), Math.round(H*renderScale));
  }

  // ---------------- WebGL2 engine ----------------
  // Multi-pass pipeline:
  //   1. the active MODE draws the hero visual into sceneRT (HDR when float RTs exist)
  //   2. bright-pass -> two octaves of separable blur  = real, thresholded bloom
  //   3. composite: chromatic aberration + bloom + ACES tonemap + CRT grade -> canvas
  // Only step 1 changes when a mode is added, so new hero visuals are cheap to build.
  // The old fake bloom (col += col*col) lifted EVERYTHING to buy glow, which is why
  // loud passages blew out; a thresholded bright-pass + filmic rolloff gives the glow
  // back without the white-out.
  let gl=null, fftTex=null, quadVAO=null;
  const uCache = new Map();
  function U(p, n){                    // cached uniform lookup (null locations no-op)
    let m = uCache.get(p);
    if (!m){ m = new Map(); uCache.set(p, m); }
    if (!m.has(n)) m.set(n, gl.getUniformLocation(p, n));
    return m.get(n);
  }

  // shared GLSL helpers, injected into every program
  const COMMON = `
  // rotate a color around the value axis -> vivid hue shimmer
  vec3 hueShift(vec3 c, float a){
    const vec3 k = vec3(0.57735);
    float cs = cos(a), sn = sin(a);
    return c*cs + cross(k,c)*sn + k*dot(k,c)*(1.0-cs);
  }
  float h11(float p){ return fract(sin(p*127.1)*43758.5453); }
  float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  `;

  const VERT = `#version 300 es
  layout(location=0) in vec2 a_pos;
  void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

  const FRAG_WEB = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2  u_res;
  uniform float u_time;
  uniform float u_bass;
  uniform float u_mid;
  uniform float u_treble;
  uniform float u_beat;
  uniform vec3  u_c1;      // hot edge color
  uniform vec3  u_c2;      // base edge color
  uniform sampler2D u_fft; // 1D-ish frequency texture

  const int MAXN = 48;     // neural nodes (hard cap of the uniform array)
  const int MAXE = 96;     // neural edges
  uniform vec3  u_nodes[MAXN];  // xy = position (uv space), z = energy 0..1
  uniform vec4  u_edges[MAXE];  // (x1,y1) -> (x2,y2); padded entries use x>90
  uniform float u_net;          // neural-net master intensity 0..1
  uniform float u_exposure;     // auto-exposure: <1 during sustained-loud passages
  uniform float u_safe;         // 1 = full effects, low = reduced motion/flashing
  uniform float u_coh;          // 0..1 coalescence: background quiets so the figure reads
  uniform float u_coil;         // 0..1 tension winding up (build) -> brighter
  uniform float u_burst;        // 0..1 release exhale -> flash + outward pop
  const int MAXF = 24;          // silhouette outline points (closed polygon)
  uniform vec2  u_fig[MAXF];    // figure outline in uv space (already spun/placed by JS)
  uniform int   u_figN;         // active outline point count (0 = no figure)
  uniform vec3  u_figA;         // figure body color
  uniform vec3  u_figB;         // figure rim / accent color
  ${COMMON}

  float hexDist(vec2 p){ p = abs(p); return max(dot(p, vec2(0.866025,0.5)), p.y); }
  vec4 hexCoords(vec2 uv){
    vec2 r = vec2(1.0, 1.732050);
    vec2 h = r*0.5;
    vec2 a = mod(uv, r) - h;
    vec2 b = mod(uv - h, r) - h;
    vec2 gv = dot(a,a) < dot(b,b) ? a : b;
    float y = 0.5 - hexDist(gv);
    vec2 id = uv - gv;
    return vec4(gv.x, y, id);
  }
  float fftAt(float t){ return texture(u_fft, vec2(clamp(t,0.0,1.0), 0.5)).r; }

  // anime "speed lines" radiating from center, strongest at the edges
  float speedLines(vec2 uv, float t){
    float a = atan(uv.y, uv.x);
    float r = length(uv);
    float l = sin(a*64.0 + sin(a*11.0 + t)*2.0);
    l = smoothstep(0.55, 1.0, l);
    return l * smoothstep(0.30, 1.15, r);
  }

  // distance from point p to segment a-b
  float segDist(vec2 p, vec2 a, vec2 b){
    vec2 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/(dot(ba,ba)+1e-5), 0.0, 1.0);
    return length(pa - ba*h);
  }
  // MAGI neural web: glowing synapse lines with data packets racing along them
  vec3 neuralNet(vec2 uv, float t){
    vec3 col = vec3(0.0);
    vec3 lineCol = mix(u_c1, vec3(1.0), 0.35);
    for (int i=0;i<MAXE;i++){
      vec4 e = u_edges[i];
      if (e.x > 90.0) continue;                       // padded / inactive edge
      float d = segDist(uv, e.xy, e.zw);
      col += lineCol * smoothstep(0.006,0.0,d) * 0.22; // soft synapse
      col += lineCol * smoothstep(0.0016,0.0,d) * 0.6; // bright core
      // fast-moving data packets (multiple per edge, speed surges on beats)
      float seed = fract(sin(float(i)*13.19)*43758.5453);
      for (int k=0;k<2;k++){
        float sp  = 0.7 + seed*1.1 + u_beat*1.8*u_safe;
        float pos = fract(t*sp + seed + float(k)*0.5);
        float pd  = length(uv - mix(e.xy, e.zw, pos));
        col += vec3(1.0,0.96,0.86) * smoothstep(0.013,0.0,pd) * (0.85 + u_beat);
      }
    }
    for (int i=0;i<MAXN;i++){
      vec3 n = u_nodes[i];
      if (n.x > 90.0) continue;
      float nd = length(uv - n.xy);
      float en = n.z;                                    // energy (incl. flicker spark)
      // core dot: pops bigger & brighter with energy + beat ("jump")
      float coreSz = 0.016 + en*0.03 + u_beat*0.012*u_safe;
      col += mix(u_c2, u_c1, en) * smoothstep(coreSz, 0.0, nd) * (0.5 + en*2.2);
      col += u_c1 * smoothstep(0.07, 0.0, nd) * en * 0.5;  // node halo
      // per-node "gas": a small cloud of drifting sparks + a soft nebula that
      // breathes with the node's energy. near-field gate keeps it cheap.
      if (nd < 0.16){
        float seed = fract(sin(float(i)*7.31)*43758.5453);
        float hz = 0.0;
        for (int k=0;k<4;k++){
          float fk = float(k);
          float a  = seed*6.2831 + fk*1.9 + t*(0.6 + seed*1.4) + sin(t*1.7 + fk)*0.6;
          float rad = (0.02 + en*0.06 + u_beat*0.02*u_safe) * (0.5 + fk*0.4);
          float pd = length(uv - (n.xy + vec2(cos(a), sin(a))*rad));
          hz += smoothstep(0.012, 0.0, pd);
        }
        vec3 gasCol = mix(u_c1, vec3(1.0,0.95,0.85), 0.4);
        col += gasCol * hz * (0.25 + en*1.5);
        float haze = smoothstep(0.14, 0.0, nd) - smoothstep(0.05, 0.0, nd);
        col += mix(u_c2, u_c1, en) * haze * en * 0.6;      // nebular puff
      }
    }
    return col;
  }

  // signed distance to the closed figure polygon (negative = inside). Winding
  // test (iq) gives a solid fillable silhouette regardless of node count.
  float figSDF(vec2 p){
    float d = 1e9, s = 1.0;
    int n = u_figN;
    for (int i=0;i<MAXF;i++){
      if (i>=n) break;
      int j = i==0 ? n-1 : i-1;
      vec2 a = u_fig[i], b = u_fig[j];
      d = min(d, segDist(p,a,b));
      bvec3 c = bvec3(p.y>=a.y, p.y<b.y, (b.x-a.x)*(p.y-a.y) > (b.y-a.y)*(p.x-a.x));
      if (all(c) || all(not(c))) s = -s;
    }
    return d*s;
  }
  // A THIN, translucent wireframe ghost -- just a whisper of geometry behind the web.
  // The neural net is the hero; this is a faint hint, never a solid form.
  vec3 figure(vec2 uv, float t){
    if (u_coh < 0.01 || u_figN < 3) return vec3(0.0);
    float sdf  = figSDF(uv);
    float line = smoothstep(0.0035, 0.0, abs(sdf));        // hairline outline only
    float fill = smoothstep(0.0, -0.02, sdf);              // interior mask (soft edge)
    vec3 col  = u_figB * line * (0.30 + u_beat*0.25);      // faint thin wire
    col += u_figA * fill * 0.03 * (0.5 + u_bass*0.5);      // barely-there interior tint
    return col * u_coh * 0.5;
  }

  vec3 scene(vec2 uv, float t){
    vec3 col = vec3(0.0);
    float d = length(uv);

    // --- AT-field hex grid ---
    float scale = 6.5 + u_bass*2.5;
    float ang = t*0.07 + u_bass*0.5 + u_coil*0.6 + 0.25*sin(t*0.13);   // spins up as tension builds
    mat2 rot = mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
    vec2 huv = rot * uv * scale;
    vec4 hc = hexCoords(huv);
    // thin, crisp cell edge (hc.y is ~0 at edges, ~0.5 at centers)
    float edge = smoothstep(0.035, 0.0, hc.y);
    float cellR = length(hc.zw);                       // ring index from center
    float f = fftAt(cellR*0.045);                      // audio energy for this ring
    float ripple = 0.5 + 0.5*sin(cellR*0.9 - t*3.2);   // expanding pulse
    // low ambient so idle stays dark/clean; edges light up with audio + beats
    float glow = edge * (0.05 + f*2.0 + u_beat*ripple*1.8*u_safe + u_burst*0.7);   // release flashes the field (restrained)
    vec3 hexCol = mix(u_c2, u_c1, clamp(f*1.6 + u_beat*0.5, 0.0, 1.0));
    hexCol = hueShift(hexCol, sin(cellR*0.30 + t*0.20)*0.16 + f*0.25); // subtle shimmer
    // AT-field recedes as the web coalesces into a silhouette, so the figure reads
    float hexDim = 1.0 - u_coh*0.4;
    col += hexCol * glow * hexDim;
    // fill a cell only when its band is strong (f squared -> nothing at idle)
    col += hexCol * smoothstep(0.30, 0.46, hc.y) * f*f * 0.5 * hexDim;
    // each cell carries its own triangle that spins at its OWN rate (per-cell hash)
    // -> the field rotates individually, not in unison. Rate rises with the music.
    vec2 gv = huv - hc.zw;                              // local coord within this cell
    float cid = fract(sin(dot(hc.zw, vec2(12.9898,78.233)))*43758.5453);
    float cang = t*(0.5 + cid*2.2)*(0.5 + u_bass*1.6 + u_coil*1.8) + cid*6.2831;  // spins up with tension
    float pa = atan(gv.x, gv.y) + cang;                // rotate the glyph
    float pr = length(gv);
    float k = 6.2831/3.0;                              // 3 sides -> triangle
    float poly = cos(floor(0.5 + pa/k)*k - pa) * pr;   // regular-polygon distance (iq)
    float triSz = 0.14 + f*0.05;
    float tri = smoothstep(0.018, 0.0, abs(poly - triSz));
    col += hexCol * tri * (0.12 + f*1.8 + u_beat*0.4*u_safe + u_burst*0.7) * hexDim;

    // --- central eye / S2 core ---
    float coreR = 0.10 + u_bass*0.14 + u_beat*0.05 + u_burst*0.06;   // core swells on the release
    float core  = smoothstep(coreR, 0.0, d);
    float iris  = 0.5 + 0.5*sin(d*46.0 - t*2.2);
    vec3 coreCol = mix(u_c1, vec3(1.0,0.92,0.72), core);
    col += coreCol * (core * (0.85 + iris*0.35));
    // Halo radius is CAPPED. It used to be coreR*4.5, and coreR grows with bass -- at a
    // loud passage that reached ~1.1uv, i.e. the whole frame, and washed everything out.
    // Real bloom in the post chain gives the glow now; this is just the core's own falloff.
    col += u_c1 * smoothstep(0.16 + u_bass*0.10, 0.0, d) * (0.24 + u_bass*0.22);
    // rotating targeting ring
    float ring = smoothstep(0.006, 0.0, abs(d - (coreR*2.2)));
    col += u_c1 * ring * (0.4 + u_treble);

    // --- cruciform light burst on beat ---
    // The wide arms used to decay as exp(-|x|*5), which is still ~0.2 at the frame edge,
    // so on every beat the whole frame lifted and the cross read as a white blob instead
    // of a cross. Faster falloff + a radial gate keeps it a SHAPE; post bloom does the glow.
    float cross = exp(-abs(uv.x)*22.0) + exp(-abs(uv.y)*22.0);
    cross += 0.35*(exp(-abs(uv.x)*9.0) + exp(-abs(uv.y)*9.0));
    cross *= smoothstep(0.95, 0.08, length(uv));
    col += mix(u_c1, vec3(1.0,0.95,0.85), 0.6) * cross * u_beat * (0.25 + 0.5*u_safe);

    return col;
  }

  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
    float t = u_time;
    // beat "punch": zoom + rotation kick on every hit for kinetic impact; the
    // release adds a brief outward pop so the drop lands physically.
    uv /= (1.0 + (u_beat*0.15 + u_burst*0.06 + u_coil*0.04)*u_safe);   // profound beats punch harder
    float rk = u_beat*0.055*u_safe;                                    // rotation snap on the hit
    uv = mat2(cos(rk),-sin(rk),sin(rk),cos(rk)) * uv;
    // brief shake -- beat*beat so only the heavy hits shake, soft ticks barely move
    uv += vec2(sin(t*133.0), cos(t*149.0)) * (u_beat*u_beat*0.012) * u_safe;

    // busy background scene -> compensated by auto-exposure so loud passages settle
    // slow continuous drift so the background is always gently rotating; the
    // neural web stays in screen space (its figures spin under their own control).
    // (chromatic aberration used to evaluate scene() three times here; it now runs
    //  once in the composite pass -- same look, a third of the background cost.)
    float gr = t*0.035 + u_bass*0.15;
    mat2 grot = mat2(cos(gr),-sin(gr),sin(gr),cos(gr));
    vec3 scn = scene(grot * uv, t);
    float sl = speedLines(uv, t) * (u_beat*1.4 + u_treble*0.4) * u_safe;
    scn += mix(u_c1, vec3(1.0), 0.6) * sl;
    scn *= u_exposure;
    // neural web stays readable: dims far less than the background (0.7 -> ~30% of the dimming)
    // ...but as the figure coalesces the web RECEDES so the solid silhouette dominates
    // (fixes the old "sync high = unreadable bright blob").
    vec3 net = neuralNet(uv, t) * u_net * mix(u_exposure, 1.0, 0.5) * (1.0 - u_coh*0.30);
    net *= (1.0 + u_coil*0.18 + u_burst*0.30);         // tension glows; release flashes (restrained)
    vec3 fig = figure(uv, t);
    // HDR out: the grade (bloom, tonemap, scanlines, vignette) lives in the post pass
    fragColor = vec4(scn + net + fig, 1.0);
  }`;

  // ---- nebula backdrop: dark drifting gas the particles hang inside ----
  // Deliberately DIM. Same lesson as the coalesced shapes: the hero (here, the
  // particles) has to dominate, so this is atmosphere and never a subject.
  const FRAG_GAS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2  u_res;
  uniform float u_time, u_bass, u_mid, u_treble, u_beat, u_coil, u_burst, u_safe, u_exposure;
  uniform vec3  u_c1, u_c2;
  ${COMMON}
  float vn(vec3 p){                       // cheap 3D value noise
    vec3 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    float n = i.x + i.y*57.0 + i.z*113.0;
    float a = mix(h11(n),      h11(n+1.0),   f.x);
    float b = mix(h11(n+57.0), h11(n+58.0),  f.x);
    float c = mix(h11(n+113.0),h11(n+114.0), f.x);
    float d = mix(h11(n+170.0),h11(n+171.0), f.x);
    return mix(mix(a,b,f.y), mix(c,d,f.y), f.z);
  }
  float fbm(vec3 p){
    float s = 0.0, a = 0.5;
    for (int i=0;i<4;i++){ s += a*vn(p); p *= 2.03; a *= 0.5; }
    return s;
  }
  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
    float t = u_time;
    float d = length(uv);
    // domain-warped clouds, slowly boiling; the churn speeds up with the mids.
    // (keep the frequency up -- at low frequency a 9:16 frame only sees one lobe of
    //  the noise and it reads as a smeared band rather than cloud texture.)
    vec3 q = vec3(uv*3.4, t*0.045);
    float w = fbm(q*0.8 + vec3(0.0,0.0,t*0.02));
    float cl = fbm(q + w*(0.7 + u_mid*0.8));
    cl = pow(max(cl-0.28, 0.0), 1.7);
    vec3 col = mix(u_c2, u_c1, cl*1.4) * cl * (0.30 + u_bass*0.55 + u_burst*0.5);
    col = hueShift(col, w*0.5 + t*0.05);
    // starfield: sparse, steady, gives the depth a reference frame
    vec2 sp = floor(uv*260.0);
    float st = step(0.9975, h21(sp));
    col += vec3(0.7,0.8,1.0) * st * (0.35 + 0.4*sin(t*2.0 + h21(sp)*40.0)) * 0.7;
    // the singularity the cloud orbits: swells on bass, flares on the release.
    // Restrained on purpose -- it sits dead centre, so any excess reads as a white blob.
    float coreR = 0.032 + u_bass*0.045 + u_burst*0.04;
    col += mix(u_c1, vec3(1.0,0.93,0.78), 0.5) * smoothstep(coreR, 0.0, d) * (0.55 + u_beat*0.35);
    col += u_c1 * smoothstep(coreR*8.0, 0.0, d) * (0.10 + u_bass*0.22 + u_coil*0.20);
    col *= smoothstep(1.45, 0.25, d);                 // hold the frame's edges dark
    fragColor = vec4(col * u_exposure, 1.0);
  }`;

  // ---- particle nebula: transform-feedback sim (runs with the rasterizer off) ----
  // Divergence-free curl flow from an ANALYTIC vector potential: six trig ops instead
  // of ~18 noise lookups per particle, which is what makes 100k+ particles affordable.
  const VERT_SIM = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 a_pos;
  layout(location=1) in vec3 a_vel;
  layout(location=2) in vec3 a_dat;      // x = life 1..0, y = seed, z = fft band
  out vec3 v_pos; out vec3 v_vel; out vec3 v_dat;
  uniform float u_dt, u_time, u_bass, u_mid, u_treble, u_beat, u_coil, u_burst, u_safe;
  uniform float u_shell, u_flow, u_swirl;
  uniform vec4  u_mouse;                 // xyz = cursor in WORLD space, w: 0 none/1 drag/2 hover
  uniform sampler2D u_fft;
  ${COMMON}
  vec3 hash33(vec3 p){
    p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
    return fract(sin(p)*43758.5453);
  }
  // curl of psi = (sin(a.y)+cos(b.z), sin(c.z)+cos(d.x), sin(e.x)+cos(f.y))
  vec3 curlField(vec3 p, float t){
    vec3 q = p + vec3(0.0, 0.0, t*0.25);
    vec3 c1 = vec3(-1.6*sin(1.6*q.y) - 1.5*cos(1.5*q.z),
                   -1.3*sin(1.3*q.z) - 1.4*cos(1.4*q.x),
                   -1.9*sin(1.9*q.x) - 1.7*cos(1.7*q.y));
    vec3 r = q*2.7 + 4.1;                                   // second octave = fine eddies
    vec3 c2 = vec3(-1.6*sin(1.6*r.y) - 1.5*cos(1.5*r.z),
                   -1.3*sin(1.3*r.z) - 1.4*cos(1.4*r.x),
                   -1.9*sin(1.9*r.x) - 1.7*cos(1.7*r.y));
    return c1 + c2*0.4;
  }
  void main(){
    vec3 pos = a_pos, vel = a_vel;
    float life = a_dat.x, seed = a_dat.y, band = a_dat.z;
    float dt = u_dt;
    float e = texture(u_fft, vec2(band, 0.5)).r;            // this particle's own frequency
    float r = length(pos);
    vec3 dir = pos / max(r, 1e-4);

    vec3 acc = curlField(pos*u_flow, u_time) * (0.9 + u_mid*2.6 + e*1.8);
    // galactic rotation: tangential push about a slightly tilted axis, stronger inside
    vec3 tang = normalize(cross(pos, vec3(0.0, 1.0, 0.18)) + vec3(1e-5));
    acc += tang * u_swirl / (0.35 + r);
    // the cloud breathes: each particle seeks its OWN radius (spread by its seed), so
    // the nebula fills a VOLUME. One shared radius makes every particle chase the same
    // sphere and the whole thing renders as a hollow rugby ball.
    // cube-root radius: a UNIFORM seed puts density ~1/r^2, piling particles into the
    // middle where they all overlap and saturate. seed^(1/3) is the distribution that
    // fills a sphere evenly, which is what makes the cloud read as volume, not a lamp.
    float rTarget = u_shell * (0.20 + 1.35*pow(seed, 0.34));
    acc -= dir * (r - rTarget) * 2.2;                        // soft spring: the flow still wins
    // beats punch it outward, the drop detonates it
    acc += dir * (u_beat*u_beat*7.0 + u_burst*15.0 + e*1.6) * u_safe;
    // cursor: drag hauls the cloud in, hover shoulders it aside (matches the web).
    // JS un-rotates the cursor by the camera yaw first, so this is a real world-space
    // point under the pointer -- comparing screen xy to world xy drifts as the camera turns.
    if (u_mouse.w > 0.5){
      bool drag = u_mouse.w < 1.5;
      vec3 dl = u_mouse.xyz - pos;
      float dd = length(dl) + 1e-4;
      float infl = smoothstep(0.9, 0.0, dd);
      acc += (drag ? dl/dd : -dl/dd) * infl * (drag ? 9.0 : 5.0);
    }
    vel += acc*dt;
    vel *= exp(-dt*1.7);                                    // drag, so it settles instead of exploding
    pos += vel*dt;

    life -= dt * (0.09 + seed*0.10);
    if (life <= 0.0 || r > 3.4){                            // recycle: reseed near the shell
      vec3 h = hash33(vec3(seed*97.3, u_time, float(gl_VertexID)*0.017));
      float th = h.x*6.2831853, ph = acos(2.0*h.y - 1.0);
      vec3 nd = vec3(sin(ph)*cos(th), cos(ph)*0.75, sin(ph)*sin(th));
      pos = nd * rTarget * (0.5 + h.z*0.8);
      vel = normalize(cross(pos, vec3(0.0,1.0,0.18)) + vec3(1e-5)) * (0.25 + h.z*0.4);
      life = 1.0;
    }
    v_pos = pos; v_vel = vel; v_dat = vec3(life, seed, band);
  }`;
  const FRAG_SIM = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  void main(){ fragColor = vec4(0.0); }`;

  // ---- particle nebula: additive point-sprite render, real perspective ----
  const VERT_PTS = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 a_pos;
  layout(location=1) in vec3 a_vel;
  layout(location=2) in vec3 a_dat;
  out vec4 v_col;
  uniform vec2  u_res;
  uniform float u_time, u_bass, u_beat, u_burst, u_coil, u_safe, u_hue;
  uniform float u_cam, u_focal, u_psize, u_exposure;
  uniform vec3  u_c1, u_c2;
  uniform sampler2D u_fft;
  ${COMMON}
  void main(){
    // camera: a slow drift around the cloud, tilted, pulled in by heavy beats
    float yaw = u_time*0.075 + u_bass*0.22;
    float cy = cos(yaw), sy = sin(yaw);
    vec3 p = vec3(a_pos.x*cy + a_pos.z*sy, a_pos.y, -a_pos.x*sy + a_pos.z*cy);
    // pitch matters more than it looks: near edge-on the disc projects to a thin ellipse
    // and every particle overlaps every other one, which saturates to a white smear
    float pit = 0.50 + sin(u_time*0.11)*0.12;
    float cp = cos(pit), sp = sin(pit);
    p = vec3(p.x, p.y*cp - p.z*sp, p.y*sp + p.z*cp);
    float z = max(p.z + u_cam, 0.08);
    float f = u_focal / z;
    gl_Position = vec4(p.x*f*(u_res.y/u_res.x), p.y*f, 0.0, 1.0);

    float e = texture(u_fft, vec2(a_dat.z, 0.5)).r;
    float spd = length(a_vel);
    float life = a_dat.x;
    float fade = smoothstep(0.0, 0.14, life) * smoothstep(1.0, 0.86, life);
    // size and brightness both track energy, so they multiply -- keep each modest or a
    // loud passage saturates into one white ellipse
    gl_PointSize = clamp(u_psize * f * (0.45 + e*0.9 + u_beat*0.30*u_safe), 1.0, 42.0);

    vec3 col = mix(u_c2, u_c1, clamp(e*1.6 + spd*0.30, 0.0, 1.0));
    col = hueShift(col, u_hue + spd*0.22 + a_dat.y*0.25);
    col += vec3(1.0,0.94,0.82) * smoothstep(1.1, 2.8, spd) * 0.7;      // hot fast streaks
    float depth = smoothstep(7.0, 1.0, z);                             // far particles recede
    // per-particle brightness stays LOW: with 100k+ additive sprites the image is built
    // by accumulation, and anything per-sprite gets multiplied by the overlap count.
    v_col = vec4(col * (0.08 + e*0.38 + u_burst*0.25 + u_coil*0.10), fade*depth*u_exposure);
  }`;
  const FRAG_PTS = `#version 300 es
  precision highp float;
  in vec4 v_col;
  out vec4 fragColor;
  void main(){
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d,d)*4.0;
    if (r2 > 1.0) discard;
    fragColor = vec4(v_col.rgb * exp(-r2*3.0) * v_col.a, 1.0);   // premultiplied, blend = ONE/ONE
  }`;

  // ---- post chain ----
  const FRAG_BRIGHT = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_src;
  uniform vec2  u_dstTexel;   // 1/dest size: gl_FragCoord is in DEST space, and the
  uniform vec2  u_srcTexel;   // dest is half-res, so uv must not use the source texel
  uniform float u_thr, u_knee;
  void main(){
    vec2 uv = gl_FragCoord.xy * u_dstTexel;
    // 4-tap box downsample first -> a stable bright-pass instead of a sparkling one
    vec3 c = texture(u_src, uv + u_srcTexel*vec2( 0.5, 0.5)).rgb
           + texture(u_src, uv + u_srcTexel*vec2(-0.5, 0.5)).rgb
           + texture(u_src, uv + u_srcTexel*vec2( 0.5,-0.5)).rgb
           + texture(u_src, uv + u_srcTexel*vec2(-0.5,-0.5)).rgb;
    c *= 0.25;
    float l = max(c.r, max(c.g, c.b));
    fragColor = vec4(c * smoothstep(u_thr, u_thr + u_knee, l), 1.0);
  }`;
  const FRAG_BLUR = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_src;
  uniform vec2 u_texel;    // 1/size
  uniform vec2 u_dir;      // (1,0) or (0,1), scaled by radius
  void main(){
    vec2 uv = gl_FragCoord.xy * u_texel;
    vec2 o1 = u_dir * u_texel * 1.3846153846;   // linear-sampled 9-tap gaussian
    vec2 o2 = u_dir * u_texel * 3.2307692308;
    vec3 c = texture(u_src, uv).rgb * 0.2270270270;
    c += (texture(u_src, uv+o1).rgb + texture(u_src, uv-o1).rgb) * 0.3162162162;
    c += (texture(u_src, uv+o2).rgb + texture(u_src, uv-o2).rgb) * 0.0702702703;
    fragColor = vec4(c, 1.0);
  }`;
  const FRAG_POST = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_scene, u_bloom1, u_bloom2;
  uniform vec2  u_res;
  uniform float u_time, u_beat, u_safe, u_bloomAmt, u_ca, u_sat;
  ${COMMON}
  // ACES filmic curve: rolls highlights off instead of clipping them to white, which
  // is what finally lets the scene be bright WITHOUT blowing out.
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0);
  }
  void main(){
    vec2 uv = gl_FragCoord.xy / u_res;
    vec2 c  = uv - 0.5;
    vec2 dir = normalize(c + vec2(1e-5));
    // chromatic aberration, now one cheap texture fetch per channel (was 3x the scene)
    float ca = u_ca * (0.0018 + u_beat*0.010*u_safe) * (0.25 + length(c)*1.7);
    vec3 col = vec3(texture(u_scene, uv + dir*ca).r,
                    texture(u_scene, uv).g,
                    texture(u_scene, uv - dir*ca).b);
    col += (texture(u_bloom1, uv).rgb + texture(u_bloom2, uv).rgb*0.65) * u_bloomAmt;

    float l = dot(col, vec3(0.299,0.587,0.114));
    col = mix(vec3(l), col, u_sat);                         // saturation punch
    col = hueShift(col, sin(u_time*0.08)*0.10);             // slow spectral shimmer
    col = aces(col);
    col = pow(col, vec3(0.92));                             // small lift back into the mids

    col *= 0.86 + 0.14*sin(gl_FragCoord.y*2.2);             // CRT scanlines
    col *= 0.96 + 0.04*sin(u_time*48.0)*u_safe;             // flicker (off in calm mode)
    col *= smoothstep(1.35, 0.28, length(c)*2.0);           // vignette
    col += vec3(1.0) * u_beat * 0.06 * u_safe;              // transient beat pop (gated)
    col += (h21(uv*u_res + fract(u_time)*311.0) - 0.5) * 0.018;   // grain: hides 8-bit banding

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));

    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    if (tfVaryings) gl.transformFeedbackVaryings(p, tfVaryings, gl.SEPARATE_ATTRIBS);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  // ---- render targets ----
  let rtFmt = null, bloomThr = 1.0;       // {internal, type} chosen at init
  let sceneRT = null, bloom1 = [null,null], bloom2 = [null,null];
  let RW = 0, RH = 0;                     // current internal render size
  function makeRT(w, h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, rtFmt.internal, w, h, 0, gl.RGBA, rtFmt.type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return ok ? {tex, fb, w, h} : null;
  }
  function freeRT(rt){ if (rt){ gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fb); } }
  function allocRTs(w, h){
    if (RW === w && RH === h && sceneRT) return;
    RW = w; RH = h;
    freeRT(sceneRT); for (const b of bloom1) freeRT(b); for (const b of bloom2) freeRT(b);
    const hw = Math.max(2, w>>1), hh = Math.max(2, h>>1);
    const qw = Math.max(2, w>>2), qh = Math.max(2, h>>2);
    sceneRT  = makeRT(w, h);
    bloom1[0] = makeRT(hw, hh); bloom1[1] = makeRT(hw, hh);
    bloom2[0] = makeRT(qw, qh); bloom2[1] = makeRT(qw, qh);
  }
  // adaptive resolution: the internal render size tracks the measured frame time so a
  // phone degrades gracefully instead of dropping to a slideshow. The HUD and the
  // recorded canvas stay at full size -- only the shaded pixels shrink.
  let renderScale = 1, frameMs = 16.7, scaleFrames = 0;
  function adaptResolution(dt){
    frameMs = frameMs*0.9 + Math.min(dt, 100)*0.1;
    if (++scaleFrames < 45) return;
    scaleFrames = 0;
    const before = renderScale;
    if (frameMs > 21.5)      renderScale = Math.max(0.50, renderScale - 0.10);
    else if (frameMs < 17.0) renderScale = Math.min(1.00, renderScale + 0.05);
    if (Math.abs(renderScale - before) > 1e-3) allocRTs(Math.round(W*renderScale), Math.round(H*renderScale));
  }

  function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  function bindRT(rt){
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.fb : null);
    gl.viewport(0, 0, rt ? rt.w : W, rt ? rt.h : H);
  }

  let progWeb=null, progGas=null, progSim=null, progPts=null, progBright=null, progBlur=null, progPost=null;
  let nebulaOK = true;
  function createRenderer(){
    gl = glCanvas.getContext('webgl2', { preserveDrawingBuffer:true, antialias:false, alpha:false });
    if (!gl) throw new Error('WebGL2 not supported in this browser.');
    // float render targets keep the scene HDR so the bright-pass has real highlights
    // to work with; without them everything clamps at 1.0 and bloom gets thin.
    const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
    rtFmt = hasFloat ? {internal: gl.RGBA16F, type: gl.HALF_FLOAT} : {internal: gl.RGBA8, type: gl.UNSIGNED_BYTE};
    allocRTs(W, H);
    if (!sceneRT){                                   // float RTs advertised but unusable
      rtFmt = {internal: gl.RGBA8, type: gl.UNSIGNED_BYTE};
      RW = RH = 0; allocRTs(W, H);
      if (!sceneRT) throw new Error('Could not create a render target.');
    }
    // with HDR targets real highlights live above 1.0, so the bright-pass can sit there;
    // on the LDR fallback everything clamps at 1.0 and the threshold has to drop below it.
    bloomThr = (rtFmt.type === gl.HALF_FLOAT) ? 1.0 : 0.72;

    progWeb    = makeProg(VERT, FRAG_WEB);
    progBright = makeProg(VERT, FRAG_BRIGHT);
    progBlur   = makeProg(VERT, FRAG_BLUR);
    progPost   = makeProg(VERT, FRAG_POST);

    // fullscreen triangle (its own VAO, so particle attribute state never leaks in)
    quadVAO = gl.createVertexArray();
    gl.bindVertexArray(quadVAO);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    // fft texture (unit 0 everywhere)
    const bins = analyser ? analyser.frequencyBinCount : 1024;
    fftTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fftTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, bins, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array(bins));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    // The nebula is built separately and allowed to FAIL: if a device chokes on the
    // particle programs, the web mode still has to come up rather than taking the whole
    // visualizer down with it.
    try {
      progGas = makeProg(VERT, FRAG_GAS);
      progSim = makeProg(VERT_SIM, FRAG_SIM, ['v_pos','v_vel','v_dat']);
      progPts = makeProg(VERT_PTS, FRAG_PTS);
      initParticles(particleTarget());
      for (const p of [progGas, progSim, progPts]){ gl.useProgram(p); gl.uniform1i(U(p,'u_fft'), 0); }
    } catch(e) {
      nebulaOK = false;
      modeId = 'web';
      const opt = modeSel.querySelector('option[value="nebula"]');
      if (opt) opt.remove();
      modeSel.value = 'web';
    }
    gl.useProgram(progWeb); gl.uniform1i(U(progWeb,'u_fft'), 0);
  }

  // ---- post: bright-pass -> 2 blurred octaves -> composite to the canvas ----
  function blurInto(src, dst, dx, dy){
    bindRT(dst);
    gl.useProgram(progBlur);
    gl.uniform1i(U(progBlur,'u_src'), 1);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(U(progBlur,'u_texel'), 1/dst.w, 1/dst.h);
    gl.uniform2f(U(progBlur,'u_dir'), dx, dy);
    drawQuad();
  }
  function postProcess(S){
    gl.disable(gl.BLEND);
    // bright-pass into the half-res octave
    bindRT(bloom1[0]);
    gl.useProgram(progBright);
    gl.uniform1i(U(progBright,'u_src'), 1);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneRT.tex);
    gl.uniform2f(U(progBright,'u_dstTexel'), 1/bloom1[0].w, 1/bloom1[0].h);
    gl.uniform2f(U(progBright,'u_srcTexel'), 1/RW, 1/RH);
    // threshold above the diffuse range so only genuine HIGHLIGHTS bloom. Set it low
    // and the whole frame passes, gets smeared, and comes back as milk -- which is
    // exactly the white-out this pipeline exists to kill.
    gl.uniform1f(U(progBright,'u_thr'), bloomThr);
    gl.uniform1f(U(progBright,'u_knee'), 0.7);
    drawQuad();
    blurInto(bloom1[0], bloom1[1], 1, 0);
    blurInto(bloom1[1], bloom1[0], 0, 1);
    // one wider octave at quarter res -> a soft halo, not a fog bank
    blurInto(bloom1[0], bloom2[0], 1.5, 0);
    blurInto(bloom2[0], bloom2[1], 0, 1.5);

    bindRT(null);
    gl.useProgram(progPost);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneRT.tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bloom1[0].tex);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, bloom2[1].tex);
    gl.uniform1i(U(progPost,'u_scene'), 1);
    gl.uniform1i(U(progPost,'u_bloom1'), 2);
    gl.uniform1i(U(progPost,'u_bloom2'), 3);
    gl.uniform2f(U(progPost,'u_res'), W, H);
    gl.uniform1f(U(progPost,'u_time'), S.t);
    gl.uniform1f(U(progPost,'u_beat'), S.beat);
    gl.uniform1f(U(progPost,'u_safe'), S.safe);
    gl.uniform1f(U(progPost,'u_bloomAmt'), S.safe < 0.5 ? 0.26 : 0.42);
    gl.uniform1f(U(progPost,'u_ca'), 1.0);
    gl.uniform1f(U(progPost,'u_sat'), 1.45);
    drawQuad();
    gl.activeTexture(gl.TEXTURE0);
  }

  // ---------------- Analysis helpers ----------------
  function band(lo,hi){ let s=0,n=0; for(let i=lo;i<hi&&i<freqData.length;i++){s+=freqData[i];n++;} return n? (s/n)/255 : 0; }
  let bassSmooth=0, beat=0, lastBeat=0, syncSmooth=0;
  // living "sync ratio": tracks energy but breathes with a slow organic wander,
  // so it reads like a telemetry gauge instead of pinning at 0.999. It also gently
  // modulates the neural web's energy each frame (the automatic version of nudging
  // the Sync slider), so the whole scene surges & settles on its own.
  let syncRatio = 0.6, syncWander = 0;
  // breathing: the web reads the song's ARC, not just loudness. Tension INTEGRATES
  // while energy is rising (a build), relaxes on plateaus/quiet, and releases in an
  // outward burst on a drop (a sharp energy jump). Tuned via an offline envelope sim.
  let energyFast = 0, energyMed = 0, energyLag = 0, coil = 0, burst = 0, releaseLock = 0;
  // reactive gain (auto): keeps brightness consistent across tracks, no user knob
  let agcEnv = 0.2, inputGain = 1.0;
  // auto-exposure: a slow envelope of overall loudness. Transients spike bright
  // first (adapt hasn't caught up), then brightness settles as it rises.
  let expoAdapt=0;
  function exposure(energy){
    const rate = energy > expoAdapt ? 0.035 : 0.012;   // rise ~0.5s, fall slower
    expoAdapt += (energy - expoAdapt) * rate;
    return Math.max(0.42, 1.0 / (1.0 + expoAdapt*1.7)); // sustained-loud settles darker
  }
  // calm mode: dampens flashing/strobe/punch (feeds u_safe). Default honors the OS setting.
  let safe = false;
  function safeVal(){ return safe ? 0.2 : 1.0; }

  // ---- deeper listening: onsets, tempo, key ----------------------------------
  // The bass-only detector could REACT but never ANTICIPATE, and it went nearly deaf
  // on tracks without a kick. Spectral flux gives broadband onsets; autocorrelating
  // the onset envelope over ~6s gives a tempo and a phase, so the visuals can sit on
  // the grid instead of chasing it. Chroma gives the key, which drifts the palette.
  const FLUX_N = 384;                       // ~6.4s of onset envelope at 60Hz
  const fluxHist = new Float32Array(FLUX_N);
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  let prevSpec = null, fluxHead = 0, fluxPeak = 0, fluxT = 0;
  let fluxMean = 0, fluxVar = 0, onset = 0, lastOnsetT = 0;
  let bpm = 0, bpmConf = 0, beatPeriod = 0, beatPhase = 0, beatCount = 0, barPhase = 0, tempoT = 0;
  const chroma = new Float32Array(12), chromaAcc = new Float32Array(12);
  let chromaBins = null, keyIdx = -1, keyConf = 0, harmHue = 0, hueX = 1, hueY = 0;

  function buildChromaBins(){
    const sr = (audioCtx && audioCtx.sampleRate) || 44100;
    const n = analyser ? analyser.fftSize : 2048;
    chromaBins = new Int8Array(freqData.length).fill(-1);
    for (let i=1;i<freqData.length;i++){
      const f = i*sr/n;
      if (f < 65 || f > 2100) continue;          // fundamental range; above it is mostly noise
      const midi = 69 + 12*Math.log2(f/440);
      chromaBins[i] = ((Math.round(midi) % 12) + 12) % 12;
    }
  }
  // sum of positive bin-to-bin change = energy ARRIVING, which is what an onset is.
  function spectralFlux(){
    if (!prevSpec) prevSpec = new Float32Array(freqData.length);
    let f = 0;
    for (let i=2;i<400 && i<freqData.length;i++){
      const v = freqData[i]/255, d = v - prevSpec[i];
      if (d > 0) f += d;
      prevSpec[i] = v;
    }
    return Math.min(1.5, f/45);
  }
  // autocorrelate the onset envelope; the strongest lag in the 69-180 BPM band wins
  function estimateTempo(){
    let mean = 0;
    for (let i=0;i<FLUX_N;i++) mean += fluxHist[i];
    mean /= FLUX_N;
    let best = 0, bestLag = 0, sum = 0, cnt = 0;
    for (let lag=20; lag<=52; lag++){
      let s = 0;
      const n = FLUX_N - lag;
      for (let i=0;i<n;i++){
        s += (fluxHist[(fluxHead+i)%FLUX_N] - mean) * (fluxHist[(fluxHead+i+lag)%FLUX_N] - mean);
      }
      s /= n;
      sum += s; cnt++;
      if (s > best){ best = s; bestLag = lag; }
    }
    const avg = sum/Math.max(1,cnt);
    bpmConf = avg > 1e-9 ? Math.min(1, (best/avg - 1)/2.5) : 0;
    if (bestLag && bpmConf > 0.25){
      const nb = 3600/bestLag;                      // lag is in 60Hz frames
      // octave stability: don't let it flip between half- and double-time every pass
      const alt = bpm > 0 && (Math.abs(nb - bpm*2) < 6 || Math.abs(nb - bpm/2) < 6);
      const tgt = (alt && bpmConf < 0.6) ? bpm : nb;
      bpm = bpm > 0 ? bpm + (tgt - bpm)*0.35 : tgt;
      beatPeriod = 60/bpm;
    }
  }
  function listen(now, dt){
    if (!chromaBins) buildChromaBins();
    if (!fluxT) fluxT = now;              // anchor the 60Hz grid to the first frame, or
                                          // every frame would flush a backlog of samples
    const flux = spectralFlux();
    // adaptive threshold from the running mean/deviation of the flux itself
    fluxMean = fluxMean*0.98 + flux*0.02;
    fluxVar  = fluxVar*0.98 + Math.abs(flux-fluxMean)*0.02;
    onset = 0;
    if (flux > fluxMean + fluxVar*2.2 + 0.02 && now - lastOnsetT > 110){
      onset = Math.min(1, (flux - fluxMean) / (fluxVar*3 + 0.05));
      lastOnsetT = now;
    }
    // resample the envelope onto a fixed 60Hz grid so tempo math is frame-rate independent
    fluxPeak = Math.max(fluxPeak, flux);
    if (now - fluxT >= 16.667){
      const steps = Math.min(6, Math.floor((now - fluxT)/16.667));
      for (let s=0;s<steps;s++){ fluxHist[fluxHead] = fluxPeak; fluxHead = (fluxHead+1)%FLUX_N; fluxPeak *= 0.4; }
      fluxT += steps*16.667;
      fluxPeak = 0;
    }
    if (now - tempoT > 700){ tempoT = now; estimateTempo(); }
    // run the beat grid forward, phase-locking to onsets that land near it
    if (beatPeriod > 0){
      beatPhase += dt/beatPeriod;
      while (beatPhase >= 1){ beatPhase -= 1; beatCount = (beatCount+1) % 4; }
      if (onset > 0.3){
        const err = beatPhase > 0.5 ? beatPhase - 1 : beatPhase;   // signed, ±0.5
        beatPhase -= err * 0.18 * bpmConf;
        if (beatPhase < 0){ beatPhase += 1; beatCount = (beatCount+3) % 4; }
      }
      barPhase = (beatCount + beatPhase)/4;
    }
    // chroma -> key -> a bounded hue drift, so the palette follows the harmony
    chromaAcc.fill(0);
    for (let i=1;i<freqData.length;i++){
      const pc = chromaBins[i];
      if (pc >= 0) chromaAcc[pc] += freqData[i]/255;
    }
    let cmax = 0, cidx = -1, csum = 0;
    for (let p=0;p<12;p++){
      chroma[p] = chroma[p]*0.94 + chromaAcc[p]*0.06;
      csum += chroma[p];
      if (chroma[p] > cmax){ cmax = chroma[p]; cidx = p; }
    }
    keyConf = csum > 1e-4 ? Math.min(1, (cmax/(csum/12) - 1)/1.6) : 0;
    if (cidx >= 0 && keyConf > 0.15){
      keyIdx = cidx;
      const a = cidx*Math.PI/6;                      // circular EMA: no wrap-around jumps
      hueX = hueX*0.985 + Math.cos(a)*0.015;
      hueY = hueY*0.985 + Math.sin(a)*0.015;
    }
    harmHue = Math.atan2(hueY, hueX) * 0.28 * Math.min(1, keyConf*1.5);
    return onset;
  }

  function analyze(now, dt){
    // reactive gain (AGC): normalize the input so quiet & loud tracks read the same,
    // with no user control. Replaces the old manual "Sync" slider (which over-drove
    // the scene into an unreadable white-out).
    const rawB = band(1,18), rawM = band(40,180), rawT = band(300,700);
    const rawE = rawB*0.6 + rawM*0.3 + rawT*0.1;
    agcEnv = agcEnv*0.985 + rawE*0.015;                 // slow loudness estimate (~1.5s)
    inputGain = Math.max(0.7, Math.min(1.8, 0.33/(agcEnv+0.06)));
    const g = inputGain;
    const bass = Math.min(rawB*g, 1.4);
    const mid  = Math.min(rawM*g, 1.4);
    const treb = Math.min(rawT*g, 1.4);
    const on = listen(now, dt);
    bassSmooth = bassSmooth*0.92 + bass*0.08;
    if (bass > bassSmooth*1.28 && bass > 0.30 && now-lastBeat>150) {
      // the beat carries its STRENGTH: a profound kick punches far above the running
      // baseline -> a big beat -> dramatic movement; a soft tick stays small.
      const strength = Math.min(1.0, (bass - bassSmooth) / (bassSmooth*0.9 + 0.12));
      beat = Math.max(beat, 0.4 + strength*0.85);   // ~0.4 (soft) .. ~1.25 (profound)
      lastBeat = now;
    }
    // broadband onsets (snares, claps, stabs) count as hits too -- a track with no
    // kick drum used to leave the whole scene nearly still.
    if (on > 0.35 && now-lastBeat > 110){ beat = Math.max(beat, 0.35 + on*0.55); lastBeat = now; }
    beat *= 0.88;
    const energy = (bass*0.6+mid*0.3+treb*0.1);
    // ---- breathing (in / out) ----
    energyFast = energyFast*0.80 + energy*0.20;      // the moment
    energyMed  = energyMed *0.90 + energy*0.10;      // slope reference
    energyLag  = energyLag *0.92 + energy*0.08;      // jump reference
    const slope = energyFast - energyMed;            // > 0 while the track is building
    coil = Math.min(1, coil*0.985 + Math.max(0, slope)*2.0);   // tension accumulates on the rise
    const jump = energyFast - energyLag;             // spikes at a drop
    if (releaseLock > 0) releaseLock--;
    if (coil > 0.30 && jump > 0.08 && releaseLock <= 0){        // the release
      burst = Math.min(1.5, burst + coil*1.3); coil *= 0.25; releaseLock = 24;
    }
    burst *= 0.90;                                    // the exhale decays (~0.4s)
    syncSmooth = syncSmooth*0.90 + energy*0.10;
    // brownian wander (bounded) gives the gauge a live, drifting feel
    syncWander = Math.max(-1, Math.min(1, syncWander*0.97 + (Math.random()-0.5)*0.06));
    const target = 0.55 + 0.42*Math.min(1, Math.pow(syncSmooth*1.5, 0.8)) + syncWander*0.04;
    syncRatio += (target - syncRatio) * 0.07;
    syncRatio = Math.max(0.35, Math.min(0.999, syncRatio));
    return { bass, mid, treb, energy };
  }

  // ---------------- Neural web (geometry fed to the GPU each frame) ----------------
  const MAXN = 48, MAXE = 96, MAXF = 24;
  const nodeBuf = new Float32Array(MAXN*3);   // x, y, energy
  const edgeBuf = new Float32Array(MAXE*4);   // x1,y1,x2,y2
  const figBuf  = new Float32Array(MAXF*2);   // silhouette outline points (uv space)
  let figN = 0;                               // active outline points this frame
  const figA = new Float32Array(3), figB = new Float32Array(3);  // body / rim color
  let currentN = 0;                            // active node count (scalable)
  let netNodes = [], netEdges = [], netOn = true;
  // pointer/drag influence on the neural web (uv-space cursor position)
  const mouse = { x: 0, y: 0, down: false, over: false };
  function initNet(N){
    N = Math.max(3, Math.min(MAXN, N|0));
    currentN = N;
    netNodes = [];
    const ringN = Math.max(3, Math.floor(N*0.55));      // how many sit on the outer ring
    for (let i=0;i<N;i++){
      const ring = i < ringN;
      const ang  = ring ? (i/ringN)*Math.PI*2 : Math.random()*Math.PI*2;
      const rad  = ring ? 0.9 : Math.random()*0.82;     // logical [-1,1] space (fuller spread)
      netNodes.push({
        hx: Math.cos(ang)*rad, hy: Math.sin(ang)*rad,
        x:0, y:0, phase: Math.random()*Math.PI*2,
        spd: 0.4 + Math.random()*1.5,                   // rapid drift
        r:   0.02 + Math.random()*0.07,                  // drift radius (uv units)
        band: 2 + Math.floor(Math.pow(i/N,1.6)*200),
        e: 0, ring,                                      // ring nodes are the stable skeleton
        ox:0, oy:0, ovx:0, ovy:0,                        // drag offset + velocity (springy)
        vis:1, vtar:1, flash:0,                          // quantum-vacuum life (inner nodes)
        tflip: 0.5 + Math.random()*3                     // countdown to next pop
      });
    }
    // wire each node to its 2 nearest neighbors (by home position), de-duplicated
    const seen = new Set(); netEdges = [];
    for (let i=0;i<netNodes.length;i++){
      const dl = [];
      for (let j=0;j<netNodes.length;j++) if (j!==i){
        const dx=netNodes[i].hx-netNodes[j].hx, dy=netNodes[i].hy-netNodes[j].hy;
        dl.push([dx*dx+dy*dy, j]);
      }
      dl.sort((a,b)=>a[0]-b[0]);
      for (let k=0;k<2;k++){
        const j = dl[k][1], key = i<j ? i+'-'+j : j+'-'+i;
        if (!seen.has(key) && netEdges.length<MAXE){ seen.add(key); netEdges.push([i,j]); }
      }
    }
  }
  initNet(32);
  // Slider 0..1 -> node count with a gentle ("tepid") logarithmic curve:
  // fine control over small counts, quicker growth toward the top.
  function sliderToNodes(s){
    const minN = 5, maxN = 46, k = 5;   // k = curvature (1 = linear, higher = more log)
    return Math.round(minN + (maxN-minN) * (Math.pow(k, s)-1) / (k-1));
  }
  function setNodeCount(N){ if (N !== currentN) initNet(N); }

  // ---- Evangelion coalescence ----------------------------------------------
  // Each shape is a CLOSED, non-self-intersecting outline in logical [-1,1] space,
  // rendered as a glowing energy construct by the shader's polygon SDF (see figure()).
  // Pure abstract geometry -- each with its own color and audio-scaled spin.
  const SHAPES = [
    { name:'OCTA', spin:0.9, a:[0.12,0.30,0.98], b:[0.55,0.92,1.0], pts:[     // octahedron / diamond
      [0,1],[0.5,0.5],[0.92,0.08],[0.92,-0.08],[0.5,-0.5],
      [0,-1],[-0.5,-0.5],[-0.92,-0.08],[-0.92,0.08],[-0.5,0.5] ] },
    { name:'HEX', spin:1.1, a:[1.0,0.5,0.08], b:[1.0,0.82,0.35], pts:[        // hexagon
      [0,1],[0.87,0.5],[0.87,-0.5],[0,-1],[-0.87,-0.5],[-0.87,0.5] ] },
    { name:'CROSS', spin:0.5, a:[1.0,0.82,0.45], b:[1.0,1.0,0.92], pts:[      // cruciform
      [-0.16,1],[0.16,1],[0.16,0.16],[0.9,0.16],[0.9,-0.16],[0.16,-0.16],
      [0.16,-1],[-0.16,-1],[-0.16,-0.16],[-0.9,-0.16],[-0.9,0.16],[-0.16,0.16] ] },
    { name:'STAR', spin:0.7, a:[0.70,0.15,0.90], b:[1.0,0.5,0.95], pts:[      // 6-point star burst
      [0,1],[0.21,0.364],[0.866,0.5],[0.42,0],[0.866,-0.5],[0.21,-0.364],
      [0,-1],[-0.21,-0.364],[-0.866,-0.5],[-0.42,0],[-0.866,0.5],[-0.21,0.364] ] },
    { name:'TRI', spin:0.8, a:[0.10,0.85,0.55], b:[0.6,1.0,0.85], pts:[       // triangle
      [0,1],[0.87,-0.5],[-0.87,-0.5] ] },
  ];
  let coh = 0, shapeIdx = 0, shapeDwell = 0;
  let shapeSpin = 0, netTime = 0;   // accumulating figure rotation + local clock
  let testCoh = null;   // harness override so silhouettes can be screenshotted

  function updateNet(dt, gain){
    const hw = 0.5*W/H*1.1, hh = 0.5*1.1;   // uv half-extents (web spreads across the frame)
    // syncRatio gently swells/settles the whole web's energy on its own -- the
    // automatic version of nudging the "Sync" slider. Manual gain still stacks on top.
    const syncGain = 0.65 + syncRatio*0.7;
    const cf = safe ? 0.4 : 1.0;               // calm mode dampens the vacuum flicker
    // coalescence: emerges only when the track drives (sync high); beats snap it
    // tighter and, past a dwell, morph to the next character.
    const shp = SHAPES[shapeIdx];
    const cohTar = Math.max(0, Math.min(1, (syncRatio - 0.72) / 0.2));
    coh += (cohTar - coh) * (cohTar > coh ? 0.06 : 0.03);    // ease in faster than out
    if (beat > 0.6) coh = Math.min(1, coh + 0.12);
    shapeDwell += dt;
    // evolve the form: morph on a strong beat after a short dwell, AND force-advance on
    // a timer so it never sits on one shape for a whole song (the old rule needed a rare
    // high-coalescence beat, so quiet samples stayed frozen).
    if ((beat > 0.55 && shapeDwell > 1.6) || shapeDwell > 5.0){
      shapeIdx = (shapeIdx + 1) % SHAPES.length; shapeDwell = 0;
    }
    if (testCoh != null) coh = testCoh;
    const forming = coh > 0.04;
    // figure rotation: geometric Angels tumble (rate rises with bass + beat);
    // humanoid forms (spin 0) rock gently so they never flip upside-down.
    netTime += dt;
    shapeSpin += dt * (shp.spin||0) * (0.35 + bassSmooth*1.4 + beat*0.8);
    const figAng = (shp.spin||0) ? shapeSpin : Math.sin(netTime*1.2)*0.16*coh;
    const fcs = Math.cos(figAng), fsn = Math.sin(figAng);
    for (let i=0;i<netNodes.length;i++){
      const n = netNodes[i];
      n.e = freqData ? Math.min((freqData[n.band]/255)*gain*syncGain, 1.3) : 0;
      n.phase += dt * n.spd * (1 + n.e*1.5 + beat*4.0);   // profound beats agitate the web harder
      // web stays free (no stick-figure snapping); as the figure forms it gently
      // converges inward and the shader fades the web out, leaving the solid figure.
      // breathing acts on each node's LOCAL drift around its own home -- NOT a global
      // pull to center -- so the web stays spread across the frame and shows behavior
      // throughout. coil tightens the drift into a taut, trembling lattice; burst jolts
      // each node outward from its home (dispersal), then it settles.
      const rr = (n.r*(1 + n.e*0.9) + beat*beat*0.10) * (1 - coil*0.6) * (1 + burst*2.2);
      const gather = 1 - coh*0.30;                     // mild inward pull only while a figure forms
      let bx = n.hx*hw*gather + Math.cos(n.phase)*rr;
      let by = n.hy*hh*gather + Math.sin(n.phase*1.3)*rr;
      if (coil > 0.05){                                // wound-up tension trembles in place
        const tr = coil*0.02;
        bx += Math.sin(netTime*40 + n.phase*7)*tr;
        by += Math.cos(netTime*37 + n.phase*5)*tr;
      }
      // cursor influence: DRAG pulls nodes toward the cursor; a bare HOVER pushes
      // them away (repulsion). Both use a spring + damping so they settle naturally.
      let tx = 0, ty = 0;
      if (mouse.down){
        const dx = mouse.x - bx, dy = mouse.y - by, d = Math.hypot(dx,dy), R = 0.55;
        if (d < R){ const w = 1 - d/R; tx = dx*w*0.9; ty = dy*w*0.9; n.e = Math.min(1.3, n.e + w*0.6); }
      } else if (mouse.over){
        const dx = bx - mouse.x, dy = by - mouse.y, d = Math.hypot(dx,dy) || 1e-4, R = 0.4;
        if (d < R){ const w = 1 - d/R; tx = (dx/d)*w*0.32; ty = (dy/d)*w*0.32; n.e = Math.min(1.3, n.e + w*0.25); }
      }
      n.ovx = (n.ovx + (tx - n.ox)*0.18) * 0.86;
      n.ovy = (n.ovy + (ty - n.oy)*0.18) * 0.86;
      n.ox += n.ovx; n.oy += n.ovy;
      n.x = bx + n.ox;
      n.y = by + n.oy;
      // life: inner nodes keep the quantum-vacuum flicker (a spark on each wink),
      // popping faster on their band; ring nodes stay lit.
      if (!n.ring){
        n.tflip -= dt * (0.5 + n.e*2.2 + beat*2.5) * cf;
        if (n.tflip <= 0){
          n.vtar = n.vtar > 0.5 ? 0 : 1;                // toggle presence
          n.flash = 1;                                  // spark on transition
          n.tflip = 0.4 + Math.random()*2.6;
        }
        n.vis += (n.vtar - n.vis) * Math.min(1, dt*16);  // fast fade in/out
        n.flash *= 0.85;
      }
    }
    for (let i=0;i<MAXN;i++){
      if (i<netNodes.length){ const n = netNodes[i];
        // rendered energy folds in visibility + the transition spark
        const z = n.e*n.vis + n.flash*0.9*cf;
        nodeBuf[i*3]=n.x; nodeBuf[i*3+1]=n.y; nodeBuf[i*3+2]=z;
      } else { nodeBuf[i*3]=99; nodeBuf[i*3+1]=99; nodeBuf[i*3+2]=0; }
    }
    // web edges (the figure is drawn by the shader's filled SDF, not by these)
    for (let i=0;i<MAXE;i++){
      if (i<netEdges.length){ const [a,b]=netEdges[i];
        // an edge vanishes with its node so vacuum pops read cleanly (ring nodes stay lit)
        if (netNodes[a].vis < 0.3 || netNodes[b].vis < 0.3){
          edgeBuf[i*4]=edgeBuf[i*4+1]=edgeBuf[i*4+2]=edgeBuf[i*4+3]=99;
        } else {
          edgeBuf[i*4]=netNodes[a].x; edgeBuf[i*4+1]=netNodes[a].y;
          edgeBuf[i*4+2]=netNodes[b].x; edgeBuf[i*4+3]=netNodes[b].y;
        }
      } else { edgeBuf[i*4]=edgeBuf[i*4+1]=edgeBuf[i*4+2]=edgeBuf[i*4+3]=99; }
    }
    // build the figure outline: spin each point, scale to uv, upload as u_fig.
    // 0.62 keeps the construct floating in frame instead of filling it.
    const pts = shp.pts, fn = Math.min(pts.length, MAXF);
    const fhw = hw*0.62, fhh = hh*0.62;
    for (let i=0;i<fn;i++){
      const px = pts[i][0]*fhw, py = pts[i][1]*fhh;
      figBuf[i*2]   = px*fcs - py*fsn;
      figBuf[i*2+1] = px*fsn + py*fcs;
    }
    figN = (netOn && coh > 0.01) ? fn : 0;
    figA[0]=shp.a[0]; figA[1]=shp.a[1]; figA[2]=shp.a[2];
    figB[0]=shp.b[0]; figB[1]=shp.b[1]; figB[2]=shp.b[2];
  }
  // ---------------- GPU particle nebula ----------------
  // Positions/velocities live entirely on the GPU and are advanced by transform
  // feedback: the sim vertex shader reads buffer set A and writes buffer set B, then
  // the sets swap. Nothing about the particles ever crosses back to JS.
  const PMAX = 240000;
  let pbuf = [null,null], pVAO = [null,null], tfo = null, pcur = 0;
  let PCOUNT = 0, pActive = 0, pDensity = 0.8;
  function particleTarget(){
    let coarse = false;
    try { coarse = matchMedia('(pointer:coarse)').matches; } catch(e){}
    const cores = navigator.hardwareConcurrency || 4;
    return Math.min(PMAX, coarse ? 45000 : (cores >= 8 ? 160000 : 90000));
  }
  function makeAttrBuf(data){
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_COPY);
    return b;
  }
  function initParticles(n){
    PCOUNT = Math.max(1000, Math.min(PMAX, n|0));
    pActive = Math.round(PCOUNT * (0.25 + pDensity*0.75));
    const pos = new Float32Array(PCOUNT*3), vel = new Float32Array(PCOUNT*3), dat = new Float32Array(PCOUNT*3);
    for (let i=0;i<PCOUNT;i++){
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      const rad = 0.20 + Math.pow(Math.random(), 0.34)*0.95;   // even fill, see rTarget
      pos[i*3]   = Math.sin(ph)*Math.cos(th)*rad;
      pos[i*3+1] = Math.cos(ph)*rad*0.75;          // slightly squashed -> a thick disc
      pos[i*3+2] = Math.sin(ph)*Math.sin(th)*rad;
      vel[i*3]   = (Math.random()-0.5)*0.2;
      vel[i*3+1] = (Math.random()-0.5)*0.1;
      vel[i*3+2] = (Math.random()-0.5)*0.2;
      dat[i*3]   = Math.random();                  // life, staggered so respawns spread out
      dat[i*3+1] = Math.random();                  // seed
      // fft coordinate, bass-weighted: most of the cloud rides the low end, a thin
      // upper population sparkles on hats/air (matches how the web picks its bands)
      dat[i*3+2] = 0.002 + Math.pow(Math.random(), 1.8)*0.22;
    }
    for (let s=0;s<2;s++){
      if (pbuf[s]) for (const b of Object.values(pbuf[s])) gl.deleteBuffer(b);
      if (pVAO[s]) gl.deleteVertexArray(pVAO[s]);
      pbuf[s] = { pos: makeAttrBuf(pos), vel: makeAttrBuf(vel), dat: makeAttrBuf(dat) };
      pVAO[s] = gl.createVertexArray();
      gl.bindVertexArray(pVAO[s]);
      const attrs = [pbuf[s].pos, pbuf[s].vel, pbuf[s].dat];
      for (let a=0;a<3;a++){
        gl.bindBuffer(gl.ARRAY_BUFFER, attrs[a]);
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, 3, gl.FLOAT, false, 0, 0);
      }
      gl.bindVertexArray(null);
    }
    if (!tfo) tfo = gl.createTransformFeedback();
    pcur = 0;
  }
  function setDensity(d){
    pDensity = Math.max(0, Math.min(1, d));
    pActive = Math.round(PCOUNT * (0.25 + pDensity*0.75));
  }
  function simParticles(S, dt){
    const src = pcur, dst = 1-pcur;
    gl.useProgram(progSim);
    gl.uniform1f(U(progSim,'u_dt'), dt);
    gl.uniform1f(U(progSim,'u_time'), S.t);
    gl.uniform1f(U(progSim,'u_bass'), S.bass);
    gl.uniform1f(U(progSim,'u_mid'), S.mid);
    gl.uniform1f(U(progSim,'u_treble'), S.treb);
    gl.uniform1f(U(progSim,'u_beat'), S.beat);
    gl.uniform1f(U(progSim,'u_coil'), S.coil);
    gl.uniform1f(U(progSim,'u_burst'), S.burst);
    gl.uniform1f(U(progSim,'u_safe'), S.safe);
    // the cloud's target radius: swells with bass, is reeled IN as tension winds up,
    // and is thrown wide open by the release -- the breathing the web already does.
    gl.uniform1f(U(progSim,'u_shell'), 0.78 + S.bass*0.50 + S.burst*0.40 - S.coil*0.30);
    gl.uniform1f(U(progSim,'u_flow'),  1.15 + S.treb*0.85 + S.coil*0.70);
    gl.uniform1f(U(progSim,'u_swirl'), 1.50 + S.treb*1.6 + S.coil*3.2 + S.beat*1.2);
    // put the cursor into world space on the camera plane (undo the render yaw), so the
    // particles it grabs are the ones actually under the pointer
    const yaw = S.t*0.075 + S.bass*0.22, mx = mouse.x*2.4;
    gl.uniform4f(U(progSim,'u_mouse'), mx*Math.cos(yaw), mouse.y*2.4, mx*Math.sin(yaw),
                 mouse.down ? 1 : (mouse.over ? 2 : 0));

    gl.bindVertexArray(pVAO[src]);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfo);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, pbuf[dst].pos);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, pbuf[dst].vel);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 2, pbuf[dst].dat);
    gl.enable(gl.RASTERIZER_DISCARD);
    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, pActive);
    gl.endTransformFeedback();
    gl.disable(gl.RASTERIZER_DISCARD);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    gl.bindVertexArray(null);
    pcur = dst;
  }

  // ---------------- modes (the hero visual) ----------------
  // A mode owns one thing: drawing into sceneRT. Everything downstream -- bloom,
  // tonemap, HUD, recording, fingerprint -- is shared, so a new mode is just a
  // draw function plus its shaders.
  let modeId = 'web';
  function drawWeb(S){
    bindRT(sceneRT);
    gl.disable(gl.BLEND);
    gl.useProgram(progWeb);
    gl.uniform2f(U(progWeb,'u_res'), RW, RH);
    gl.uniform1f(U(progWeb,'u_time'), S.t);
    gl.uniform1f(U(progWeb,'u_bass'), S.bass);
    gl.uniform1f(U(progWeb,'u_mid'), S.mid);
    gl.uniform1f(U(progWeb,'u_treble'), S.treb);
    gl.uniform1f(U(progWeb,'u_beat'), S.beat);
    gl.uniform1f(U(progWeb,'u_exposure'), S.expo);
    gl.uniform1f(U(progWeb,'u_safe'), S.safe);
    gl.uniform3fv(U(progWeb,'u_c1'), S.c1);
    gl.uniform3fv(U(progWeb,'u_c2'), S.c2);
    gl.uniform3fv(U(progWeb,'u_nodes'), nodeBuf);
    gl.uniform4fv(U(progWeb,'u_edges'), edgeBuf);
    gl.uniform1f(U(progWeb,'u_net'), netOn ? 1 : 0);
    gl.uniform1f(U(progWeb,'u_coh'), netOn ? coh : 0);
    gl.uniform1f(U(progWeb,'u_coil'), S.coil);
    gl.uniform1f(U(progWeb,'u_burst'), S.burst);
    gl.uniform2fv(U(progWeb,'u_fig'), figBuf);
    gl.uniform1i(U(progWeb,'u_figN'), figN);
    gl.uniform3fv(U(progWeb,'u_figA'), figA);
    gl.uniform3fv(U(progWeb,'u_figB'), figB);
    drawQuad();
  }
  function drawNebula(S, dt){
    bindRT(sceneRT);
    gl.disable(gl.BLEND);
    gl.useProgram(progGas);
    gl.uniform2f(U(progGas,'u_res'), RW, RH);
    gl.uniform1f(U(progGas,'u_time'), S.t);
    gl.uniform1f(U(progGas,'u_bass'), S.bass);
    gl.uniform1f(U(progGas,'u_mid'), S.mid);
    gl.uniform1f(U(progGas,'u_treble'), S.treb);
    gl.uniform1f(U(progGas,'u_beat'), S.beat);
    gl.uniform1f(U(progGas,'u_coil'), S.coil);
    gl.uniform1f(U(progGas,'u_burst'), S.burst);
    gl.uniform1f(U(progGas,'u_safe'), S.safe);
    gl.uniform1f(U(progGas,'u_exposure'), S.expo);
    gl.uniform3fv(U(progGas,'u_c1'), S.c1);
    gl.uniform3fv(U(progGas,'u_c2'), S.c2);
    drawQuad();

    simParticles(S, dt);

    bindRT(sceneRT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);            // additive; sprites are premultiplied
    gl.useProgram(progPts);
    gl.uniform2f(U(progPts,'u_res'), RW, RH);
    gl.uniform1f(U(progPts,'u_time'), S.t);
    gl.uniform1f(U(progPts,'u_bass'), S.bass);
    gl.uniform1f(U(progPts,'u_beat'), S.beat);
    gl.uniform1f(U(progPts,'u_burst'), S.burst);
    gl.uniform1f(U(progPts,'u_coil'), S.coil);
    gl.uniform1f(U(progPts,'u_safe'), S.safe);
    gl.uniform1f(U(progPts,'u_hue'), S.hue);
    gl.uniform1f(U(progPts,'u_exposure'), S.expo);
    gl.uniform1f(U(progPts,'u_cam'), 2.85 - S.beat*0.20*S.safe - S.burst*0.30);
    gl.uniform1f(U(progPts,'u_focal'), 1.25);
    gl.uniform1f(U(progPts,'u_psize'), 12.0 * (RH/1080));
    gl.uniform3fv(U(progPts,'u_c1'), S.c1);
    gl.uniform3fv(U(progPts,'u_c2'), S.c2);
    gl.bindVertexArray(pVAO[pcur]);
    gl.drawArrays(gl.POINTS, 0, pActive);
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }
  // one frame: upload the spectrum, let the mode draw the scene, then post to canvas
  function renderFrame(S, dt){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fftTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, freqData.length, 1, gl.RED, gl.UNSIGNED_BYTE, freqData);
    if (modeId === 'nebula' && nebulaOK) drawNebula(S, dt); else drawWeb(S);
    postProcess(S);
  }
  // the per-frame state every mode and the post chain reads
  function frameState(t, a){
    const th = THEMES[+themeSel.value];
    return {
      t, bass:a.bass, mid:a.mid, treb:a.treb, beat,
      coil, burst, expo: exposure(a.energy), safe: safeVal(),
      // the harmonic drift is baked into c1/c2 here, so u_hue only carries the
      // PER-PARTICLE spread (speed/seed) -- adding harmHue again would double-shift
      c1: shiftHue(th.c1, harmHue), c2: shiftHue(th.c2, harmHue), hue: 0
    };
  }
  // CPU-side twin of the shader's hueShift -- lets the harmonic drift be baked into
  // the theme colors once per frame instead of per pixel.
  function shiftHue(c, a){
    const k = 0.5773502692, cs = Math.cos(a), sn = Math.sin(a);
    const dot = k*(c[0]+c[1]+c[2]);
    return new Float32Array([
      c[0]*cs + (k*c[2] - k*c[1])*sn + k*dot*(1-cs),
      c[1]*cs + (k*c[0] - k*c[2])*sn + k*dot*(1-cs),
      c[2]*cs + (k*c[1] - k*c[0])*sn + k*dot*(1-cs),
    ]);
  }

  // ---------------- NERV HUD (2D overlay) ----------------
  const glyphCols = 40;
  let scrollY = 0;
  // named readout: the MAGI "reads" the track in real time from the envelope signals.
  // Priority events (drop/build) interrupt instantly; steady states hold ~0.5s so the
  // label doesn't strobe. Returns a short status string for the HUD.
  let hudLabel = 'SYSTEM NOMINAL', hudLabelP = 0, hudLabelT = 0;
  function musicReadout(a, now){
    const tot = a.bass + a.mid + a.treb + 1e-3;
    let label, pri;
    if (burst > 0.4)              { label='RELEASE // DROP';  pri=5; }
    else if (coil > 0.5)          { label='TENSION RISING';   pri=4; }
    else if (coil > 0.25)         { label='CHARGING';         pri=3; }
    else if (energyFast < 0.12)   { label='SIGNAL LOW';       pri=3; }
    else if (a.treb/tot > 0.42)   { label='HARMONIC BLOOM';   pri=1; }
    else if (a.bass/tot > 0.55)   { label='SUB-BASS SURGE';   pri=1; }

    } else { hudLabelP = pri; hudLabelT = now; }
