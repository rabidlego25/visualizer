<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0a0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>MAGI — EVA Sound Visualizer</title>
<style>
  :root {
    --bg: #050506;
    --panel: rgba(12, 10, 8, 0.82);
    --border: rgba(255, 140, 26, 0.25);
    --amber: #ff8c1a;
    --amber-dim: #a85c10;
    --text: #ffce9e;
    --muted: #8a6a44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0; padding: 16px;
  }
  /* The GL canvas renders offscreen-ish; the 2D canvas is what you see + record */
  #gl { display: none; }
  #view {
    background: #000;
    border-radius: 6px;
    cursor: grab;
    touch-action: none;   /* let us handle drag on touch without scrolling */
    box-shadow: 0 0 0 1px rgba(255,140,26,0.2), 0 24px 70px rgba(0,0,0,0.7),
                0 0 60px rgba(255,80,20,0.08);
    max-width: 100%; max-height: 100%;
  }

  #hint {
    position: absolute; inset: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    pointer-events: none; text-align: center; color: var(--muted);
    transition: opacity 0.4s; letter-spacing: 2px;
  }
  #hint .big { font-size: 20px; font-weight: 700; color: var(--amber); text-transform: uppercase; }
  #hint .small { font-size: 12px; }
  #hint.hidden { opacity: 0; }

  #controls, #seekbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--panel);
    backdrop-filter: blur(16px); border-top: 1px solid var(--border);
    flex-wrap: wrap; justify-content: center;
  }
  #seekbar { padding: 7px 20px; gap: 12px; }
  #seekbar.disabled { opacity: 0.4; }
  .group { display: flex; align-items: center; gap: 8px; }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  button, .filebtn {
    background: rgba(255,140,26,0.08); color: var(--text);
    border: 1px solid var(--border); padding: 8px 13px; border-radius: 4px;
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; user-select: none;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover, .filebtn:hover { background: rgba(255,140,26,0.2); }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--amber); border-color: transparent; color: #1a0d00; }
  button.rec { background: #e2231a; border-color: transparent; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }

  label.field { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; letter-spacing: 1px; text-transform: uppercase; }
  select {
    background: rgba(255,140,26,0.06); color: var(--text);
    border: 1px solid var(--border); padding: 7px 9px; border-radius: 4px;
    font-family: inherit; font-size: 12px; cursor: pointer;
  }
  input[type=range] { accent-color: var(--amber); cursor: pointer; }
  #seek { flex: 1; height: 5px; }
  input[type=file] { display: none; }
  .tlabel { font-size: 12px; color: var(--muted); min-width: 44px; }
  .tlabel:last-child { text-align: right; }
  #recDot { display: none; width: 9px; height: 9px; border-radius: 50%; background: #e2231a; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #timer { font-size: 12px; color: var(--muted); min-width: 42px; }
  .brand { font-weight: 700; letter-spacing: 3px; font-size: 14px; color: var(--amber); margin-right: 4px; }

  @media (max-width: 760px) { .brand, .sep { display: none; } #controls { padding: 9px; gap: 6px; } }
  input[type=text]{
    background:#120d16; color:#ffd9a8; border:1px solid #3a2b1c; border-radius:4px;
    padding:4px 6px; font:inherit; font-size:11px; width:82px; letter-spacing:.04em;
  }
  input[type=text]::placeholder{ color:#6b5540; }
  input[type=text]:focus{ outline:none; border-color:#ffb45a; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="view"></canvas>
    <div id="hint">
      <div class="big">// SOUND ONLY</div>
      <div class="small">DROP AUDIO FILE · OR USE CONTROLS BELOW · OR MICROPHONE</div>
    </div>
  </div>

  <div id="seekbar" class="disabled">
    <span id="curTime" class="tlabel">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
    <span id="durTime" class="tlabel">0:00</span>
  </div>

  <div id="controls">
    <a class="brand" href="index.html" title="← All visualizers" style="text-decoration:none;color:inherit">NERV</a>
    <div class="group">
      <label class="filebtn" for="fileInput">▷ Load</label>
      <input type="file" id="fileInput" accept="audio/*">
      <button id="micBtn">◉ Mic</button>
      <button id="playBtn" class="primary" disabled>▶ Play</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <label class="field">Engine
        <select id="modeSel">
          <option value="web">🧠 Neural Web</option>
          <option value="nebula">✦ Particle Nebula</option>
          <option value="water">▤ Spectral Waterfall</option>
          <option value="fluid">≋ Fluid Smoke</option>
        </select>
      </label>
      <label class="field">Unit
        <select id="themeSel">
          <option value="0">01 · NERV Amber</option>
          <option value="1">02 · Unit-01</option>
          <option value="2">03 · Pattern Blue</option>
          <option value="3">04 · Blood</option>
          <option value="4">05 · Testify ✦</option>
        </select>
      </label>
      <label class="field">Format
        <select id="ratioSel">
          <option value="9:16" selected>Vert 9:16</option>
          <option value="1:1">Square 1:1</option>
          <option value="16:9">Wide 16:9</option>
        </select>
      </label>
      <button id="netBtn" class="primary">🧠 Neural</button>
      <label class="field"><span id="nodeLbl">Nodes</span> <input type="range" id="nodeSlider" min="0" max="1" step="0.01" value="0.8"></label>
      <button id="trailBtn" class="primary" title="Feedback trails — motion leaves a fading wake">✳ Trails</button>
      <button id="safeBtn" title="Reduce flashing & motion">🕊 Calm</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <input type="text" id="titleIn" maxlength="40" placeholder="TRACK" title="Your track name — burned into the recording, inside Instagram's safe area">
      <input type="text" id="artistIn" maxlength="30" placeholder="ARTIST" title="Your name — burned into the recording">
      <button id="hudBtn" class="primary" title="NERV overlay on/off — turn it off for a clean look that's yours">▣ HUD</button>
      <button id="randBtn" title="Jump to a random engine / palette / density">⇄ Random</button>
      <button id="fpBtn" title="Song fingerprint — a unique portrait of this track">◎ Print</button>
      <button id="fpSaveBtn" title="Download the fingerprint as a PNG">⤓ Save</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <label class="field">Clip
        <select id="clipSel" title="Loop lengths start on a downbeat and run a whole number of bars, so the clip loops seamlessly">
          <option value="free">Free</option>
          <option value="bars4">Loop · 4 bars</option>
          <option value="bars8" selected>Loop · 8 bars</option>
          <option value="bars16">Loop · 16 bars</option>
          <option value="s60">Story · 60s</option>
          <option value="s90">Reel · 90s</option>
        </select>
      </label>
      <button id="safeAreaBtn" title="Show where Instagram's caption and buttons cover a Reel (never recorded)">⌗ Guides</button>
      <button id="recBtn" class="rec" disabled>● Rec</button>
      <span id="recDot"></span>
      <span id="timer">0:00</span>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ============================================================
  //  MAGI / EVA sound visualizer
  //  - GPU fragment shader (WebGL2) renders the reactive scene.
  //  - A 2D canvas blits the GPU frame + draws the NERV telemetry
  //    HUD on top, and is the single surface we record.
  //  NOTE: to move this to WebGPU later, only createRenderer() and
  //  the shader source need to change; everything else is portable.
  // ============================================================

  const glCanvas  = document.getElementById('gl');
  const view      = document.getElementById('view');
  const vctx      = view.getContext('2d');
  const hint      = document.getElementById('hint');
  const fileInput = document.getElementById('fileInput');
  const micBtn    = document.getElementById('micBtn');
  const playBtn   = document.getElementById('playBtn');
  const themeSel  = document.getElementById('themeSel');
  const modeSel   = document.getElementById('modeSel');
  const nodeLbl   = document.getElementById('nodeLbl');
  const ratioSel  = document.getElementById('ratioSel');
  const recBtn    = document.getElementById('recBtn');
  const titleIn   = document.getElementById('titleIn');
  const artistIn  = document.getElementById('artistIn');
  const hudBtn    = document.getElementById('hudBtn');
  const randBtn   = document.getElementById('randBtn');
  const clipSel   = document.getElementById('clipSel');
  const safeAreaBtn = document.getElementById('safeAreaBtn');
  const recDot    = document.getElementById('recDot');
  const timerEl   = document.getElementById('timer');
  const netBtn    = document.getElementById('netBtn');
  const safeBtn   = document.getElementById('safeBtn');
  const trailBtn  = document.getElementById('trailBtn');
  const nodeSlider= document.getElementById('nodeSlider');
  const fpBtn     = document.getElementById('fpBtn');
  const fpSaveBtn = document.getElementById('fpSaveBtn');
  const seekbar   = document.getElementById('seekbar');
  const seek      = document.getElementById('seek');
  const curTime   = document.getElementById('curTime');
  const durTime   = document.getElementById('durTime');

  // Themes: [hot edge color, base edge color, HUD css color]
  const THEMES = [
    { c1:[1.0,0.55,0.12], c2:[0.95,0.10,0.05], hud:'#ff8c1a' }, // NERV amber
    { c1:[0.55,1.0,0.18], c2:[0.55,0.12,0.95], hud:'#8cff3c' }, // Unit-01 green/purple
    { c1:[0.35,0.75,1.0], c2:[0.10,0.25,0.95], hud:'#4cc9ff' }, // Pattern Blue
    { c1:[1.0,0.25,0.15], c2:[0.55,0.02,0.02], hud:'#ff4530' }, // Blood
    { c1:[1.0,0.82,0.20], c2:[1.0,0.12,0.70], hud:'#ffcf3a' }, // Testify (gold + magenta, hyper-vivid)
  ];

  // ---------------- Audio ----------------
  let audioCtx=null, analyser=null, sourceNode=null, mediaEl=null, mediaElSrc=null, micStream=null;
  let freqData=null, timeData=null, destNode=null, currentURL=null;

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.80;
    freqData = new Uint8Array(analyser.frequencyBinCount); // 1024
    timeData = new Uint8Array(analyser.fftSize);
    destNode = audioCtx.createMediaStreamDestination();
  }
  function disconnectSource() {
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode=null; }
    if (micStream) { micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    if (mediaEl) mediaEl.pause();
  }
  function connect(node, toSpeakers) {
    node.connect(analyser);
    analyser.connect(destNode);
    if (toSpeakers) analyser.connect(audioCtx.destination);
  }
  function loadFile(file) {
    ensureAudio(); disconnectSource();
    if (currentURL) URL.revokeObjectURL(currentURL);
    currentURL = URL.createObjectURL(file);
    if (!mediaEl) {
      mediaEl = new Audio(); mediaEl.crossOrigin='anonymous';
      mediaEl.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmt(mediaEl.duration);
        seek.disabled=false; seekbar.classList.remove('disabled');
      });
      mediaEl.addEventListener('timeupdate', () => {
        if (seeking || !mediaEl.duration) return;
        seek.value = (mediaEl.currentTime/mediaEl.duration)*1000;
        curTime.textContent = fmt(mediaEl.currentTime);
      });
      // an <audio> element may only ever have ONE MediaElementSource -- create it
      // once and reuse it, or a second load throws InvalidStateError (drop #2 fails).
      mediaElSrc = audioCtx.createMediaElementSource(mediaEl);
    }
    mediaEl.src = currentURL; mediaEl.loop=false;
    mediaEl.onended = () => { playBtn.textContent='▶ Play'; };
    sourceNode = mediaElSrc;
    connect(sourceNode, true);
    playBtn.disabled=false; recBtn.disabled=false;
    fpReset(file.name);
    hint.classList.add('hidden'); startLoop(); play();
  }
  async function useMic() {
    ensureAudio();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      disconnectSource(); micStream=stream;
      sourceNode = audioCtx.createMediaStreamSource(stream);
      connect(sourceNode, false);
      playBtn.disabled=true; recBtn.disabled=false;
      seek.disabled=true; seekbar.classList.add('disabled');
      curTime.textContent=durTime.textContent='0:00';
      fpReset('LIVE INPUT');
      hint.classList.add('hidden'); startLoop();
    } catch(e) { alert('Microphone access failed: '+e.message); }
  }
  function play() {
    if (!mediaEl) return;
    if (audioCtx.state==='suspended') audioCtx.resume();
    if (mediaEl.paused) { mediaEl.play(); playBtn.textContent='❚❚ Pause'; }
    else { mediaEl.pause(); playBtn.textContent='▶ Play'; }
  }
  function fmt(s){ if(!isFinite(s))return '0:00'; s=Math.floor(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

  // ---------------- Sizing ----------------
  let W=0, H=0;
  // short side of the output canvas. Only the ?res= test hook changes it -- the
  // render harness software-rasterises, and 1080x1920 there costs ~3x for no extra
  // information, so it renders the identical scene smaller.
  let baseRes = 1080;
  function resize() {
    const [rw,rh] = ratioSel.value.split(':').map(Number);
    const stage = document.getElementById('stage');
    const aw = stage.clientWidth-32, ah = stage.clientHeight-32;
    let cw=aw, ch=cw*rh/rw;
    if (ch>ah) { ch=ah; cw=ch*rw/rh; }
    view.style.width=cw+'px'; view.style.height=ch+'px';
    // 1080 on the SHORT side, so vertical is a true 1080x1920. This used to pin the
    // height, which made 9:16 only 608 wide -- a third of the pixels Instagram Reels
    // expects, and its encoder is far harsher on an undersized source than on a big one.
    if (rw >= rh){ H = baseRes; W = Math.round(baseRes*rw/rh); }
    else         { W = baseRes; H = Math.round(baseRes*rh/rw); }
    glCanvas.width=W; glCanvas.height=H;
    view.width=W; view.height=H;
    if (gl) allocRTs(Math.round(W*renderScale), Math.round(H*renderScale));
  }

  // ---------------- WebGL2 engine ----------------
  // Multi-pass pipeline:
  //   1. the active MODE draws the hero visual into sceneRT (HDR when float RTs exist)
  //   2. bright-pass -> two octaves of separable blur  = real, thresholded bloom
  //   3. composite: chromatic aberration + bloom + ACES tonemap + CRT grade -> canvas
  // Only step 1 changes when a mode is added, so new hero visuals are cheap to build.
  // The old fake bloom (col += col*col) lifted EVERYTHING to buy glow, which is why
  // loud passages blew out; a thresholded bright-pass + filmic rolloff gives the glow
  // back without the white-out.
  let gl=null, fftTex=null, quadVAO=null;
  const uCache = new Map();
  function U(p, n){                    // cached uniform lookup (null locations no-op)
    let m = uCache.get(p);
    if (!m){ m = new Map(); uCache.set(p, m); }
    if (!m.has(n)) m.set(n, gl.getUniformLocation(p, n));
    return m.get(n);
  }

  // shared GLSL helpers, injected into every program
  const COMMON = `
  // rotate a color around the value axis -> vivid hue shimmer
  vec3 hueShift(vec3 c, float a){
    const vec3 k = vec3(0.57735);
    float cs = cos(a), sn = sin(a);
    return c*cs + cross(k,c)*sn + k*dot(k,c)*(1.0-cs);
  }
  float h11(float p){ return fract(sin(p*127.1)*43758.5453); }
  float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  `;

  const VERT = `#version 300 es
  layout(location=0) in vec2 a_pos;
  void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

  const FRAG_WEB = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2  u_res;
  uniform float u_time;
  uniform float u_bass;
  uniform float u_mid;
  uniform float u_treble;
  uniform float u_beat;
  uniform vec3  u_c1;      // hot edge color
  uniform vec3  u_c2;      // base edge color
  uniform sampler2D u_fft; // 1D-ish frequency texture

  // NOTE: the neural web is no longer drawn here. It used to be two per-pixel loops
  // over uniform arrays (MAXE edges + MAXN nodes for EVERY fragment), which is what
  // pinned the node ceiling at 48. It is now real geometry -- see FRAG_EDGE/FRAG_NODE,
  // drawn additively over this background by drawNet().
  uniform float u_exposure;     // auto-exposure: <1 during sustained-loud passages
  uniform float u_safe;         // 1 = full effects, low = reduced motion/flashing
  uniform float u_coh;          // 0..1 coalescence: background quiets so the figure reads
  uniform float u_coil;         // 0..1 tension winding up (build) -> brighter
  uniform float u_burst;        // 0..1 release exhale -> flash + outward pop
  const int MAXF = 24;          // silhouette outline points (closed polygon)
  uniform vec2  u_fig[MAXF];    // figure outline in uv space (already spun/placed by JS)
  uniform int   u_figN;         // active outline point count (0 = no figure)
  uniform vec3  u_figA;         // figure body color
  uniform vec3  u_figB;         // figure rim / accent color
  ${COMMON}

  float hexDist(vec2 p){ p = abs(p); return max(dot(p, vec2(0.866025,0.5)), p.y); }
  vec4 hexCoords(vec2 uv){
    vec2 r = vec2(1.0, 1.732050);
    vec2 h = r*0.5;
    vec2 a = mod(uv, r) - h;
    vec2 b = mod(uv - h, r) - h;
    vec2 gv = dot(a,a) < dot(b,b) ? a : b;
    float y = 0.5 - hexDist(gv);
    vec2 id = uv - gv;
    return vec4(gv.x, y, id);
  }
  float fftAt(float t){ return texture(u_fft, vec2(clamp(t,0.0,1.0), 0.5)).r; }

  // anime "speed lines" radiating from center, strongest at the edges
  float speedLines(vec2 uv, float t){
    float a = atan(uv.y, uv.x);
    float r = length(uv);
    float l = sin(a*64.0 + sin(a*11.0 + t)*2.0);
    l = smoothstep(0.55, 1.0, l);
    return l * smoothstep(0.30, 1.15, r);
  }

  // distance from point p to segment a-b
  float segDist(vec2 p, vec2 a, vec2 b){
    vec2 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/(dot(ba,ba)+1e-5), 0.0, 1.0);
    return length(pa - ba*h);
  }
  // signed distance to the closed figure polygon (negative = inside). Winding
  // test (iq) gives a solid fillable silhouette regardless of node count.
  float figSDF(vec2 p){
    float d = 1e9, s = 1.0;
    int n = u_figN;
    for (int i=0;i<MAXF;i++){
      if (i>=n) break;
      int j = i==0 ? n-1 : i-1;
      vec2 a = u_fig[i], b = u_fig[j];
      d = min(d, segDist(p,a,b));
      bvec3 c = bvec3(p.y>=a.y, p.y<b.y, (b.x-a.x)*(p.y-a.y) > (b.y-a.y)*(p.x-a.x));
      if (all(c) || all(not(c))) s = -s;
    }
    return d*s;
  }
  // A THIN, translucent wireframe ghost -- just a whisper of geometry behind the web.
  // The neural net is the hero; this is a faint hint, never a solid form.
  vec3 figure(vec2 uv, float t){
    if (u_coh < 0.01 || u_figN < 3) return vec3(0.0);
    float sdf  = figSDF(uv);
    float line = smoothstep(0.0035, 0.0, abs(sdf));        // hairline outline only
    float fill = smoothstep(0.0, -0.02, sdf);              // interior mask (soft edge)
    vec3 col  = u_figB * line * (0.30 + u_beat*0.25);      // faint thin wire
    col += u_figA * fill * 0.03 * (0.5 + u_bass*0.5);      // barely-there interior tint
    return col * u_coh * 0.5;
  }

  vec3 scene(vec2 uv, float t){
    vec3 col = vec3(0.0);
    float d = length(uv);

    // --- AT-field hex grid ---
    float scale = 6.5 + u_bass*2.5;
    float ang = t*0.07 + u_bass*0.5 + u_coil*0.6 + 0.25*sin(t*0.13);   // spins up as tension builds
    mat2 rot = mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
    vec2 huv = rot * uv * scale;
    vec4 hc = hexCoords(huv);
    // thin, crisp cell edge (hc.y is ~0 at edges, ~0.5 at centers)
    float edge = smoothstep(0.035, 0.0, hc.y);
    float cellR = length(hc.zw);                       // ring index from center
    float f = fftAt(cellR*0.045);                      // audio energy for this ring
    float ripple = 0.5 + 0.5*sin(cellR*0.9 - t*3.2);   // expanding pulse
    // low ambient so idle stays dark/clean; edges light up with audio + beats
    float glow = edge * (0.05 + f*2.0 + u_beat*ripple*1.8*u_safe + u_burst*0.7);   // release flashes the field (restrained)
    vec3 hexCol = mix(u_c2, u_c1, clamp(f*1.6 + u_beat*0.5, 0.0, 1.0));
    hexCol = hueShift(hexCol, sin(cellR*0.30 + t*0.20)*0.16 + f*0.25); // subtle shimmer
    // AT-field recedes as the web coalesces into a silhouette, so the figure reads
    float hexDim = 1.0 - u_coh*0.4;
    col += hexCol * glow * hexDim;
    // fill a cell only when its band is strong (f squared -> nothing at idle)
    col += hexCol * smoothstep(0.30, 0.46, hc.y) * f*f * 0.5 * hexDim;
    // each cell carries its own triangle that spins at its OWN rate (per-cell hash)
    // -> the field rotates individually, not in unison. Rate rises with the music.
    vec2 gv = huv - hc.zw;                              // local coord within this cell
    float cid = fract(sin(dot(hc.zw, vec2(12.9898,78.233)))*43758.5453);
    float cang = t*(0.5 + cid*2.2)*(0.5 + u_bass*1.6 + u_coil*1.8) + cid*6.2831;  // spins up with tension
    float pa = atan(gv.x, gv.y) + cang;                // rotate the glyph
    float pr = length(gv);
    float k = 6.2831/3.0;                              // 3 sides -> triangle
    float poly = cos(floor(0.5 + pa/k)*k - pa) * pr;   // regular-polygon distance (iq)
    float triSz = 0.14 + f*0.05;
    float tri = smoothstep(0.018, 0.0, abs(poly - triSz));
    col += hexCol * tri * (0.12 + f*1.8 + u_beat*0.4*u_safe + u_burst*0.7) * hexDim;

    // --- central eye / S2 core ---
    float coreR = 0.10 + u_bass*0.14 + u_beat*0.05 + u_burst*0.06;   // core swells on the release
    float core  = smoothstep(coreR, 0.0, d);
    float iris  = 0.5 + 0.5*sin(d*46.0 - t*2.2);
    vec3 coreCol = mix(u_c1, vec3(1.0,0.92,0.72), core);
    col += coreCol * (core * (0.85 + iris*0.35));
    // Halo radius is CAPPED. It used to be coreR*4.5, and coreR grows with bass -- at a
    // loud passage that reached ~1.1uv, i.e. the whole frame, and washed everything out.
    // Real bloom in the post chain gives the glow now; this is just the core's own falloff.
    col += u_c1 * smoothstep(0.16 + u_bass*0.10, 0.0, d) * (0.24 + u_bass*0.22);
    // rotating targeting ring
    float ring = smoothstep(0.006, 0.0, abs(d - (coreR*2.2)));
    col += u_c1 * ring * (0.4 + u_treble);

    // --- cruciform light burst on beat ---
    // The wide arms used to decay as exp(-|x|*5), which is still ~0.2 at the frame edge,
    // so on every beat the whole frame lifted and the cross read as a white blob instead
    // of a cross. Faster falloff + a radial gate keeps it a SHAPE; post bloom does the glow.
    float cross = exp(-abs(uv.x)*22.0) + exp(-abs(uv.y)*22.0);
    cross += 0.35*(exp(-abs(uv.x)*9.0) + exp(-abs(uv.y)*9.0));
    cross *= smoothstep(0.95, 0.08, length(uv));
    col += mix(u_c1, vec3(1.0,0.95,0.85), 0.6) * cross * u_beat * (0.25 + 0.5*u_safe);

    return col;
  }

  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
    float t = u_time;
    // beat "punch": zoom + rotation kick on every hit for kinetic impact; the
    // release adds a brief outward pop so the drop lands physically.
    uv /= (1.0 + (u_beat*0.15 + u_burst*0.06 + u_coil*0.04)*u_safe);   // profound beats punch harder
    float rk = u_beat*0.055*u_safe;                                    // rotation snap on the hit
    uv = mat2(cos(rk),-sin(rk),sin(rk),cos(rk)) * uv;
    // brief shake -- beat*beat so only the heavy hits shake, soft ticks barely move
    uv += vec2(sin(t*133.0), cos(t*149.0)) * (u_beat*u_beat*0.012) * u_safe;

    // busy background scene -> compensated by auto-exposure so loud passages settle
    // slow continuous drift so the background is always gently rotating; the
    // neural web stays in screen space (its figures spin under their own control).
    // (chromatic aberration used to evaluate scene() three times here; it now runs
    //  once in the composite pass -- same look, a third of the background cost.)
    float gr = t*0.035 + u_bass*0.15;
    mat2 grot = mat2(cos(gr),-sin(gr),sin(gr),cos(gr));
    vec3 scn = scene(grot * uv, t);
    float sl = speedLines(uv, t) * (u_beat*1.4 + u_treble*0.4) * u_safe;
    scn += mix(u_c1, vec3(1.0), 0.6) * sl;
    scn *= u_exposure;
    // neural web stays readable: dims far less than the background (0.7 -> ~30% of the dimming)
    // ...but as the figure coalesces the web RECEDES so the solid silhouette dominates
    // (fixes the old "sync high = unreadable bright blob").
    vec3 fig = figure(uv, t);
    // HDR out: the grade (bloom, tonemap, scanlines, vignette) lives in the post pass.
    // The neural web is additively drawn OVER this by the edge/node geometry passes.
    fragColor = vec4(scn + fig, 1.0);
  }`;

  // ---------------- Neural web as GEOMETRY ----------------
  // Edges are instanced quads and nodes are instanced sprites, so cost scales with the
  // number of primitives instead of pixels*primitives. That is what lifts the ceiling
  // from 48 nodes to several hundred.
  //
  // Both passes must land exactly where the background shader thinks they are, so they
  // reproduce the INVERSE of the beat "punch" that FRAG_WEB's main() applies to uv.
  const WEB_XF = `
  uniform vec2  u_res;
  uniform float u_time, u_beat, u_burst, u_coil, u_safe;
  vec2 webToClip(vec2 p){
    float punch = 1.0 + (u_beat*0.15 + u_burst*0.06 + u_coil*0.04)*u_safe;
    float rk    = u_beat*0.055*u_safe;
    vec2  shake = vec2(sin(u_time*133.0), cos(u_time*149.0)) * (u_beat*u_beat*0.012) * u_safe;
    vec2 q = p - shake;
    q = mat2(cos(rk), sin(rk), -sin(rk), cos(rk)) * q;   // transpose = inverse rotation
    q *= punch;
    return vec2(q.x * 2.0 * u_res.y / u_res.x, q.y * 2.0);
  }`;

  // ---- edges: one instanced quad per synapse, oriented along the segment ----
  const VERT_EDGE = `#version 300 es
  layout(location=0) in vec2 a_corner;   // unit quad: x = along 0..1, y = across -1..1
  layout(location=1) in vec4 i_seg;      // (ax, ay, bx, by) in web space
  layout(location=2) in vec2 i_meta;     // (energy 0..1, seed 0..1)
  out vec2 v_p, v_a, v_b;
  out vec2 v_meta;
  uniform float u_wide;                  // half-width of the quad (must cover the glow)
  ${WEB_XF}
  void main(){
    vec2 a = i_seg.xy, b = i_seg.zw;
    vec2 d = b - a;
    float L = length(d) + 1e-6;
    vec2 dir = d / L, perp = vec2(-dir.y, dir.x);
    // extend past both caps so packets riding the ends are not clipped by the quad
    vec2 p = mix(a, b, a_corner.x) + dir*(a_corner.x*2.0 - 1.0)*u_wide + perp*a_corner.y*u_wide;
    v_p = p; v_a = a; v_b = b; v_meta = i_meta;
    gl_Position = vec4(webToClip(p), 0.0, 1.0);
  }`;

  const FRAG_EDGE = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  in vec2 v_p, v_a, v_b;
  in vec2 v_meta;
  uniform vec3  u_c1;
  uniform float u_gain;    // master web intensity (exposure, coalescence, tension)
  uniform float u_scale;   // feature size, shrinks as the node count grows
  ${WEB_XF}
  float segDist(vec2 p, vec2 a, vec2 b){
    vec2 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/(dot(ba,ba)+1e-5), 0.0, 1.0);
    return length(pa - ba*h);
  }
  void main(){
    float d = segDist(v_p, v_a, v_b);
    float seed = v_meta.y, en = v_meta.x;
    vec3 lineCol = mix(u_c1, vec3(1.0), 0.35);
    vec3 col = lineCol * smoothstep(0.006*u_scale, 0.0, d) * 0.22;  // soft synapse
    col += lineCol * smoothstep(0.0016*u_scale, 0.0, d) * 0.6;      // bright core
    // fast-moving data packets (two per edge, speed surges on beats)
    for (int k=0;k<2;k++){
      float sp  = 0.7 + seed*1.1 + u_beat*1.8*u_safe;
      float pos = fract(u_time*sp + seed + float(k)*0.5);
      float pd  = length(v_p - mix(v_a, v_b, pos));
      col += vec3(1.0,0.96,0.86) * smoothstep(0.013*u_scale, 0.0, pd) * (0.85 + u_beat);
    }
    fragColor = vec4(col * u_gain * (0.7 + en*0.5), 1.0);
  }`;

  // ---- nodes: one instanced quad per node (core dot + halo + drifting gas) ----
  const VERT_NODE = `#version 300 es
  layout(location=0) in vec2 a_corner;   // unit quad in -1..1
  layout(location=1) in vec4 i_node;     // (x, y, energy, seed)
  out vec2 v_local;                      // offset from the node centre, in web units
  out vec2 v_meta;
  uniform float u_rad;                   // quad half-size (covers halo + gas)
  ${WEB_XF}
  void main(){
    vec2 off = a_corner * u_rad;
    v_local = off;
    v_meta  = vec2(i_node.z, i_node.w);
    gl_Position = vec4(webToClip(i_node.xy + off), 0.0, 1.0);
  }`;

  const FRAG_NODE = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  in vec2 v_local;
  in vec2 v_meta;
  uniform vec3  u_c1, u_c2;
  uniform float u_gain;
  uniform float u_scale;   // feature size, shrinks as the node count grows
  uniform float u_ngain;   // per-node brightness, also falls with count (additive pile-up)
  uniform float u_rad;     // the quad's own half-size: nothing may be drawn outside it
  ${WEB_XF}
  void main(){
    float nd = length(v_local);
    float en = v_meta.x, seed = v_meta.y;
    // core dot: pops bigger & brighter with energy + beat ("jump")
    float coreSz = (0.016 + en*0.03 + u_beat*0.012*u_safe) * u_scale;
    vec3 col = mix(u_c2, u_c1, en) * smoothstep(coreSz, 0.0, nd) * (0.5 + en*2.2);
    col += u_c1 * smoothstep(0.07*u_scale, 0.0, nd) * en * 0.5;    // node halo
    // per-node "gas": a small cloud of drifting sparks + a soft nebula that
    // breathes with the node's energy.
    float hz = 0.0;
    for (int k=0;k<4;k++){
      float fk = float(k);
      float a  = seed*6.2831 + fk*1.9 + u_time*(0.6 + seed*1.4) + sin(u_time*1.7 + fk)*0.6;
      // the outer spark ring grows with energy and would otherwise be sliced off by
      // the quad edge on a loud beat -- keep it inside the sprite it is drawn in
      float rad = min((0.02 + en*0.06 + u_beat*0.02*u_safe) * (0.5 + fk*0.4) * u_scale,
                      u_rad*0.90);
      float pd = length(v_local - vec2(cos(a), sin(a))*rad);
      hz += smoothstep(0.012*u_scale, 0.0, pd);
    }
    col += mix(u_c1, vec3(1.0,0.95,0.85), 0.4) * hz * (0.25 + en*1.5);
    float haze = smoothstep(0.14*u_scale, 0.0, nd) - smoothstep(0.05*u_scale, 0.0, nd);
    col += mix(u_c2, u_c1, en) * haze * en * 0.6;                  // nebular puff
    fragColor = vec4(col * u_gain * u_ngain, 1.0);
  }`;

  // ---------------- Spectral waterfall ----------------
  // A scrolling FFT history rendered as a receding terrain: one ribbon per history row,
  // oldest at the horizon, newest in the foreground.
  //
  // OCCLUSION WITHOUT A DEPTH BUFFER: sceneRT has no depth attachment, so each ribbon
  // is filled from its ridge line all the way DOWN off the bottom of the frame, in
  // opaque near-black, and the rows are drawn far-to-near. A nearer row simply paints
  // over the ones behind it (painter's algorithm). Primitive order within a draw call
  // is well-defined in GLES, so a single instanced call with instance 0 = farthest is
  // enough -- no sorting, no depth test, no blending.
  // A waterfall is a TIME AXIS: every row is a moment in the song. So each row also
  // carries the musical state it was captured under (u_row: beat strength, hue step,
  // energy, bar position) and keeps it forever. Beats and key changes are stamped into
  // the terrain and then recede into the distance -- the surface becomes a visible
  // record of the track's rhythm rather than a rolling loudness chart.
  const VERT_WATER = `#version 300 es
  layout(location=0) in vec2 a_v;   // x = 0..1 across the spectrum, y = 0 ridge / 1 skirt
  out float v_mag;                  // this column's magnitude
  out float v_below;                // clip-space distance below the ridge (0 on the line)
  out float v_age;                  // 0 = newest/nearest, 1 = oldest/at the horizon
  out float v_u, v_shade;
  out vec4  v_row;                  // (beat, hue, energy, barPos) as captured
  uniform sampler2D u_hist;         // COLS x ROWS spectrum history, row 0 = oldest
  uniform sampler2D u_row;          // 1 x ROWS per-row musical state, same scroll
  uniform float u_rows, u_amp, u_time, u_bass, u_beat, u_burst, u_safe, u_sway;
  uniform float u_waveAmp, u_waveK, u_wavePh;

  const float PERSP = 2.6;          // gentler than it was: 3.2 crowded the horizon and
                                    // left ~54px between adjacent rows in the foreground
  float scaleAt(float zz){ return 1.0/(1.0 + zz*PERSP); }

  // Surface height at any (u, row), pre-perspective. Sampled at neighbours too, so the
  // shading below can build a real normal instead of guessing.
  float heightAt(float u, float row, float rowE){
    float m  = texture(u_hist, vec2(u, (row+0.5)/u_rows)).r;
    float zz = 1.0 - row/(u_rows-1.0);
    float h  = m*m*u_amp*(1.0 + u_bass*0.35 + u_burst*0.5*u_safe);
    // travelling synth wave, phase-locked to the beat grid, with a second harmonic so
    // the crest has a waveform shape rather than a plain sine
    float ph = u*u_waveK - u_time*1.7 + zz*5.0 + u_wavePh*6.2831;
    h += (sin(ph) + 0.35*sin(ph*2.0 + 1.1)) * u_waveAmp * (0.25 + rowE*1.15);
    return h;
  }

  void main(){
    float row = float(gl_InstanceID);          // 0 first = farthest, so it is overpainted
    float age = 1.0 - row/(u_rows-1.0);
    float ry  = (row+0.5)/u_rows;
    float m   = texture(u_hist, vec2(a_v.x, ry)).r;
    vec4  rd  = texture(u_row,  vec2(0.5, ry));
    float zz  = age;
    float sc  = scaleAt(zz);

    float h  = heightAt(a_v.x, row, rd.b);
    // Normal by finite differences across the spectrum axis AND across depth. This is
    // what makes it read as a lit 3D surface rather than a contour chart.
    float du = 1.6/192.0;
    float hL = heightAt(a_v.x-du, row, rd.b), hR = heightAt(a_v.x+du, row, rd.b);
    float hB = heightAt(a_v.x, max(row-1.0, 0.0),        rd.b);
    float hF = heightAt(a_v.x, min(row+1.0, u_rows-1.0), rd.b);
    vec3 n = normalize(vec3(-(hR-hL)*30.0, 1.0, -(hF-hB)*10.0));
    v_shade = clamp(dot(n, normalize(vec3(-0.42, 0.70, 0.58))), 0.0, 1.0);

    // slow camera sway so the terrain is never a flat head-on chart
    float sway = sin(u_time*0.21)*0.10*u_sway;
    float x  = ((a_v.x - 0.5) + sway*zz) * 2.15 * sc;
    // Baseline, re-solved for PERSP: nearest row just off the bottom (-1.03), horizon
    // at +0.45. A shallower spread strands the terrain in a band with dead sky.
    float yb = 1.020 - 2.05*sc;
    float y  = yb + (a_v.y < 0.5 ? h*sc : -2.5);   // the skirt runs well off-frame, always
    v_mag = m; v_age = age; v_u = a_v.x; v_row = rd;
    v_below = (yb + h*sc) - y;                     // 0 on the ridge, grows down the skirt
    gl_Position = vec4(x, y, 0.0, 1.0);
  }`;

  const FRAG_WATER = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  in float v_mag, v_below, v_age, v_u, v_shade;
  in vec4  v_row;
  uniform vec3  u_c1, u_c2;
  uniform float u_time, u_beat, u_burst, u_safe, u_exposure, u_treble;
  ${COMMON}
  void main(){
    float m    = v_mag;
    float rBeat = v_row.r, rEnergy = v_row.b, rBar = v_row.a;
    float fade = (1.0 - v_age*0.72);                  // distance haze
    // Hue comes from the row's OWN stored step, not from the live theme, so the colour
    // a moment was captured in travels away with it.
    float hue  = (v_row.g - 0.5)*1.8 + (v_u - 0.5)*0.35;
    vec3  base = hueShift(mix(u_c2, u_c1, clamp(m*1.7, 0.0, 1.0)), hue);

    // THE SURFACE. The band between this ridge and the next nearer one is the visible
    // face of the terrain -- nearer rows paint over everything below them -- so shading
    // the skirt instead of filling it black turns a stack of separate lines into one
    // continuous lit surface. Deliberately DIM: it covers most of the frame, and the
    // ridge lines are what carry the brightness.
    float surf = smoothstep(0.17, 0.0, v_below);
    vec3 col = base * surf * (0.03 + v_shade*0.24 + rEnergy*0.08) * fade;
    // specular glint on wave crests facing the light -- sells the 3D read
    col += mix(base, vec3(1.0), 0.5) * surf * pow(v_shade, 9.0) * 0.30 * fade;

    // the ridge itself: a tight neon line. exp() falloff is FAST on purpose -- a slow
    // one lifts the whole skirt and the terrain reads as a glowing slab.
    // Ridge lines fade harder with depth than the surface does. In the far field rows
    // are ~3px apart, and at full strength they pile into a moire thicket instead of
    // resolving into the surface they sit on.
    float line = (exp(-v_below*150.0) + 0.35*exp(-v_below*45.0)) * (0.30 + 0.70*(1.0-v_age));
    col += mix(base, vec3(1.0,0.95,0.86), clamp(m*m*1.3, 0.0, 0.7))
         * line * (0.30 + m*1.9 + rEnergy*0.8) * fade;
    // ELECTRIC BEAT SCAR: the row captured on a hit keeps a hot arc-light crest for as
    // long as it is on screen, so every beat leaves a bright rung receding to the horizon.
    vec3 spark = mix(vec3(0.55,0.95,1.0), vec3(1.0,0.92,0.70), rBar);
    col += spark * line * rBeat*rBeat * 1.35 * u_safe * fade;
    col += spark * exp(-v_below*26.0) * rBeat * step(0.75, 1.0-rBar) * 0.30 * u_safe * fade;
    // Below the visible band the skirt must stay BLACK: it is the occluder that makes
    // the whole painter's-algorithm trick work.
    fragColor = vec4(col * u_exposure, 1.0);
  }`;

  // ---------------- Fluid / smoke (Stable Fluids) ----------------
  // Jos Stam's scheme, one fragment pass per step, all on textures at a reduced sim
  // resolution: advect velocity -> curl -> vorticity confinement -> divergence ->
  // Jacobi pressure solve -> subtract gradient -> advect dye. Music injects "splats"
  // of velocity and colour; nothing about the field ever comes back to JS.
  //
  // Requires HALF_FLOAT render targets. RGBA16F is filterable in core WebGL2, which
  // matters: semi-Lagrangian advection is a bilinear lookup at a backtraced position,
  // and with NEAREST it degenerates into blocky garbage.
  const FLUID_HEAD = `#version 300 es
  precision highp float;
  precision highp sampler2D;
  out vec4 fragColor;
  uniform vec2 u_texel;                 // 1/simSize
  vec2 fuv(){ return gl_FragCoord.xy * u_texel; }`;

  // semi-Lagrangian advection: look BACK along the velocity and fetch what was there
  const FRAG_FADV = `${FLUID_HEAD}
  uniform sampler2D u_src, u_vel;
  uniform float u_dt, u_diss;
  void main(){
    vec2 uv = fuv();
    vec2 v  = texture(u_vel, uv).xy;
    fragColor = texture(u_src, uv - v*u_dt*u_texel) * u_diss;
  }`;

  const FRAG_FCURL = `${FLUID_HEAD}
  uniform sampler2D u_vel;
  void main(){
    vec2 uv = fuv(), dx = vec2(u_texel.x,0.0), dy = vec2(0.0,u_texel.y);
    float l = texture(u_vel, uv-dx).y, r = texture(u_vel, uv+dx).y;
    float b = texture(u_vel, uv-dy).x, t = texture(u_vel, uv+dy).x;
    fragColor = vec4(0.5*((r-l) - (t-b)), 0.0, 0.0, 1.0);
  }`;

  // vorticity confinement: push energy back INTO the vortices the grid keeps damping
  // out. Without it the smoke goes soft and featureless within a couple of seconds.
  const FRAG_FVORT = `${FLUID_HEAD}
  uniform sampler2D u_vel, u_curl;
  uniform float u_dt, u_vort;
  void main(){
    vec2 uv = fuv(), dx = vec2(u_texel.x,0.0), dy = vec2(0.0,u_texel.y);
    float l = texture(u_curl, uv-dx).x, r = texture(u_curl, uv+dx).x;
    float b = texture(u_curl, uv-dy).x, t = texture(u_curl, uv+dy).x;
    float c = texture(u_curl, uv).x;
    vec2 N = 0.5*vec2(abs(r)-abs(l), abs(t)-abs(b));
    N /= (length(N) + 1e-5);
    vec2 force = u_vort * c * vec2(N.y, -N.x);
    fragColor = vec4(texture(u_vel, uv).xy + force*u_dt, 0.0, 1.0);
  }`;

  const FRAG_FDIV = `${FLUID_HEAD}
  uniform sampler2D u_vel;
  void main(){
    vec2 uv = fuv(), dx = vec2(u_texel.x,0.0), dy = vec2(0.0,u_texel.y);
    float l = texture(u_vel, uv-dx).x, r = texture(u_vel, uv+dx).x;
    float b = texture(u_vel, uv-dy).y, t = texture(u_vel, uv+dy).y;
    fragColor = vec4(0.5*((r-l) + (t-b)), 0.0, 0.0, 1.0);
  }`;

  const FRAG_FPRESS = `${FLUID_HEAD}
  uniform sampler2D u_prs, u_div;
  void main(){
    vec2 uv = fuv(), dx = vec2(u_texel.x,0.0), dy = vec2(0.0,u_texel.y);
    float l = texture(u_prs, uv-dx).x, r = texture(u_prs, uv+dx).x;
    float b = texture(u_prs, uv-dy).x, t = texture(u_prs, uv+dy).x;
    fragColor = vec4((l+r+b+t - texture(u_div, uv).x) * 0.25, 0.0, 0.0, 1.0);
  }`;

  // make the field divergence-free again by removing the pressure gradient
  const FRAG_FGRAD = `${FLUID_HEAD}
  uniform sampler2D u_vel, u_prs;
  void main(){
    vec2 uv = fuv(), dx = vec2(u_texel.x,0.0), dy = vec2(0.0,u_texel.y);
    float l = texture(u_prs, uv-dx).x, r = texture(u_prs, uv+dx).x;
    float b = texture(u_prs, uv-dy).x, t = texture(u_prs, uv+dy).x;
    fragColor = vec4(texture(u_vel, uv).xy - 0.5*vec2(r-l, t-b), 0.0, 1.0);
  }`;

  // one gaussian blob of velocity or dye, added to whatever is already there
  const FRAG_FSPLAT = `${FLUID_HEAD}
  uniform sampler2D u_src;
  uniform vec2  u_point;
  uniform vec3  u_value;
  uniform float u_radius, u_aspect;
  void main(){
    vec2 uv = fuv();
    vec2 d = uv - u_point; d.x *= u_aspect;
    fragColor = vec4(texture(u_src, uv).xyz + exp(-dot(d,d)/u_radius) * u_value, 1.0);
  }`;

  // dye -> scene. Shaded off the field so the smoke has form instead of reading flat.
  const FRAG_FDRAW = `${FLUID_HEAD}
  uniform sampler2D u_dye;
  uniform vec2  u_res;
  uniform float u_time, u_beat, u_burst, u_safe, u_exposure;
  uniform vec3  u_c1;
  ${COMMON}
  void main(){
    vec2 uv = gl_FragCoord.xy / u_res;
    vec3 d  = texture(u_dye, uv).rgb;
    // fake lighting from the dye's own gradient: cheap, and it turns a flat cloud into
    // something with rolling volume
    vec2 e = 1.0/u_res;
    float lum = dot(d, vec3(0.333));
    float gx = dot(texture(u_dye, uv+vec2(e.x,0)).rgb, vec3(0.333)) - lum;
    float gy = dot(texture(u_dye, uv+vec2(0,e.y)).rgb, vec3(0.333)) - lum;
    float shade = clamp(0.5 + (gx*1.6 + gy*2.4)*7.0, 0.25, 1.9);
    vec3 col = d * shade;
    col += u_c1 * pow(lum, 3.0) * (0.25 + u_burst*0.5);   // hot cores only
    fragColor = vec4(col * u_exposure, 1.0);
  }`;

  // ---- nebula backdrop: dark drifting gas the particles hang inside ----
  // Deliberately DIM. Same lesson as the coalesced shapes: the hero (here, the
  // particles) has to dominate, so this is atmosphere and never a subject.
  const FRAG_GAS = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2  u_res;
  uniform float u_time, u_bass, u_mid, u_treble, u_beat, u_coil, u_burst, u_safe, u_exposure;
  uniform vec3  u_c1, u_c2;
  ${COMMON}
  float vn(vec3 p){                       // cheap 3D value noise
    vec3 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    float n = i.x + i.y*57.0 + i.z*113.0;
    float a = mix(h11(n),      h11(n+1.0),   f.x);
    float b = mix(h11(n+57.0), h11(n+58.0),  f.x);
    float c = mix(h11(n+113.0),h11(n+114.0), f.x);
    float d = mix(h11(n+170.0),h11(n+171.0), f.x);
    return mix(mix(a,b,f.y), mix(c,d,f.y), f.z);
  }
  float fbm(vec3 p){
    float s = 0.0, a = 0.5;
    for (int i=0;i<4;i++){ s += a*vn(p); p *= 2.03; a *= 0.5; }
    return s;
  }
  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
    float t = u_time;
    float d = length(uv);
    // domain-warped clouds, slowly boiling; the churn speeds up with the mids.
    // (keep the frequency up -- at low frequency a 9:16 frame only sees one lobe of
    //  the noise and it reads as a smeared band rather than cloud texture.)
    vec3 q = vec3(uv*3.4, t*0.045);
    float w = fbm(q*0.8 + vec3(0.0,0.0,t*0.02));
    float cl = fbm(q + w*(0.7 + u_mid*0.8));
    cl = pow(max(cl-0.28, 0.0), 1.7);
    vec3 col = mix(u_c2, u_c1, cl*1.4) * cl * (0.30 + u_bass*0.55 + u_burst*0.5);
    col = hueShift(col, w*0.5 + t*0.05);
    // starfield: sparse, steady, gives the depth a reference frame
    vec2 sp = floor(uv*260.0);
    float st = step(0.9975, h21(sp));
    col += vec3(0.7,0.8,1.0) * st * (0.35 + 0.4*sin(t*2.0 + h21(sp)*40.0)) * 0.7;
    // the singularity the cloud orbits: swells on bass, flares on the release.
    // Restrained on purpose -- it sits dead centre, so any excess reads as a white blob.
    // Brightness bug shape (a) lived HERE, and it is what made the nebula read as "a
    // bright core": the halo's RADIUS was coreR*8.0 with coreR itself growing on
    // bass/burst, so it reached 0.29uv when quiet, 0.56uv loud and 0.96uv on a drop --
    // against a frame whose corner is only 0.574uv. Past ~0.57 there is no falloff left
    // anywhere on screen, so the "glow" was a flat wash over the whole image and the
    // particles disappeared into it. Radius is FIXED now; only the amplitude reacts.
    float coreR = 0.030 + u_bass*0.018;
    col += mix(u_c1, vec3(1.0,0.93,0.78), 0.5) * smoothstep(coreR, 0.0, d) * (0.50 + u_beat*0.30);
    col += u_c1 * smoothstep(0.26, 0.0, d) * (0.05 + u_bass*0.09 + u_coil*0.09);
    col *= smoothstep(1.45, 0.25, d);                 // hold the frame's edges dark
    fragColor = vec4(col * u_exposure, 1.0);
  }`;

  // ---- particle nebula: transform-feedback sim (runs with the rasterizer off) ----
  // Divergence-free curl flow from an ANALYTIC vector potential: six trig ops instead
  // of ~18 noise lookups per particle, which is what makes 100k+ particles affordable.
  const VERT_SIM = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 a_pos;
  layout(location=1) in vec3 a_vel;
  layout(location=2) in vec3 a_dat;      // x = life 1..0, y = seed, z = fft band
  out vec3 v_pos; out vec3 v_vel; out vec3 v_dat;
  uniform float u_dt, u_time, u_bass, u_mid, u_treble, u_beat, u_coil, u_burst, u_safe;
  uniform float u_shell, u_flow, u_swirl, u_disc;
  uniform vec4  u_mouse;                 // xyz = cursor in WORLD space, w: 0 none/1 drag/2 hover
  uniform sampler2D u_fft;
  ${COMMON}
  vec3 hash33(vec3 p){
    p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
    return fract(sin(p)*43758.5453);
  }
  // curl of psi = (sin(a.y)+cos(b.z), sin(c.z)+cos(d.x), sin(e.x)+cos(f.y))
  vec3 curlField(vec3 p, float t){
    vec3 q = p + vec3(0.0, 0.0, t*0.25);
    vec3 c1 = vec3(-1.6*sin(1.6*q.y) - 1.5*cos(1.5*q.z),
                   -1.3*sin(1.3*q.z) - 1.4*cos(1.4*q.x),
                   -1.9*sin(1.9*q.x) - 1.7*cos(1.7*q.y));
    vec3 r = q*2.7 + 4.1;                                   // second octave = fine eddies
    vec3 c2 = vec3(-1.6*sin(1.6*r.y) - 1.5*cos(1.5*r.z),
                   -1.3*sin(1.3*r.z) - 1.4*cos(1.4*r.x),
                   -1.9*sin(1.9*r.x) - 1.7*cos(1.7*r.y));
    return c1 + c2*0.4;
  }
  void main(){
    vec3 pos = a_pos, vel = a_vel;
    float life = a_dat.x, seed = a_dat.y, band = a_dat.z;
    float dt = u_dt;
    float e = texture(u_fft, vec2(band, 0.5)).r;            // this particle's own frequency
    float r = length(pos);
    vec3 dir = pos / max(r, 1e-4);

    // Turbulence is TEXTURE, not the story. It used to be ~4x the rotation term, and
    // 100k particles each drifting plausibly on their own read as a snowstorm: no
    // shared motion, so the eye never resolves them into one object.
    vec3 axis = normalize(vec3(0.0, 1.0, 0.18));
    vec3 curl = curlField(pos*u_flow, u_time) * (0.35 + u_mid*1.15 + e*0.9);
    // Flatten the TURBULENCE ONLY, and do it before anything else lands in acc. An
    // isotropic curl field pumps particles straight back out of the plane, which is what
    // kept this a ball. (Applying this to the accumulated acc instead also cancels 80%
    // of the disc spring below -- which is exactly the bug that made u_disc do nothing.)
    curl -= axis * dot(curl, axis) * 0.80;
    vec3 acc = curl;
    vec3 tang = normalize(cross(pos, axis) + vec3(1e-5));
    // Rotation curve. Shear is what makes a rotating body read as ONE body, but the
    // old profile (u_swirl/sqrt(0.30+r)) is MAXIMAL at r=0: the innermost material
    // spun fastest and was centrifugally thrown out of the middle, hollowing the disc
    // into a ring with a dark gap around the nucleus. Real discs rotate as a SOLID
    // BODY through the bulge (v ~ r) and only fall off outside it. r/(k + r^1.5) is
    // linear at small r and ~r^-0.5 outside, so the Keplerian-ish shear survives where
    // it is visible. Measured: centre density up ~60% and the gap closes.
    // (r*sqrt(r), not pow(r,1.5) -- cheaper, and defined at r=0 on every driver.)
    acc += tang * u_swirl * r / (1.80 + r*sqrt(r));
    // Collapse toward the disc plane. A uniform ball of noise is the least structured
    // shape there is; a disc has an axis, a silhouette and a direction of travel.
    acc -= axis * dot(pos, axis) * u_disc;
    // the cloud breathes: each particle seeks its OWN radius (spread by its seed), so
    // the nebula fills a VOLUME. One shared radius makes every particle chase the same
    // sphere and the whole thing renders as a hollow rugby ball.
    // cube-root radius: a UNIFORM seed puts density ~1/r^2, piling particles into the
    // middle where they all overlap and saturate. seed^(1/3) is the distribution that
    // fills a sphere evenly, which is what makes the cloud read as volume, not a lamp.
    // Radius measured IN THE DISC PLANE, not from the centre. A spherical shell spring
    // actively fights the flattening above, and the two cancel into a fat ball -- which
    // is exactly what the disc was failing to become.
    float hAx = dot(pos, axis);
    vec3  inPl = pos - axis*hAx;
    float rp   = length(inPl);
    vec3  dirP = inPl / max(rp, 1e-4);
    // seed^0.34 is r ~ u^(1/3): the exponent that fills a SPHERE evenly. It is left
    // over from when this was a ball, and on a disc it under-fills the middle and
    // over-fills the rim -- a hollow ring. A disc is 2D, so it wants r ~ u^(1/2).
    float rTarget = u_shell * 1.35 * pow(seed, 1.1);
    // Stiff spring, and it has to be: the outward term below is a CONSTANT force, not
    // an impulse, so every particle parks at rest offset = force/spring beyond its
    // target radius. At the old 2.2 against a beat push of 7.0 that offset was larger
    // than the cloud itself, which is how 67% of the particles ended up off-canvas.
    acc -= dirP * (rp - rTarget) * 8.5;
    // beats punch it outward, the drop detonates it
    acc += dirP * (u_beat*u_beat*0.8 + u_burst*2.5 + e*0.35) * u_safe;
    // cursor: drag hauls the cloud in, hover shoulders it aside (matches the web).
    // JS un-rotates the cursor by the camera yaw first, so this is a real world-space
    // point under the pointer -- comparing screen xy to world xy drifts as the camera turns.
    if (u_mouse.w > 0.5){
      bool drag = u_mouse.w < 1.5;
      vec3 dl = u_mouse.xyz - pos;
      float dd = length(dl) + 1e-4;
      float infl = smoothstep(0.9, 0.0, dd);
      acc += (drag ? dl/dd : -dl/dd) * infl * (drag ? 9.0 : 5.0);
    }
    vel += acc*dt;
    vel *= exp(-dt*1.7);                                    // drag, so it settles instead of exploding
    // Damp motion ALONG the axis specifically. A spring on its own just makes each
    // particle oscillate through the plane and the cloud stays spherical; removing
    // axial velocity is what actually collapses it into a disc.
    vel -= axis * dot(vel, axis) * min(1.0, u_disc*0.55*dt);
    pos += vel*dt;

    life -= dt * (0.09 + seed*0.10);
    // escape radius tracks the (now much smaller) cloud -- at the old 3.4 it sat far
    // outside anything the sim produces, so a particle flung out never came back
    // except by ageing out, and spent seconds streaking across an empty frame.
    if (life <= 0.0 || r > 1.8){                            // recycle: reseed near the shell
      vec3 h = hash33(vec3(seed*97.3, u_time, float(gl_VertexID)*0.017));
      float th = h.x*6.2831853, ph = acos(2.0*h.y - 1.0);
      // reseed INTO the disc: a spherical reseed constantly refills the volume the
      // flattening is trying to empty
      vec3 nd = vec3(sin(ph)*cos(th), cos(ph)*0.14, sin(ph)*sin(th));
      pos = nd * rTarget * (0.5 + h.z*0.8);
      vel = normalize(cross(pos, vec3(0.0,1.0,0.18)) + vec3(1e-5)) * (0.25 + h.z*0.4);
      life = 1.0;
    }
    v_pos = pos; v_vel = vel; v_dat = vec3(life, seed, band);
  }`;
  const FRAG_SIM = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  void main(){ fragColor = vec4(0.0); }`;

  // ---- particle nebula: additive point-sprite render, real perspective ----
  const VERT_PTS = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 a_pos;
  layout(location=1) in vec3 a_vel;
  layout(location=2) in vec3 a_dat;
  out vec4 v_col;
  uniform vec2  u_res;
  uniform float u_time, u_bass, u_beat, u_burst, u_coil, u_safe, u_hue;
  uniform float u_cam, u_focal, u_psize, u_exposure;
  uniform float u_armTwist, u_shockR, u_shockA;
  uniform vec3  u_c1, u_c2;
  uniform sampler2D u_fft;
  ${COMMON}
  void main(){
    // camera: a slow drift around the cloud, tilted, pulled in by heavy beats
    float yaw = u_time*0.075 + u_bass*0.22;
    float cy = cos(yaw), sy = sin(yaw);
    vec3 p = vec3(a_pos.x*cy + a_pos.z*sy, a_pos.y, -a_pos.x*sy + a_pos.z*cy);
    // pitch matters more than it looks: near edge-on the disc projects to a thin ellipse
    // and every particle overlaps every other one, which saturates to a white smear
    // Nearer face-on than before. Counter-intuitively this also REDUCES saturation:
    // edge-on stacks the whole disc along the view ray, face-on spreads it out. It is
    // also the only angle from which the spiral arms are legible at all.
    float pit = 1.02 + sin(u_time*0.11)*0.16;
    float cp = cos(pit), sp = sin(pit);
    p = vec3(p.x, p.y*cp - p.z*sp, p.y*sp + p.z*cp);
    float z = max(p.z + u_cam, 0.08);
    float f = u_focal / z;
    gl_Position = vec4(p.x*f*(u_res.y/u_res.x), p.y*f, 0.0, 1.0);

    float e = texture(u_fft, vec2(a_dat.z, 0.5)).r;
    float spd = length(a_vel);
    float life = a_dat.x;
    float fade = smoothstep(0.0, 0.14, life) * smoothstep(1.0, 0.86, life);
    // size and brightness both track energy, so they multiply -- keep each modest or a
    // loud passage saturates into one white ellipse
    gl_PointSize = clamp(u_psize * f * (0.45 + e*0.9 + u_beat*0.30*u_safe), 1.0, 42.0);

    // Two-armed logarithmic spiral density wave. Uniform density IS snow -- structure
    // is contrast, so the inter-arm gaps matter as much as the arms.
    float rr  = length(a_pos.xz) + 1e-3;
    float th  = atan(a_pos.z, a_pos.x);
    float arm = cos(2.0*(th - log(rr)*u_armTwist) + u_time*0.15);
    float dens = 0.42 + 0.58*smoothstep(-0.25, 0.95, arm);
    // a ring that expands outward on each beat: one synchronised event the whole
    // cloud takes part in, which is what "coordinated" actually looks like
    float shock = exp(-abs(rr - u_shockR)*7.0) * u_shockA;
    vec3 col = mix(u_c2, u_c1, clamp(e*1.6 + spd*0.30, 0.0, 1.0));
    col = hueShift(col, u_hue + spd*0.22 + a_dat.y*0.25);
    // hot fast streaks. Threshold raised with the rebuild: mean speed measured 2.4-3.3
    // now (was ~1.8), so at the old 1.1..2.8 window this fired on nearly every particle
    // and stopped being a highlight at all.
    col += vec3(1.0,0.94,0.82) * smoothstep(2.6, 5.0, spd) * 0.7;
    col += mix(u_c1, vec3(1.0,0.96,0.88), 0.5) * shock * 1.6;          // shockwave crest
    float depth = smoothstep(7.0, 1.0, z);                             // far particles recede
    // per-particle brightness stays LOW: with 100k+ additive sprites the image is built
    // by accumulation, and anything per-sprite gets multiplied by the overlap count.
    // Per-sprite brightness comes DOWN as the cloud comes into frame, which is not a
    // contradiction: 33% -> ~88% on canvas, concentrated into a much smaller screen
    // area, is roughly 4x the on-screen particle density, and these are additive, so
    // brightness gets multiplied by the overlap count. Same trap as the nebula's
    // radius distribution -- fixing the geometry is what forces the photometry down.
    v_col = vec4(col * (0.028 + e*0.135 + u_burst*0.09 + u_coil*0.035) * dens,
                 fade*depth*u_exposure);
  }`;
  const FRAG_PTS = `#version 300 es
  precision highp float;
  in vec4 v_col;
  out vec4 fragColor;
  void main(){
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d,d)*4.0;
    if (r2 > 1.0) discard;
    fragColor = vec4(v_col.rgb * exp(-r2*3.0) * v_col.a, 1.0);   // premultiplied, blend = ONE/ONE
  }`;

  // ---- post chain ----
  const FRAG_BRIGHT = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_src;
  uniform vec2  u_dstTexel;   // 1/dest size: gl_FragCoord is in DEST space, and the
  uniform vec2  u_srcTexel;   // dest is half-res, so uv must not use the source texel
  uniform float u_thr, u_knee;
  void main(){
    vec2 uv = gl_FragCoord.xy * u_dstTexel;
    // 4-tap box downsample first -> a stable bright-pass instead of a sparkling one
    vec3 c = texture(u_src, uv + u_srcTexel*vec2( 0.5, 0.5)).rgb
           + texture(u_src, uv + u_srcTexel*vec2(-0.5, 0.5)).rgb
           + texture(u_src, uv + u_srcTexel*vec2( 0.5,-0.5)).rgb
           + texture(u_src, uv + u_srcTexel*vec2(-0.5,-0.5)).rgb;
    c *= 0.25;
    float l = max(c.r, max(c.g, c.b));
    fragColor = vec4(c * smoothstep(u_thr, u_thr + u_knee, l), 1.0);
  }`;
  const FRAG_BLUR = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_src;
  uniform vec2 u_texel;    // 1/size
  uniform vec2 u_dir;      // (1,0) or (0,1), scaled by radius
  void main(){
    vec2 uv = gl_FragCoord.xy * u_texel;
    vec2 o1 = u_dir * u_texel * 1.3846153846;   // linear-sampled 9-tap gaussian
    vec2 o2 = u_dir * u_texel * 3.2307692308;
    vec3 c = texture(u_src, uv).rgb * 0.2270270270;
    c += (texture(u_src, uv+o1).rgb + texture(u_src, uv-o1).rgb) * 0.3162162162;
    c += (texture(u_src, uv+o2).rgb + texture(u_src, uv-o2).rgb) * 0.0702702703;
    fragColor = vec4(c, 1.0);
  }`;
  // ---- feedback trails: the previous frame, warped, kept alongside the new one ----
  // Combined with max(), NOT a sum. An additive feedback loop reaches a steady state of
  // scene/(1-decay) -- at decay 0.86 that is 7x the source, i.e. an instant white-out.
  // max() gives comet tails that can never exceed the brightness of what cast them.
  const FRAG_TRAIL = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_scene, u_prev;
  uniform vec2  u_res;
  uniform float u_decay, u_zoom, u_rot, u_hue;
  ${COMMON}
  void main(){
    vec2 uv = gl_FragCoord.xy / u_res;
    vec2 c  = uv - 0.5;
    float asp = u_res.x / u_res.y;
    // rotate/scale about centre in ASPECT-CORRECTED space, or the swirl goes oval.
    // u_zoom < 1 samples inward, so the history streams outward as it fades.
    vec2 p = vec2(c.x*asp, c.y);
    float ca = cos(u_rot), sa = sin(u_rot);
    p = mat2(ca, -sa, sa, ca) * p * u_zoom;
    vec2 q = vec2(p.x/asp, p.y) + 0.5;
    vec3 prev = texture(u_prev, q).rgb * u_decay;
    prev = hueShift(prev, u_hue);                 // trails drift in hue as they age
    fragColor = vec4(max(texture(u_scene, uv).rgb, prev), 1.0);
  }`;

  const FRAG_POST = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform sampler2D u_scene, u_bloom1, u_bloom2;
  uniform vec2  u_res;
  uniform float u_time, u_beat, u_safe, u_bloomAmt, u_ca, u_sat, u_grain;
  uniform float u_scan, u_scanN;   // scanline amplitude + how many lines tall the frame is
  ${COMMON}
  // ACES filmic curve: rolls highlights off instead of clipping them to white, which
  // is what finally lets the scene be bright WITHOUT blowing out.
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0);
  }
  void main(){
    vec2 uv = gl_FragCoord.xy / u_res;
    vec2 c  = uv - 0.5;
    vec2 dir = normalize(c + vec2(1e-5));
    // chromatic aberration, now one cheap texture fetch per channel (was 3x the scene)
    float ca = u_ca * (0.0018 + u_beat*0.010*u_safe) * (0.25 + length(c)*1.7);
    vec3 col = vec3(texture(u_scene, uv + dir*ca).r,
                    texture(u_scene, uv).g,
                    texture(u_scene, uv - dir*ca).b);
    col += (texture(u_bloom1, uv).rgb + texture(u_bloom2, uv).rgb*0.65) * u_bloomAmt;

    float l = dot(col, vec3(0.299,0.587,0.114));
    col = mix(vec3(l), col, u_sat);                         // saturation punch
    col = hueShift(col, sin(u_time*0.08)*0.10);             // slow spectral shimmer
    col = aces(col);
    col = pow(col, vec3(0.92));                             // small lift back into the mids

    // CRT scanlines. The period is expressed in FRAME HEIGHTS, not pixels: it used
    // to be sin(gl_FragCoord.y*2.2), a 2.86-pixel period, which is essentially Nyquist
    // at 1080p. Downscaling that (any share/upload re-encode) aliases it into moire,
    // and because H.264 subsamples chroma 4:2:0, a fine luma pattern comes back as
    // COLOURED fringing. Coarser, and softened further while recording (u_scan).
    col *= (1.0 - u_scan) + u_scan*sin(uv.y*u_scanN*6.28318);
    col *= 0.96 + 0.04*sin(u_time*48.0)*u_safe;             // flicker (off in calm mode)
    col *= smoothstep(1.35, 0.28, length(c)*2.0);           // vignette
    col += vec3(1.0) * u_beat * 0.06 * u_safe;              // transient beat pop (gated)
    col += (h21(uv*u_res + fract(u_time)*311.0) - 0.5) * u_grain;  // grain: hides 8-bit banding
    fragColor = vec4(max(col, 0.0), 1.0);
  }`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function makeProg(vs, fs, tfVaryings){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    if (tfVaryings) gl.transformFeedbackVaryings(p, tfVaryings, gl.SEPARATE_ATTRIBS);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  // ---- render targets ----
  let rtFmt = null, bloomThr = 1.0;       // {internal, type} chosen at init
  let sceneRT = null, bloom1 = [null,null], bloom2 = [null,null], trailRT = [null,null];
  let trailCur = 0, trailsOn = true;
  let RW = 0, RH = 0;                     // current internal render size
  function makeRT(w, h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, rtFmt.internal, w, h, 0, gl.RGBA, rtFmt.type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return ok ? {tex, fb, w, h} : null;
  }
  function freeRT(rt){ if (rt){ gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fb); } }
  function allocRTs(w, h){
    if (RW === w && RH === h && sceneRT) return;
    RW = w; RH = h;
    freeRT(sceneRT); for (const b of bloom1) freeRT(b); for (const b of bloom2) freeRT(b);
    for (const t of trailRT) freeRT(t);
    const hw = Math.max(2, w>>1), hh = Math.max(2, h>>1);
    const qw = Math.max(2, w>>2), qh = Math.max(2, h>>2);
    sceneRT  = makeRT(w, h);
    bloom1[0] = makeRT(hw, hh); bloom1[1] = makeRT(hw, hh);
    bloom2[0] = makeRT(qw, qh); bloom2[1] = makeRT(qw, qh);
    trailRT[0] = makeRT(w, h); trailRT[1] = makeRT(w, h);
    clearTrails();
  }
  // wipe the feedback history: fresh targets hold garbage, and a mode switch would
  // otherwise ghost the previous visual for a second
  function clearTrails(){
    if (!trailRT[0] || !trailRT[1]) return;
    for (const t of trailRT){
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
      gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    trailCur = 0;
  }
  // adaptive resolution: the internal render size tracks the measured frame time so a
  // phone degrades gracefully instead of dropping to a slideshow. The HUD and the
  // recorded canvas stay at full size -- only the shaded pixels shrink.
  let renderScale = 1, frameMs = 16.7, scaleFrames = 0;
  function adaptResolution(dt){
    frameMs = frameMs*0.9 + Math.min(dt, 100)*0.1;
    // NEVER downscale while recording. Capturing at 60fps drives frame times up, which
    // would make the scaler shrink the render and hand the encoder an upscaled, soft
    // image -- the export would look worse than the live view for no reason.
    if (recording) return;
    if (++scaleFrames < 45) return;
    scaleFrames = 0;
    const before = renderScale;
    if (frameMs > 21.5)      renderScale = Math.max(0.50, renderScale - 0.10);
    else if (frameMs < 17.0) renderScale = Math.min(1.00, renderScale + 0.05);
    if (Math.abs(renderScale - before) > 1e-3) allocRTs(Math.round(W*renderScale), Math.round(H*renderScale));
  }

  function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  function bindRT(rt){
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.fb : null);
    gl.viewport(0, 0, rt ? rt.w : W, rt ? rt.h : H);
  }

  let progWeb=null, progGas=null, progSim=null, progPts=null, progBright=null, progBlur=null, progPost=null;
  let progTrail=null, progEdge=null, progNode=null, progWater=null;
  let progFAdv=null, progFCurl=null, progFVort=null, progFDiv=null,
      progFPress=null, progFGrad=null, progFSplat=null, progFDraw=null;
  // instanced web geometry: a unit quad + a per-instance stream, uploaded each frame
  let edgeVAO=null, nodeVAO=null, edgeInstBuf=null, nodeInstBuf=null;
  let nebulaOK = true;
  function createRenderer(){
    gl = glCanvas.getContext('webgl2', { preserveDrawingBuffer:true, antialias:false, alpha:false });
    if (!gl) throw new Error('WebGL2 not supported in this browser.');
    // float render targets keep the scene HDR so the bright-pass has real highlights
    // to work with; without them everything clamps at 1.0 and bloom gets thin.
    const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
    rtFmt = hasFloat ? {internal: gl.RGBA16F, type: gl.HALF_FLOAT} : {internal: gl.RGBA8, type: gl.UNSIGNED_BYTE};
    allocRTs(W, H);
    if (!sceneRT){                                   // float RTs advertised but unusable
      rtFmt = {internal: gl.RGBA8, type: gl.UNSIGNED_BYTE};
      RW = RH = 0; allocRTs(W, H);
      if (!sceneRT) throw new Error('Could not create a render target.');
    }
    // with HDR targets real highlights live above 1.0, so the bright-pass can sit there;
    // on the LDR fallback everything clamps at 1.0 and the threshold has to drop below it.
    bloomThr = (rtFmt.type === gl.HALF_FLOAT) ? 1.0 : 0.72;

    progWeb    = makeProg(VERT, FRAG_WEB);
    progEdge   = makeProg(VERT_EDGE, FRAG_EDGE);
    progNode   = makeProg(VERT_NODE, FRAG_NODE);
    progBright = makeProg(VERT, FRAG_BRIGHT);
    progBlur   = makeProg(VERT, FRAG_BLUR);
    progTrail  = makeProg(VERT, FRAG_TRAIL);
    progPost   = makeProg(VERT, FRAG_POST);

    // fullscreen triangle (its own VAO, so particle attribute state never leaks in)
    quadVAO = gl.createVertexArray();
    gl.bindVertexArray(quadVAO);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    // ---- instanced web geometry ----
    // Corner strips are STATIC; only the per-instance stream is rewritten each frame.
    // Edge corners run 0..1 along the segment and -1..1 across it; node corners are a
    // plain centred quad.
    const mkInstanced = (corners, instStride, attrs, capBytes) => {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const cb = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, cb);
      gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const ib = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, ib);
      gl.bufferData(gl.ARRAY_BUFFER, capBytes, gl.DYNAMIC_DRAW);
      for (const [loc, size, offset] of attrs){
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, instStride, offset);
        gl.vertexAttribDivisor(loc, 1);            // advance once per instance, not per vertex
      }
      gl.bindVertexArray(null);
      return [vao, ib];
    };
    [edgeVAO, edgeInstBuf] = mkInstanced(
      new Float32Array([0,-1, 0,1, 1,-1, 1,1]), 24,
      [[1,4,0],[2,2,16]], MAXE*24);               // i_seg(vec4) + i_meta(vec2)
    [nodeVAO, nodeInstBuf] = mkInstanced(
      new Float32Array([-1,-1, -1,1, 1,-1, 1,1]), 16,
      [[1,4,0]], MAXN*16);                        // i_node(vec4)

    // ---- spectral waterfall: one ribbon strip, re-drawn per history row ----
    // ridge/skirt vertex pairs marching across the spectrum; the row comes from
    // gl_InstanceID, so the whole terrain is a single instanced draw.
    progWater = makeProg(VERT_WATER, FRAG_WATER);
    const wv = new Float32Array(WCOLS*4);
    for (let c=0;c<WCOLS;c++){
      const u = c/(WCOLS-1);
      wv[c*4]=u; wv[c*4+1]=0; wv[c*4+2]=u; wv[c*4+3]=1;
    }
    waterVAO = gl.createVertexArray();
    gl.bindVertexArray(waterVAO);
    const wb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, wb);
    gl.bufferData(gl.ARRAY_BUFFER, wv, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    histTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, histTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, WCOLS, WROWS, 0, gl.RED, gl.UNSIGNED_BYTE, histData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    // fft texture (unit 0 everywhere)
    const bins = analyser ? analyser.frequencyBinCount : 1024;
    fftTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fftTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, bins, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array(bins));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    // per-row musical state. NEAREST on purpose: these are discrete per-row events
    // (this beat, that key), and filtering would smear one row's beat into its neighbours.
    rowTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, rowTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1, WROWS, 0, gl.RGBA, gl.UNSIGNED_BYTE, rowData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    buildWaterBins(bins);

    // Fluid needs filterable float targets (advection is a bilinear fetch at a
    // backtraced position). Allowed to fail like the nebula: an old device must still
    // get the other engines rather than a dead page.
    if (rtFmt.type === gl.HALF_FLOAT){
      try {
        progFAdv=makeProg(VERT,FRAG_FADV);     progFCurl=makeProg(VERT,FRAG_FCURL);
        progFVort=makeProg(VERT,FRAG_FVORT);   progFDiv=makeProg(VERT,FRAG_FDIV);
        progFPress=makeProg(VERT,FRAG_FPRESS); progFGrad=makeProg(VERT,FRAG_FGRAD);
        progFSplat=makeProg(VERT,FRAG_FSPLAT); progFDraw=makeProg(VERT,FRAG_FDRAW);
        fluidOK = true;      // targets are sized lazily, once the canvas aspect is known
      } catch(e){ fluidOK = false; }
    }
    if (!fluidOK){
      const o = modeSel.querySelector('option[value="fluid"]');
      if (o) o.remove();
    }
    // The nebula is built separately and allowed to FAIL: if a device chokes on the
    // particle programs, the web mode still has to come up rather than taking the whole
    // visualizer down with it.
    try {
      progGas = makeProg(VERT, FRAG_GAS);
      progSim = makeProg(VERT_SIM, FRAG_SIM, ['v_pos','v_vel','v_dat']);
      progPts = makeProg(VERT_PTS, FRAG_PTS);
      initParticles(particleTarget());
      for (const p of [progGas, progSim, progPts]){ gl.useProgram(p); gl.uniform1i(U(p,'u_fft'), 0); }
    } catch(e) {
      nebulaOK = false;
      modeId = 'web';
      const opt = modeSel.querySelector('option[value="nebula"]');
      if (opt) opt.remove();
      modeSel.value = 'web';
    }
    gl.useProgram(progWeb); gl.uniform1i(U(progWeb,'u_fft'), 0);
  }

  // ---- post: bright-pass -> 2 blurred octaves -> composite to the canvas ----
  function blurInto(src, dst, dx, dy){
    bindRT(dst);
    gl.useProgram(progBlur);
    gl.uniform1i(U(progBlur,'u_src'), 1);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(U(progBlur,'u_texel'), 1/dst.w, 1/dst.h);
    gl.uniform2f(U(progBlur,'u_dir'), dx, dy);
    drawQuad();
  }
  // run the mode's frame through the feedback buffer; returns the RT post should read
  function applyTrails(S){
    const dst = trailRT[trailCur], prev = trailRT[1-trailCur];
    bindRT(dst);
    gl.disable(gl.BLEND);
    gl.useProgram(progTrail);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneRT.tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, prev.tex);
    gl.uniform1i(U(progTrail,'u_scene'), 1);
    gl.uniform1i(U(progTrail,'u_prev'), 2);
    gl.uniform2f(U(progTrail,'u_res'), dst.w, dst.h);
    // longer smear as tension builds; calm mode keeps it short so motion stays legible
    const decay = S.safe < 0.5 ? 0.70 : Math.min(0.93, 0.84 + S.coil*0.08);
    gl.uniform1f(U(progTrail,'u_decay'), decay);
    gl.uniform1f(U(progTrail,'u_zoom'), 1.0 - (0.004 + S.beat*0.010*S.safe));
    gl.uniform1f(U(progTrail,'u_rot'), (0.0015 + S.beat*0.005) * S.safe);
    gl.uniform1f(U(progTrail,'u_hue'), 0.02 + S.burst*0.05);
    drawQuad();
    trailCur = 1 - trailCur;
    return dst;
  }
  function postProcess(S, srcRT){
    gl.disable(gl.BLEND);
    // bright-pass into the half-res octave
    bindRT(bloom1[0]);
    gl.useProgram(progBright);
    gl.uniform1i(U(progBright,'u_src'), 1);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, srcRT.tex);
    gl.uniform2f(U(progBright,'u_dstTexel'), 1/bloom1[0].w, 1/bloom1[0].h);
    gl.uniform2f(U(progBright,'u_srcTexel'), 1/RW, 1/RH);
    // threshold above the diffuse range so only genuine HIGHLIGHTS bloom. Set it low
    // and the whole frame passes, gets smeared, and comes back as milk -- which is
    // exactly the white-out this pipeline exists to kill.
    gl.uniform1f(U(progBright,'u_thr'), bloomThr);
    gl.uniform1f(U(progBright,'u_knee'), 0.7);
    drawQuad();
    blurInto(bloom1[0], bloom1[1], 1, 0);
    blurInto(bloom1[1], bloom1[0], 0, 1);
    // one wider octave at quarter res -> a soft halo, not a fog bank
    blurInto(bloom1[0], bloom2[0], 1.5, 0);
    blurInto(bloom2[0], bloom2[1], 0, 1.5);

    bindRT(null);
    gl.useProgram(progPost);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, srcRT.tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bloom1[0].tex);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, bloom2[1].tex);
    gl.uniform1i(U(progPost,'u_scene'), 1);
    gl.uniform1i(U(progPost,'u_bloom1'), 2);
    gl.uniform1i(U(progPost,'u_bloom2'), 3);
    gl.uniform2f(U(progPost,'u_res'), W, H);
    gl.uniform1f(U(progPost,'u_time'), S.t);
    gl.uniform1f(U(progPost,'u_beat'), S.beat);
    gl.uniform1f(U(progPost,'u_safe'), S.safe);
    gl.uniform1f(U(progPost,'u_bloomAmt'), S.safe < 0.5 ? 0.26 : 0.42);
    gl.uniform1f(U(progPost,'u_ca'), 1.0);
    gl.uniform1f(U(progPost,'u_sat'), 1.45);
    // Per-frame random grain is the worst case for a video codec -- it is new detail in
    // every frame, so it eats the bitrate that should be describing the actual image.
    // Back it off while recording; on screen it stays at full strength.
    gl.uniform1f(U(progPost,'u_grain'), recording ? 0.005 : 0.018);
    // ~3.6px per line at 1080p, and shallower on a take -- high-contrast 1px detail is
    // the first thing a codec turns into shimmer, and it eats the bitrate too
    gl.uniform1f(U(progPost,'u_scan'),  recording ? 0.06 : 0.14);
    gl.uniform1f(U(progPost,'u_scanN'), 300.0);
    drawQuad();
    gl.activeTexture(gl.TEXTURE0);
  }

  // ---------------- Analysis helpers ----------------
  function band(lo,hi){ let s=0,n=0; for(let i=lo;i<hi&&i<freqData.length;i++){s+=freqData[i];n++;} return n? (s/n)/255 : 0; }
  let bassSmooth=0, beat=0, lastBeat=0, syncSmooth=0;
  // living "sync ratio": tracks energy but breathes with a slow organic wander,
  // so it reads like a telemetry gauge instead of pinning at 0.999. It also gently
  // modulates the neural web's energy each frame (the automatic version of nudging
  // the Sync slider), so the whole scene surges & settles on its own.
  let syncRatio = 0.6, syncWander = 0;
  // breathing: the web reads the song's ARC, not just loudness. Tension INTEGRATES
  // while energy is rising (a build), relaxes on plateaus/quiet, and releases in an
  // outward burst on a drop (a sharp energy jump). Tuned via an offline envelope sim.
  let energyFast = 0, energyMed = 0, energyLag = 0, coil = 0, burst = 0, releaseLock = 0;
  // reactive gain (auto): keeps brightness consistent across tracks, no user knob
