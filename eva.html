<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGI — EVA Sound Visualizer</title>
<style>
  :root {
    --bg: #050506;
    --panel: rgba(12, 10, 8, 0.82);
    --border: rgba(255, 140, 26, 0.25);
    --amber: #ff8c1a;
    --amber-dim: #a85c10;
    --text: #ffce9e;
    --muted: #8a6a44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0; padding: 16px;
  }
  /* The GL canvas renders offscreen-ish; the 2D canvas is what you see + record */
  #gl { display: none; }
  #view {
    background: #000;
    border-radius: 6px;
    cursor: grab;
    touch-action: none;   /* let us handle drag on touch without scrolling */
    box-shadow: 0 0 0 1px rgba(255,140,26,0.2), 0 24px 70px rgba(0,0,0,0.7),
                0 0 60px rgba(255,80,20,0.08);
    max-width: 100%; max-height: 100%;
  }

  #hint {
    position: absolute; inset: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    pointer-events: none; text-align: center; color: var(--muted);
    transition: opacity 0.4s; letter-spacing: 2px;
  }
  #hint .big { font-size: 20px; font-weight: 700; color: var(--amber); text-transform: uppercase; }
  #hint .small { font-size: 12px; }
  #hint.hidden { opacity: 0; }

  #controls, #seekbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--panel);
    backdrop-filter: blur(16px); border-top: 1px solid var(--border);
    flex-wrap: wrap; justify-content: center;
  }
  #seekbar { padding: 7px 20px; gap: 12px; }
  #seekbar.disabled { opacity: 0.4; }
  .group { display: flex; align-items: center; gap: 8px; }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  button, .filebtn {
    background: rgba(255,140,26,0.08); color: var(--text);
    border: 1px solid var(--border); padding: 8px 13px; border-radius: 4px;
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; user-select: none;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover, .filebtn:hover { background: rgba(255,140,26,0.2); }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--amber); border-color: transparent; color: #1a0d00; }
  button.rec { background: #e2231a; border-color: transparent; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }

  label.field { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; letter-spacing: 1px; text-transform: uppercase; }
  select {
    background: rgba(255,140,26,0.06); color: var(--text);
    border: 1px solid var(--border); padding: 7px 9px; border-radius: 4px;
    font-family: inherit; font-size: 12px; cursor: pointer;
  }
  input[type=range] { accent-color: var(--amber); cursor: pointer; }
  #seek { flex: 1; height: 5px; }
  input[type=file] { display: none; }
  .tlabel { font-size: 12px; color: var(--muted); min-width: 44px; }
  .tlabel:last-child { text-align: right; }
  #recDot { display: none; width: 9px; height: 9px; border-radius: 50%; background: #e2231a; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #timer { font-size: 12px; color: var(--muted); min-width: 42px; }
  .brand { font-weight: 700; letter-spacing: 3px; font-size: 14px; color: var(--amber); margin-right: 4px; }

  @media (max-width: 760px) { .brand, .sep { display: none; } #controls { padding: 9px; gap: 6px; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="view"></canvas>
    <div id="hint">
      <div class="big">// SOUND ONLY</div>
      <div class="small">DROP AUDIO FILE · OR USE CONTROLS BELOW · OR MICROPHONE</div>
    </div>
  </div>

  <div id="seekbar" class="disabled">
    <span id="curTime" class="tlabel">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled>
    <span id="durTime" class="tlabel">0:00</span>
  </div>

  <div id="controls">
    <a class="brand" href="index.html" title="← All visualizers" style="text-decoration:none;color:inherit">NERV</a>
    <div class="group">
      <label class="filebtn" for="fileInput">▷ Load</label>
      <input type="file" id="fileInput" accept="audio/*">
      <button id="micBtn">◉ Mic</button>
      <button id="playBtn" class="primary" disabled>▶ Play</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <label class="field">Unit
        <select id="themeSel">
          <option value="0">01 · NERV Amber</option>
          <option value="1">02 · Unit-01</option>
          <option value="2">03 · Pattern Blue</option>
          <option value="3">04 · Blood</option>
          <option value="4">05 · Testify ✦</option>
        </select>
      </label>
      <label class="field">Format
        <select id="ratioSel">
          <option value="9:16" selected>Vert 9:16</option>
          <option value="1:1">Square 1:1</option>
          <option value="16:9">Wide 16:9</option>
        </select>
      </label>
      <button id="netBtn" class="primary">🧠 Neural</button>
      <label class="field">Nodes <input type="range" id="nodeSlider" min="0" max="1" step="0.01" value="0.8"></label>
      <button id="safeBtn" title="Reduce flashing & motion">🕊 Calm</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="fpBtn" title="Song fingerprint — a unique portrait of this track">◎ Print</button>
      <button id="fpSaveBtn" title="Download the fingerprint as a PNG">⤓ Save</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="recBtn" class="rec" disabled>● Rec</button>
      <span id="recDot"></span>
      <span id="timer">0:00</span>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ============================================================
  //  MAGI / EVA sound visualizer
  //  - GPU fragment shader (WebGL2) renders the reactive scene.
  //  - A 2D canvas blits the GPU frame + draws the NERV telemetry
  //    HUD on top, and is the single surface we record.
  //  NOTE: to move this to WebGPU later, only createRenderer() and
  //  the shader source need to change; everything else is portable.
  // ============================================================

  const glCanvas  = document.getElementById('gl');
  const view      = document.getElementById('view');
  const vctx      = view.getContext('2d');
  const hint      = document.getElementById('hint');
  const fileInput = document.getElementById('fileInput');
  const micBtn    = document.getElementById('micBtn');
  const playBtn   = document.getElementById('playBtn');
  const themeSel  = document.getElementById('themeSel');
  const ratioSel  = document.getElementById('ratioSel');
  const recBtn    = document.getElementById('recBtn');
  const recDot    = document.getElementById('recDot');
  const timerEl   = document.getElementById('timer');
  const netBtn    = document.getElementById('netBtn');
  const safeBtn   = document.getElementById('safeBtn');
  const nodeSlider= document.getElementById('nodeSlider');
  const fpBtn     = document.getElementById('fpBtn');
  const fpSaveBtn = document.getElementById('fpSaveBtn');
  const seekbar   = document.getElementById('seekbar');
  const seek      = document.getElementById('seek');
  const curTime   = document.getElementById('curTime');
  const durTime   = document.getElementById('durTime');

  // Themes: [hot edge color, base edge color, HUD css color]
  const THEMES = [
    { c1:[1.0,0.55,0.12], c2:[0.95,0.10,0.05], hud:'#ff8c1a' }, // NERV amber
    { c1:[0.55,1.0,0.18], c2:[0.55,0.12,0.95], hud:'#8cff3c' }, // Unit-01 green/purple
    { c1:[0.35,0.75,1.0], c2:[0.10,0.25,0.95], hud:'#4cc9ff' }, // Pattern Blue
    { c1:[1.0,0.25,0.15], c2:[0.55,0.02,0.02], hud:'#ff4530' }, // Blood
    { c1:[1.0,0.82,0.20], c2:[1.0,0.12,0.70], hud:'#ffcf3a' }, // Testify (gold + magenta, hyper-vivid)
  ];

  // ---------------- Audio ----------------
  let audioCtx=null, analyser=null, sourceNode=null, mediaEl=null, mediaElSrc=null, micStream=null;
  let freqData=null, timeData=null, destNode=null, currentURL=null;

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.80;
    freqData = new Uint8Array(analyser.frequencyBinCount); // 1024
    timeData = new Uint8Array(analyser.fftSize);
    destNode = audioCtx.createMediaStreamDestination();
  }
  function disconnectSource() {
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode=null; }
    if (micStream) { micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    if (mediaEl) mediaEl.pause();
  }
  function connect(node, toSpeakers) {
    node.connect(analyser);
    analyser.connect(destNode);
    if (toSpeakers) analyser.connect(audioCtx.destination);
  }
  function loadFile(file) {
    ensureAudio(); disconnectSource();
    if (currentURL) URL.revokeObjectURL(currentURL);
    currentURL = URL.createObjectURL(file);
    if (!mediaEl) {
      mediaEl = new Audio(); mediaEl.crossOrigin='anonymous';
      mediaEl.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmt(mediaEl.duration);
        seek.disabled=false; seekbar.classList.remove('disabled');
      });
      mediaEl.addEventListener('timeupdate', () => {
        if (seeking || !mediaEl.duration) return;
        seek.value = (mediaEl.currentTime/mediaEl.duration)*1000;
        curTime.textContent = fmt(mediaEl.currentTime);
      });
      // an <audio> element may only ever have ONE MediaElementSource -- create it
      // once and reuse it, or a second load throws InvalidStateError (drop #2 fails).
      mediaElSrc = audioCtx.createMediaElementSource(mediaEl);
    }
    mediaEl.src = currentURL; mediaEl.loop=false;
    mediaEl.onended = () => { playBtn.textContent='▶ Play'; };
    sourceNode = mediaElSrc;
    connect(sourceNode, true);
    playBtn.disabled=false; recBtn.disabled=false;
    fpReset(file.name);
    hint.classList.add('hidden'); startLoop(); play();
  }
  async function useMic() {
    ensureAudio();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      disconnectSource(); micStream=stream;
      sourceNode = audioCtx.createMediaStreamSource(stream);
      connect(sourceNode, false);
      playBtn.disabled=true; recBtn.disabled=false;
      seek.disabled=true; seekbar.classList.add('disabled');
      curTime.textContent=durTime.textContent='0:00';
      fpReset('LIVE INPUT');
      hint.classList.add('hidden'); startLoop();
    } catch(e) { alert('Microphone access failed: '+e.message); }
  }
  function play() {
    if (!mediaEl) return;
    if (audioCtx.state==='suspended') audioCtx.resume();
    if (mediaEl.paused) { mediaEl.play(); playBtn.textContent='❚❚ Pause'; }
    else { mediaEl.pause(); playBtn.textContent='▶ Play'; }
  }
  function fmt(s){ if(!isFinite(s))return '0:00'; s=Math.floor(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

  // ---------------- Sizing ----------------
  let W=0, H=0;
  function resize() {
    const [rw,rh] = ratioSel.value.split(':').map(Number);
    const stage = document.getElementById('stage');
    const aw = stage.clientWidth-32, ah = stage.clientHeight-32;
    let cw=aw, ch=cw*rh/rw;
    if (ch>ah) { ch=ah; cw=ch*rw/rh; }
    view.style.width=cw+'px'; view.style.height=ch+'px';
    H = 1080; W = Math.round(1080*rw/rh);          // GPU handles full 1080p
    glCanvas.width=W; glCanvas.height=H;
    view.width=W; view.height=H;
    if (gl) gl.viewport(0,0,W,H);
  }

  // ---------------- WebGL2 renderer ----------------
  let gl=null, prog=null, fftTex=null, uni={};
  const VERT = `#version 300 es
  in vec2 a_pos;
  void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

  const FRAG = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2  u_res;
  uniform float u_time;
  uniform float u_bass;
  uniform float u_mid;
  uniform float u_treble;
  uniform float u_beat;
  uniform vec3  u_c1;      // hot edge color
  uniform vec3  u_c2;      // base edge color
  uniform sampler2D u_fft; // 1D-ish frequency texture

  const int MAXN = 48;     // neural nodes (hard cap of the uniform array)
  const int MAXE = 96;     // neural edges
  uniform vec3  u_nodes[MAXN];  // xy = position (uv space), z = energy 0..1
  uniform vec4  u_edges[MAXE];  // (x1,y1) -> (x2,y2); padded entries use x>90
  uniform float u_net;          // neural-net master intensity 0..1
  uniform float u_exposure;     // auto-exposure: <1 during sustained-loud passages
  uniform float u_safe;         // 1 = full effects, low = reduced motion/flashing
  uniform float u_coh;          // 0..1 coalescence: background quiets so the figure reads
  uniform float u_coil;         // 0..1 tension winding up (build) -> brighter
  uniform float u_burst;        // 0..1 release exhale -> flash + outward pop
  const int MAXF = 24;          // silhouette outline points (closed polygon)
  uniform vec2  u_fig[MAXF];    // figure outline in uv space (already spun/placed by JS)
  uniform int   u_figN;         // active outline point count (0 = no figure)
  uniform vec3  u_figA;         // figure body color
  uniform vec3  u_figB;         // figure rim / accent color

  float hexDist(vec2 p){ p = abs(p); return max(dot(p, vec2(0.866025,0.5)), p.y); }
  vec4 hexCoords(vec2 uv){
    vec2 r = vec2(1.0, 1.732050);
    vec2 h = r*0.5;
    vec2 a = mod(uv, r) - h;
    vec2 b = mod(uv - h, r) - h;
    vec2 gv = dot(a,a) < dot(b,b) ? a : b;
    float y = 0.5 - hexDist(gv);
    vec2 id = uv - gv;
    return vec4(gv.x, y, id);
  }
  float fftAt(float t){ return texture(u_fft, vec2(clamp(t,0.0,1.0), 0.5)).r; }

  // rotate a color around the value axis -> vivid hue shimmer
  vec3 hueShift(vec3 c, float a){
    const vec3 k = vec3(0.57735);
    float cs = cos(a), sn = sin(a);
    return c*cs + cross(k,c)*sn + k*dot(k,c)*(1.0-cs);
  }
  // anime "speed lines" radiating from center, strongest at the edges
  float speedLines(vec2 uv, float t){
    float a = atan(uv.y, uv.x);
    float r = length(uv);
    float l = sin(a*64.0 + sin(a*11.0 + t)*2.0);
    l = smoothstep(0.55, 1.0, l);
    return l * smoothstep(0.30, 1.15, r);
  }

  // distance from point p to segment a-b
  float segDist(vec2 p, vec2 a, vec2 b){
    vec2 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/(dot(ba,ba)+1e-5), 0.0, 1.0);
    return length(pa - ba*h);
  }
  // MAGI neural web: glowing synapse lines with data packets racing along them
  vec3 neuralNet(vec2 uv, float t){
    vec3 col = vec3(0.0);
    vec3 lineCol = mix(u_c1, vec3(1.0), 0.35);
    for (int i=0;i<MAXE;i++){
      vec4 e = u_edges[i];
      if (e.x > 90.0) continue;                       // padded / inactive edge
      float d = segDist(uv, e.xy, e.zw);
      col += lineCol * smoothstep(0.006,0.0,d) * 0.22; // soft synapse
      col += lineCol * smoothstep(0.0016,0.0,d) * 0.6; // bright core
      // fast-moving data packets (multiple per edge, speed surges on beats)
      float seed = fract(sin(float(i)*13.19)*43758.5453);
      for (int k=0;k<2;k++){
        float sp  = 0.7 + seed*1.1 + u_beat*1.8*u_safe;
        float pos = fract(t*sp + seed + float(k)*0.5);
        float pd  = length(uv - mix(e.xy, e.zw, pos));
        col += vec3(1.0,0.96,0.86) * smoothstep(0.013,0.0,pd) * (0.85 + u_beat);
      }
    }
    for (int i=0;i<MAXN;i++){
      vec3 n = u_nodes[i];
      if (n.x > 90.0) continue;
      float nd = length(uv - n.xy);
      float en = n.z;                                    // energy (incl. flicker spark)
      // core dot: pops bigger & brighter with energy + beat ("jump")
      float coreSz = 0.016 + en*0.03 + u_beat*0.012*u_safe;
      col += mix(u_c2, u_c1, en) * smoothstep(coreSz, 0.0, nd) * (0.5 + en*2.2);
      col += u_c1 * smoothstep(0.07, 0.0, nd) * en * 0.5;  // node halo
      // per-node "gas": a small cloud of drifting sparks + a soft nebula that
      // breathes with the node's energy. near-field gate keeps it cheap.
      if (nd < 0.16){
        float seed = fract(sin(float(i)*7.31)*43758.5453);
        float hz = 0.0;
        for (int k=0;k<4;k++){
          float fk = float(k);
          float a  = seed*6.2831 + fk*1.9 + t*(0.6 + seed*1.4) + sin(t*1.7 + fk)*0.6;
          float rad = (0.02 + en*0.06 + u_beat*0.02*u_safe) * (0.5 + fk*0.4);
          float pd = length(uv - (n.xy + vec2(cos(a), sin(a))*rad));
          hz += smoothstep(0.012, 0.0, pd);
        }
        vec3 gasCol = mix(u_c1, vec3(1.0,0.95,0.85), 0.4);
        col += gasCol * hz * (0.25 + en*1.5);
        float haze = smoothstep(0.14, 0.0, nd) - smoothstep(0.05, 0.0, nd);
        col += mix(u_c2, u_c1, en) * haze * en * 0.6;      // nebular puff
      }
    }
    return col;
  }

  // signed distance to the closed figure polygon (negative = inside). Winding
  // test (iq) gives a solid fillable silhouette regardless of node count.
  float figSDF(vec2 p){
    float d = 1e9, s = 1.0;
    int n = u_figN;
    for (int i=0;i<MAXF;i++){
      if (i>=n) break;
      int j = i==0 ? n-1 : i-1;
      vec2 a = u_fig[i], b = u_fig[j];
      d = min(d, segDist(p,a,b));
      bvec3 c = bvec3(p.y>=a.y, p.y<b.y, (b.x-a.x)*(p.y-a.y) > (b.y-a.y)*(p.x-a.x));
      if (all(c) || all(not(c))) s = -s;
    }
    return d*s;
  }
  // A THIN, translucent wireframe ghost -- just a whisper of geometry behind the web.
  // The neural net is the hero; this is a faint hint, never a solid form.
  vec3 figure(vec2 uv, float t){
    if (u_coh < 0.01 || u_figN < 3) return vec3(0.0);
    float sdf  = figSDF(uv);
    float line = smoothstep(0.0035, 0.0, abs(sdf));        // hairline outline only
    float fill = smoothstep(0.0, -0.02, sdf);              // interior mask (soft edge)
    vec3 col  = u_figB * line * (0.30 + u_beat*0.25);      // faint thin wire
    col += u_figA * fill * 0.03 * (0.5 + u_bass*0.5);      // barely-there interior tint
    return col * u_coh * 0.5;
  }

  vec3 scene(vec2 uv, float t){
    vec3 col = vec3(0.0);
    float d = length(uv);

    // --- AT-field hex grid ---
    float scale = 6.5 + u_bass*2.5;
    float ang = t*0.07 + u_bass*0.5 + u_coil*0.6 + 0.25*sin(t*0.13);   // spins up as tension builds
    mat2 rot = mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
    vec2 huv = rot * uv * scale;
    vec4 hc = hexCoords(huv);
    // thin, crisp cell edge (hc.y is ~0 at edges, ~0.5 at centers)
    float edge = smoothstep(0.035, 0.0, hc.y);
    float cellR = length(hc.zw);                       // ring index from center
    float f = fftAt(cellR*0.045);                      // audio energy for this ring
    float ripple = 0.5 + 0.5*sin(cellR*0.9 - t*3.2);   // expanding pulse
    // low ambient so idle stays dark/clean; edges light up with audio + beats
    float glow = edge * (0.05 + f*2.4 + u_beat*ripple*2.6*u_safe + u_burst*1.2);   // release flashes the field
    vec3 hexCol = mix(u_c2, u_c1, clamp(f*1.6 + u_beat*0.5, 0.0, 1.0));
    hexCol = hueShift(hexCol, sin(cellR*0.30 + t*0.20)*0.16 + f*0.25); // subtle shimmer
    // AT-field recedes as the web coalesces into a silhouette, so the figure reads
    float hexDim = 1.0 - u_coh*0.4;
    col += hexCol * glow * hexDim;
    // fill a cell only when its band is strong (f squared -> nothing at idle)
    col += hexCol * smoothstep(0.30, 0.46, hc.y) * f*f * 0.5 * hexDim;
    // each cell carries its own triangle that spins at its OWN rate (per-cell hash)
    // -> the field rotates individually, not in unison. Rate rises with the music.
    vec2 gv = huv - hc.zw;                              // local coord within this cell
    float cid = fract(sin(dot(hc.zw, vec2(12.9898,78.233)))*43758.5453);
    float cang = t*(0.5 + cid*2.2)*(0.5 + u_bass*1.6 + u_coil*1.8) + cid*6.2831;  // spins up with tension
    float pa = atan(gv.x, gv.y) + cang;                // rotate the glyph
    float pr = length(gv);
    float k = 6.2831/3.0;                              // 3 sides -> triangle
    float poly = cos(floor(0.5 + pa/k)*k - pa) * pr;   // regular-polygon distance (iq)
    float triSz = 0.14 + f*0.05;
    float tri = smoothstep(0.018, 0.0, abs(poly - triSz));
    col += hexCol * tri * (0.12 + f*1.8 + u_beat*0.4*u_safe + u_burst*0.7) * hexDim;

    // --- central eye / S2 core ---
    float coreR = 0.10 + u_bass*0.14 + u_beat*0.05 + u_burst*0.06;   // core swells on the release
    float core  = smoothstep(coreR, 0.0, d);
    float iris  = 0.5 + 0.5*sin(d*46.0 - t*2.2);
    vec3 coreCol = mix(u_c1, vec3(1.0,0.92,0.72), core);
    col += coreCol * (core * (0.85 + iris*0.35));
    col += u_c1 * smoothstep(coreR*4.5, 0.0, d) * (0.35 + u_bass*0.5); // bloom halo
    // rotating targeting ring

  // ---------------- Analysis helpers ----------------
  function band(lo,hi){ let s=0,n=0; for(let i=lo;i<hi&&i<freqData.length;i++){s+=freqData[i];n++;} return n? (s/n)/255 : 0; }

  let energyFast = 0, energyMed = 0, energyLag = 0, coil = 0, burst = 0, releaseLock = 0;

    // with no user control. Replaces the old manual "Sync" slider (which over-drove
    // the scene into an unreadable white-out).
    const rawB = band(1,18), rawM = band(40,180), rawT = band(300,700);
    const rawE = rawB*0.6 + rawM*0.3 + rawT*0.1;

    const mid  = Math.min(rawM*g, 1.4);
    const treb = Math.min(rawT*g, 1.4);

      // baseline -> a big beat -> dramatic movement; a soft tick stays small.

      beat = Math.max(beat, 0.4 + strength*0.85);   // ~0.4 (soft) .. ~1.25 (profound)

    energyLag  = energyLag *0.92 + energy*0.08;      // jump reference
    const slope = energyFast - energyMed;            // > 0 while the track is building

    vctx.shadowColor = amber; vctx.shadowBlur = 6*s;

    // corner brackets
    vctx.strokeStyle = amber; vctx.lineWidth = 2*s;
    const m = 26*s, L = 46*s;
    bracket(m,m,1,1,L); bracket(W-m,m,-1,1,L); bracket(m,H-m,1,-1,L); bracket(W-m,H-m,-1,-1,L);

    // thin frame
    vctx.globalAlpha = 0.5; vctx.lineWidth = 1*s;
    vctx.strokeRect(m,m,W-2*m,H-2*m);
    vctx.globalAlpha = 1;

    vctx.fillStyle = amber;
    // top-left block
    vctx.font = `bold ${Math.round(22*s)}px "Courier New", monospace`;
    vctx.fillText('NERV', m+14*s, m+12*s);
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    vctx.fillStyle = 'rgba(255,206,158,0.7)';
    vctx.fillText('MAGI SYSTEM // CASPER-3', m+14*s, m+40*s);
    vctx.fillText('EMERGENCY MODE : STANDBY', m+14*s, m+56*s);

    // top-right SYNC ratio (living gauge; +tiny readout jitter so it looks live)
    const sync = Math.min(0.999, syncRatio + (Math.random()-0.5)*0.0015);
    vctx.textAlign = 'right';
    vctx.fillStyle = amber;
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    vctx.fillText('SYNC RATIO', W-m-14*s, m+12*s);
    vctx.font = `bold ${Math.round(30*s)}px "Courier New", monospace`;
    vctx.fillText(sync.toFixed(3), W-m-14*s, m+26*s);
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    vctx.fillStyle = 'rgba(255,206,158,0.7)';
    // pattern lock readout when the web coalesces into a silhouette
    vctx.fillText(coh > 0.45 ? 'PATTERN: '+SHAPES[shapeIdx].name : 'HARMONICS NOMINAL',
                  W-m-14*s, m+62*s);
    vctx.textAlign = 'left';

    // left vertical spectrum bars
    const bars = 24, bx = m+16*s, bw = 8*s, bh = 5*s, gap = 3*s;
    const startY = H/2 - (bars*(bh+gap))/2;
    for (let i=0;i<bars;i++){
      const idx = Math.floor(Math.pow(i/bars,1.5)*220)+2;
      const v = Math.min((freqData[idx]/255)*inputGain, 1);
      const lit = Math.round(v*14);
      for (let j=0;j<14;j++){
        vctx.globalAlpha = j<lit ? 1 : 0.12;
        vctx.fillStyle = j>10 ? '#e2231a' : amber;
        vctx.fillRect(bx + j*(bw+2*s), startY + i*(bh+gap), bw, bh);
      }
    }
    vctx.globalAlpha = 1;

    // right scrolling hex telemetry
    vctx.fillStyle = 'rgba(255,206,158,0.35)';
    vctx.font = `${Math.round(11*s)}px "Courier New", monospace`;
    scrollY = (scrollY + 0.6) % (14*s);
    const colX = W-m-150*s;
    for (let r=0;r<18;r++){
      let str='';
      for (let c=0;c<10;c++) str += Math.floor(Math.random()*16).toString(16).toUpperCase();
      vctx.globalAlpha = 0.25 + 0.2*Math.sin(r*0.5+now/400);
      vctx.fillText(str, colX, H/2 - 120*s + r*14*s + scrollY);
    }
    vctx.globalAlpha = 1;

    // bottom-left mission clock
    vctx.fillStyle = amber;
    vctx.font = `${Math.round(13*s)}px "Courier New", monospace`;
    const tc = mediaEl && mediaEl.currentTime ? mediaEl.currentTime : (now/1000);
    const mm = String(Math.floor(tc/60)).padStart(2,'0');
    const ss = String(Math.floor(tc%60)).padStart(2,'0');
    const ff = String(Math.floor((tc%1)*30)).padStart(2,'0');
    vctx.fillText(`T-${mm}:${ss}:${ff}`, m+14*s, H-m-30*s);
    vctx.fillStyle='rgba(255,206,158,0.6)';
    vctx.fillText('BLOOD TYPE: BLUE', m+120*s, H-m-30*s);

    // warning flash on strong beats
    if (beat > 0.55) {
      vctx.globalAlpha = Math.min(1, beat);
      vctx.fillStyle = '#e2231a';
      vctx.shadowColor = '#e2231a'; vctx.shadowBlur = 16*s;
      vctx.textAlign = 'center';
      vctx.font = `bold ${Math.round(34*s)}px "Courier New", monospace`;
      vctx.fillText('警告  PATTERN BLUE', W/2, H-m-52*s);
      vctx.font = `${Math.round(13*s)}px "Courier New", monospace`;
      vctx.fillText('AT-FIELD DETECTED', W/2, H-m-14*s);
      vctx.textAlign = 'left';
    }
    vctx.restore();
  }
  function bracket(x,y,sx,sy,L){
    vctx.beginPath();
    vctx.moveTo(x, y+sy*L); vctx.lineTo(x, y); vctx.lineTo(x+sx*L, y);
    vctx.stroke();
  }

  // ---------------- Main loop ----------------
  let running=false, startT=performance.now();
  function loop(now){
    if (!running) return;
    requestAnimationFrame(loop);
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
    const a = analyze(now);
    const th = THEMES[+themeSel.value];

    // upload fft to GPU
    gl.bindTexture(gl.TEXTURE_2D, fftTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, freqData.length, 1, gl.RED, gl.UNSIGNED_BYTE, freqData);
    // uniforms
    gl.uniform2f(uni.u_res, W, H);
    gl.uniform1f(uni.u_time, (now-startT)/1000);
    gl.uniform1f(uni.u_bass, a.bass);
    gl.uniform1f(uni.u_mid, a.mid);
    gl.uniform1f(uni.u_treble, a.treb);
    gl.uniform1f(uni.u_beat, beat);
    gl.uniform3fv(uni.u_c1, th.c1);
    gl.uniform3fv(uni.u_c2, th.c2);
    gl.uniform1f(uni.u_exposure, exposure(a.energy));
    gl.uniform1f(uni.u_safe, safeVal());
    applyNet(now);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // composite: GPU frame -> 2D canvas, then HUD on top
    vctx.drawImage(glCanvas, 0, 0, W, H);
    drawHUD(a, now);
    // accrete the song fingerprint (and, in print mode, show it on top)
    const songT = (mediaEl && isFinite(mediaEl.currentTime)) ? mediaEl.currentTime : (now-startT)/1000;
    fpTick(songT);
    if (fpMode) drawFingerprint();
  }
  function startLoop(){ if (running) return; running=true; startT=performance.now(); requestAnimationFrame(loop); }

  // ---------------- Song fingerprint (persistent per-track portrait) ----------------
  // A polar spectrogram accreted over the whole track: angle advances with song time
  // (~one turn per TURN_SECS), radius maps the spectrum (bass inner -> treble outer),
  // beats leave outer ticks, drops leave bright radial flares. The finished ring is a
  // unique, screenshot-able portrait of that specific song.
  const FP_SIZE = 1024, TURN_SECS = 175;
  const fpCanvas = document.createElement('canvas'); fpCanvas.width = fpCanvas.height = FP_SIZE;
  const fpctx = fpCanvas.getContext('2d');
  let fpMode = false, fpName = '', fpLastAngle = -Math.PI/2, fpBeatPk = 0, fpBurstPk = 0;
  function rgbOf(c, s){ return `rgb(${Math.min(255,c[0]*s*255)|0},${Math.min(255,c[1]*s*255)|0},${Math.min(255,c[2]*s*255)|0})`; }
  function fpReset(name){
    fpctx.clearRect(0,0,FP_SIZE,FP_SIZE);
    fpName = name || ''; fpLastAngle = -Math.PI/2; fpBeatPk = 0; fpBurstPk = 0;
  }
  function fpTick(songT){
    fpBeatPk = Math.max(fpBeatPk, beat); fpBurstPk = Math.max(fpBurstPk, burst);
    const angle = -Math.PI/2 + (songT/TURN_SECS)*Math.PI*2;
    if (angle - fpLastAngle < 0.006) return;          // tile slices, avoid over-accumulation
    fpLastAngle = angle;
    const th = THEMES[+themeSel.value];
    const cx = FP_SIZE/2, cy = FP_SIZE/2, R0 = FP_SIZE*0.14, R1 = FP_SIZE*0.46, B = 60, slice = (R1-R0)/B;
    fpctx.save();
    fpctx.translate(cx, cy); fpctx.rotate(angle);
    fpctx.globalCompositeOperation = 'lighter';
    for (let k=0;k<B;k++){
      const idx = Math.floor(1 + Math.pow(k/B, 1.7)*480);   // log-ish: lows inner, highs outer
      const amp = freqData[idx]/255;
      if (amp < 0.05) continue;
      const r = R0 + (k/B)*(R1-R0);
      const mixC = th.c2.map((v,i)=> v + (th.c1[i]-v)*amp);
      fpctx.fillStyle = rgbOf(mixC, 0.5 + amp*0.5);
      fpctx.globalAlpha = 0.15 + amp*0.6;
      fpctx.fillRect(-1.7, -(r+slice), 3.4, slice+1.2);
    }
    fpctx.globalAlpha = 1;
    if (fpBeatPk > 0.4){ fpctx.fillStyle = rgbOf(th.c1, 1); fpctx.fillRect(-1.2, -(R1+14), 2.4, 12); }
    if (fpBurstPk > 0.15){                              // a drop carves a bright flare through the ring
      fpctx.fillStyle = `rgba(255,250,238,${Math.min(1, fpBurstPk*0.7)})`;
      fpctx.fillRect(-1.8, -(R1+26), 3.6, (R1-R0)+30);
    }
    fpctx.restore();
    fpBeatPk = 0; fpBurstPk = 0;
  }
  function drawFingerprint(){
    vctx.save();
    vctx.fillStyle = 'rgba(6,5,9,0.94)'; vctx.fillRect(0,0,W,H);
    const s = Math.min(W,H)*0.9, x = (W-s)/2, y = (H-s)/2;
    vctx.drawImage(fpCanvas, x, y, s, s);
    const m = Math.round(Math.min(W,H)*0.045);
    vctx.textAlign = 'left';
    vctx.fillStyle = '#ffb45a';
    vctx.font = `600 ${Math.round(m*0.62)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    vctx.fillText('MAGI // ACOUSTIC FINGERPRINT', m, m);
    vctx.fillStyle = 'rgba(255,180,90,0.75)';
    vctx.font = `500 ${Math.round(m*0.5)}px ui-monospace, monospace`;
    vctx.fillText((fpName||'LIVE INPUT').toUpperCase().slice(0,42), m, m + Math.round(m*0.85));
    vctx.restore();
  }
  function fpSave(){
    const c = document.createElement('canvas'); c.width = c.height = FP_SIZE;
    const x = c.getContext('2d');
    x.fillStyle = '#05040a'; x.fillRect(0,0,FP_SIZE,FP_SIZE);
    x.drawImage(fpCanvas, 0, 0);
    x.textAlign = 'left';
    x.fillStyle = '#ffb45a'; x.font = '600 26px ui-monospace, Menlo, monospace';
    x.fillText('MAGI // ACOUSTIC FINGERPRINT', 44, FP_SIZE-64);
    x.fillStyle = 'rgba(255,180,90,0.75)'; x.font = '500 20px ui-monospace, monospace';
    x.fillText((fpName||'LIVE INPUT').toUpperCase().slice(0,44), 44, FP_SIZE-34);
    c.toBlob(b => {
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url; a.download = (fpName ? fpName.replace(/\.[^.]+$/,'') : 'song') + '_fingerprint.png';
      a.click(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  }

  // ---------------- Recording ----------------
  let recorder=null, chunks=[], recStart=0, recTimer=null, recMime='video/webm';
  function startRec(){
    const stream = view.captureStream(60);
    const tracks = [...stream.getVideoTracks()];
    if (destNode && destNode.stream.getAudioTracks().length) tracks.push(...destNode.stream.getAudioTracks());
    const mixed = new MediaStream(tracks);
    // prefer MP4 (opens everywhere / socials / iOS); fall back to WebM where MP4
    // recording isn't supported (older Chrome/Firefox).
    const mime = ['video/mp4;codecs=avc1.4d002a,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4',
                  'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
                 .find(m=>MediaRecorder.isTypeSupported(m)) || 'video/webm';
    recMime = mime;
    try { recorder = new MediaRecorder(mixed, { mimeType:mime, videoBitsPerSecond:14_000_000 }); }
    catch(e){ recorder = new MediaRecorder(mixed); recMime = recorder.mimeType || 'video/webm'; }
    chunks=[];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = saveRec;
    recorder.start(); recStart=performance.now();
    recDot.style.display='inline-block'; recBtn.textContent='■ Stop';
    recTimer=setInterval(()=>{ const s=Math.floor((performance.now()-recStart)/1000); timerEl.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },250);
    if (mediaEl && mediaEl.paused) play();
  }
  function stopRec(){
    if (recorder && recorder.state!=='inactive') recorder.stop();
    recDot.style.display='none'; recBtn.textContent='● Rec'; clearInterval(recTimer);
  }
  function saveRec(){
    const ext = recMime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, {type:recMime.split(';')[0]});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href=url; a.download=`eva-visualizer-${stamp}.${ext}`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  // ---------------- Events ----------------
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  micBtn.addEventListener('click', useMic);
  playBtn.addEventListener('click', play);
  recBtn.addEventListener('click', () => { (recorder && recorder.state==='recording') ? stopRec() : startRec(); });
  ratioSel.addEventListener('change', resize);
  netBtn.addEventListener('click', () => {
    netOn = !netOn;
    netBtn.classList.toggle('primary', netOn);
    netBtn.textContent = netOn ? '🧠 Neural' : '🧠 Neural: Off';
  });
  function reflectSafe(){ safeBtn.classList.toggle('primary', safe); safeBtn.textContent = safe ? '🕊 Calm: On' : '🕊 Calm'; }
  safeBtn.addEventListener('click', () => { safe = !safe; reflectSafe(); });
  fpBtn.addEventListener('click', () => { fpMode = !fpMode; fpBtn.classList.toggle('primary', fpMode); });
  fpSaveBtn.addEventListener('click', fpSave);
  nodeSlider.addEventListener('input', () => setNodeCount(sliderToNodes(+nodeSlider.value)));
  // sync button to the OS-default calm state applied at boot
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) safe = true; } catch(e){}
  reflectSafe();

  let seeking=false;
  seek.addEventListener('input', () => { seeking=true; if (mediaEl&&mediaEl.duration) curTime.textContent=fmt((seek.value/1000)*mediaEl.duration); });
  function commitSeek(){ if (mediaEl&&mediaEl.duration) mediaEl.currentTime=(seek.value/1000)*mediaEl.duration; seeking=false; }
  seek.addEventListener('change', commitSeek);
  seek.addEventListener('pointerup', commitSeek);

  // pointer drag over the canvas influences the neural web (mouse + touch)
  function setMouse(e){
    const r = view.getBoundingClientRect();
    const lx = (e.clientX - r.left) / r.width;
    const ly = (e.clientY - r.top) / r.height;
    mouse.x = (lx - 0.5) * (W / H);   // uv.x spans ±0.5*aspect
    mouse.y = (0.5 - ly);             // uv.y spans ±0.5, screen-top is +y
  }
  view.addEventListener('pointerdown', e => {
    mouse.down = true; mouse.over = true; setMouse(e); view.style.cursor = 'grabbing';
    try { view.setPointerCapture(e.pointerId); } catch(_){}
  });
  // move always updates position: drag pulls, bare hover repels (see updateNet)
  view.addEventListener('pointermove', e => { mouse.over = true; setMouse(e); });
  const endDrag = () => { mouse.down = false; view.style.cursor = 'grab'; };
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', () => { mouse.down = false; mouse.over = false; });
  view.addEventListener('pointerleave', () => { mouse.down = false; mouse.over = false; });

  // accept by MIME *or* extension: files dragged from many sources arrive with an
  // empty type, so a MIME-only check silently rejects perfectly good mp3s.
  const isAudioFile = f => f && (/^audio\//.test(f.type) || /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba|webm|aiff?|3gp)$/i.test(f.name||''));
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (isAudioFile(f)) loadFile(f);
    else if (f) alert('Please drop an audio file (mp3, wav, m4a, ogg, flac…).');
  });
  window.addEventListener('resize', resize);

  // ---------------- Boot ----------------
  try {
    ensureAudio();          // needed so fft texture width is known
    resize();
    createRenderer();

    // default calm mode to the OS "reduce motion" setting
    try { safe = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

    // ---- evaluation harness hook ----
    // Renders a DETERMINISTIC frame from URL params (no audio needed) so the
    // assistant can screenshot specific states headlessly and measure them.
    // e.g. eva.html?test=1&bass=0.9&beat=1&theme=4&t=2  or &safe=1
    const P = new URLSearchParams(location.search);
    if (P.has('test')) {
      const tp = (k,d) => { const v=P.get(k); return v===null ? d : parseFloat(v); };
      const th = THEMES[Math.max(0, Math.min(THEMES.length-1, tp('theme',0)|0))];
      themeSel.value = String(THEMES.indexOf(th));
      safe  = tp('safe',0) > 0.5;
      netOn = tp('net',1) > 0.5;
      const bass=tp('bass',0.1), mid=tp('mid',0.1), treb=tp('treb',0.1), bt=tp('beat',0), tf=tp('t',2.0);
      const energy = bass*0.6 + mid*0.3 + treb*0.1;
      const ex = P.has('expo') ? tp('expo',1) : Math.max(0.5, 1.0/(1.0+energy*1.25));
      for (let i=0;i<freqData.length;i++){
        let v = i<40 ? bass*255*(1.0-i/80) : (i<220 ? mid*255 : treb*255);
        freqData[i] = Math.max(0, Math.min(255, v|0));
      }
      beat = bt;
      if (P.has('nodes')) setNodeCount(tp('nodes', currentN)|0);
      // coalescence override for headless verification: ?coh=1&shape=2
      if (P.has('coh'))   testCoh = tp('coh',1);
      if (P.has('shape')) shapeIdx = Math.max(0, Math.min(SHAPES.length-1, tp('shape',0)|0));
      if (P.has('coil'))  coil  = tp('coil',0);   // breathing overrides for headless verify
      if (P.has('burst')) burst = tp('burst',0);
      // simulate cursor for headless verification: ?mx=..&my=..&md=1 (drag) or &mh=1 (hover)
      mouse.x = tp('mx',0); mouse.y = tp('my',0);
      mouse.down = tp('md',0) > 0.5; mouse.over = mouse.down || tp('mh',0) > 0.5;
      // headless fingerprint check: synthesize a song, accrete the ring, show it
      if (P.has('fp')){
        for (let step=0; step<3000; step++){          // synthesize a song into the ring
          const prog = step/3000, sT = prog*TURN_SECS;
          for (let i=0;i<freqData.length;i++){
            const lo = Math.exp(-i/26)*(0.55+0.45*Math.sin(prog*22+i*0.12));
            const md = (i>40&&i<220)? (0.25+0.5*prog)*Math.abs(Math.sin(prog*9+i*0.05)) : 0;
            const hi = (i>=220)? (0.08+0.6*prog)*Math.abs(Math.sin(prog*34+i*0.02)) : 0;
            freqData[i] = Math.max(0, Math.min(255, (lo+md+hi)*255*(0.4+0.6*Math.abs(Math.sin(prog*5)))));
          }
          beat  = (step % 55 < 2) ? 1 : 0;
          burst = (Math.abs(prog-0.30)<0.004 || Math.abs(prog-0.66)<0.004 || Math.abs(prog-0.9)<0.004) ? 1.2 : 0;
          fpTick(sT);
        }
        fpName = 'DEMO TRACK'; fpMode = true; hint.classList.add('hidden');
        let _ff = 0;
        (function fpLoop(){                            // redraw a few frames (survives resize-clear)
          vctx.fillStyle = '#05040a'; vctx.fillRect(0,0,W,H);
          drawFingerprint();
          if (++_ff < 8) requestAnimationFrame(fpLoop);
        })();
        return;
      }
      hint.classList.add('hidden');
      let _tframes = 0;
      (function testLoop(){
        gl.uniform2f(uni.u_res, W, H);
        gl.uniform1f(uni.u_time, tf);
        gl.uniform1f(uni.u_bass, bass); gl.uniform1f(uni.u_mid, mid); gl.uniform1f(uni.u_treble, treb);
        gl.uniform1f(uni.u_beat, bt);
        gl.uniform1f(uni.u_exposure, ex);
        gl.uniform1f(uni.u_safe, safe?0.2:1.0);
        gl.uniform3fv(uni.u_c1, th.c1); gl.uniform3fv(uni.u_c2, th.c2);
        gl.bindTexture(gl.TEXTURE_2D, fftTex);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, freqData.length, 1, gl.RED, gl.UNSIGNED_BYTE, freqData);
        updateNet(0, 1.0);
        gl.uniform3fv(uni.u_nodes, nodeBuf); gl.uniform4fv(uni.u_edges, edgeBuf);
        gl.uniform1f(uni.u_net, netOn?1:0);
        gl.uniform1f(uni.u_coh, netOn ? coh : 0);
        gl.uniform1f(uni.u_coil, coil); gl.uniform1f(uni.u_burst, burst);
        gl.uniform2fv(uni.u_fig, figBuf); gl.uniform1i(uni.u_figN, figN);
        gl.uniform3fv(uni.u_figA, figA); gl.uniform3fv(uni.u_figB, figB);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        vctx.drawImage(glCanvas, 0, 0, W, H);
        drawHUD({bass,mid,treb,energy}, tf*1000);
        // render a few static frames then STOP so headless virtual-time can idle
        // (the frame is deterministic, so this settles immediately) and screenshot.
        if (++_tframes < 6) requestAnimationFrame(testLoop);
      })();
      return; // skip the normal idle preview
    }

    // idle preview so it isn't blank before audio loads
    (function idle(now){
      if (!running) {
        now = now || performance.now();
        gl.uniform2f(uni.u_res, W, H);
        gl.uniform1f(uni.u_time, now/1000);
        gl.uniform1f(uni.u_bass, 0.12+0.05*Math.sin(now/700));
        gl.uniform1f(uni.u_mid, 0.1); gl.uniform1f(uni.u_treble, 0.1);
        gl.uniform1f(uni.u_beat, 0.0);
        gl.uniform1f(uni.u_exposure, 1.0);
        gl.uniform1f(uni.u_safe, safeVal());
        const th = THEMES[+themeSel.value];
        gl.uniform3fv(uni.u_c1, th.c1); gl.uniform3fv(uni.u_c2, th.c2);
        applyNet(now);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        vctx.drawImage(glCanvas, 0, 0, W, H);
        drawHUD({bass:0,mid:0,treb:0,energy:0}, now);
        requestAnimationFrame(idle);
      }
    })();
  } catch(err) {
    document.getElementById('hint').innerHTML =
      '<div class="big" style="color:#e2231a">WEBGL2 ERROR</div><div class="small">'+err.message+'</div>';
  }
})();
</script>
</body>
</html>
